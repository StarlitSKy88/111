<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/admin-guard.js"></script>
  <script>
    var API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:3001'
      : window.location.origin;
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OPC数据管理后台">
  <meta name="theme-color" content="#111110">
  <title>OPC管理后台</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111110'/><circle cx='16' cy='16' r='12' stroke='%23C0392B' stroke-width='1.5' fill='none'/><circle cx='16' cy='16' r='5' fill='%23C0392B'/></svg>">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #111110;
      --surface: #1A1A18;
      --text-primary: #F0EDE6;
      --text-secondary: #7A7670;
      --text-tertiary: #4A4644;
      --accent: #C0392B;
      --line: #2A2A28;
      --success: #22c55e;
      --warning: #eab308;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .text-label {
      font-size: 0.625rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* Layout */
    .admin-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 clamp(1rem, 3vw, 2rem);
    }

    /* Header */
    .admin-header {
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .admin-title {
      font-size: 0.6875rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      font-size: 0.6875rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      border-color: var(--text-secondary);
      color: var(--text-primary);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: #a93226;
      border-color: #a93226;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--line);
      margin: 1.5rem 0;
    }

    @media (min-width: 640px) {
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .stat-cell {
      background: var(--bg);
      padding: 1.25rem;
      text-align: center;
    }

    .stat-cell .value {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 100;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .stat-cell.accent .value { color: var(--accent); }
    .stat-cell.success .value { color: var(--success); }

    .stat-cell .label {
      font-size: 0.5625rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-top: 0.25rem;
    }

    /* Two Column Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }

    @media (min-width: 1024px) {
      .dashboard-grid {
        grid-template-columns: 1fr 380px;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 1.25rem;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      font-size: 0.625rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* Score Distribution */
    .score-dist {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--line);
    }

    .score-bar {
      background: var(--bg);
      padding: 0.75rem 0.5rem;
      text-align: center;
    }

    .score-bar .bar {
      height: 3px;
      background: var(--text-tertiary);
      margin-bottom: 0.5rem;
      position: relative;
    }

    .score-bar .bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--accent);
    }

    .score-bar .count {
      font-size: 1rem;
      font-weight: 300;
      color: var(--text-primary);
    }

    .score-bar .range {
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      color: var(--text-tertiary);
      margin-top: 0.25rem;
    }

    /* Table */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }

    .data-table th {
      text-align: left;
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.5625rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      font-weight: 400;
    }

    .data-table td {
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--line);
      color: var(--text-secondary);
    }

    .data-table tr:hover td {
      background: rgba(255,255,255,0.02);
    }

    .data-table .score {
      font-size: 1.125rem;
      font-weight: 300;
      color: var(--accent);
    }

    .data-table .time {
      font-size: 0.6875rem;
      color: var(--text-tertiary);
    }

    /* Role badge */
    .role-badge {
      display: inline-block;
      padding: 0.125rem 0.375rem;
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .role-badge.admin { background: var(--accent); color: #fff; }
    .role-badge.paid { background: var(--success); color: #000; }
    .role-badge.free { background: var(--text-tertiary); color: #fff; }

    .paid-badge {
      display: inline-block;
      padding: 0.125rem 0.375rem;
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--success);
      color: #000;
    }

    .unpaid-badge {
      display: inline-block;
      padding: 0.125rem 0.375rem;
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--text-tertiary);
      color: var(--bg);
    }

    /* Action buttons */
    .action-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text-secondary);
      padding: 0.25rem 0.5rem;
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 0.25rem;
    }

    .action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .action-btn.danger:hover {
      border-color: #dc2626;
      color: #dc2626;
    }

    /* Tab buttons */
    .tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text-tertiary);
      padding: 0.5rem 1rem;
      font-size: 0.6875rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn:hover {
      border-color: var(--text-secondary);
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: var(--surface);
      border-color: var(--text-secondary);
      color: var(--text-primary);
    }

    /* Search */
    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .search-input {
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text-primary);
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      flex: 1;
      min-width: 200px;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--text-secondary);
    }

    .filter-select {
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text-primary);
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .pagination-info {
      font-size: 0.6875rem;
      color: var(--text-tertiary);
    }

    .pagination-buttons {
      display: flex;
      gap: 0.25rem;
    }

    .page-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text-secondary);
      padding: 0.25rem 0.5rem;
      font-size: 0.625rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--text-secondary);
      color: var(--text-primary);
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Activity List */
    .activity-list {
      list-style: none;
    }

    .activity-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.75rem;
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    .activity-time {
      color: var(--text-tertiary);
      font-size: 0.6875rem;
    }

    /* Quick Actions */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    .quick-action {
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .quick-action:hover {
      border-color: var(--accent);
    }

    .quick-action-icon {
      font-size: 1.25rem;
      margin-bottom: 0.25rem;
    }

    .quick-action-label {
      font-size: 0.5625rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--line);
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 1rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 1.25rem;
    }

    .modal-body {
      padding: 1rem;
    }

    .modal-footer {
      padding: 1rem;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    /* Form */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.5625rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text-primary);
      padding: 0.5rem 0.75rem;
      font-size: 0.8125rem;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--text-secondary);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-tertiary);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 1px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: rotate 1s linear infinite;
      margin: 0 auto 0.5rem;
    }

    @keyframes rotate { to { transform: rotate(360deg); } }

    /* Empty */
    .empty {
      text-align: center;
      padding: 2rem;
      color: var(--text-tertiary);
      font-size: 0.75rem;
    }

    /* User Detail */
    .user-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .user-detail-item {
      background: var(--bg);
      padding: 0.75rem;
    }

    .user-detail-label {
      font-size: 0.5rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 0.25rem;
    }

    .user-detail-value {
      font-size: 0.875rem;
      color: var(--text-primary);
    }

    /* Tab content */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Responsive table wrapper */
    .table-wrapper {
      overflow-x: auto;
    }

    @media (max-width: 640px) {
      .data-table { font-size: 0.75rem; }
      .data-table th, .data-table td { padding: 0.5rem 0.25rem; }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- Header -->
    <div class="admin-header">
      <div>
        <div class="admin-title">OPC适配自测</div>
        <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.25rem;">数据管理后台</div>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="exportData()">导出数据</button>
        <button class="btn" onclick="loadData()">刷新数据</button>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-cell">
        <div class="value" id="stat-total">-</div>
        <div class="label">总测试数</div>
      </div>
      <div class="stat-cell success">
        <div class="value" id="stat-paid">-</div>
        <div class="label">已付款</div>
      </div>
      <div class="stat-cell">
        <div class="value" id="stat-unpaid">-</div>
        <div class="label">未付款</div>
      </div>
      <div class="stat-cell accent">
        <div class="value" id="stat-rate">-%</div>
        <div class="label">转化率</div>
      </div>
    </div>

    <!-- Dashboard Grid -->
    <div class="dashboard-grid">
      <!-- Main Content -->
      <div>
        <!-- Score Distribution Panel -->
        <div class="panel" style="margin-bottom: 1.5rem;">
          <div class="panel-header">
            <div class="panel-title">分数分布</div>
          </div>
          <div class="score-dist" id="score-dist">
            <div class="score-bar">
              <div class="bar"><div class="bar-fill" id="bar-80" style="width: 0%"></div></div>
              <div class="count" id="count-80">0</div>
              <div class="range">80-100</div>
            </div>
            <div class="score-bar">
              <div class="bar"><div class="bar-fill" id="bar-60" style="width: 0%"></div></div>
              <div class="count" id="count-60">0</div>
              <div class="range">60-79</div>
            </div>
            <div class="score-bar">
              <div class="bar"><div class="bar-fill" id="bar-40" style="width: 0%"></div></div>
              <div class="count" id="count-40">0</div>
              <div class="range">40-59</div>
            </div>
            <div class="score-bar">
              <div class="bar"><div class="bar-fill" id="bar-0" style="width: 0%"></div></div>
              <div class="count" id="count-0">0</div>
              <div class="range">0-39</div>
            </div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn active" data-tab="results" onclick="switchTab('results')">测试记录</button>
          <button class="tab-btn" data-tab="users" onclick="switchTab('users')">用户管理</button>
        </div>

        <!-- Results Tab -->
        <div id="tab-results" class="tab-content active">
          <div id="results-loading" class="loading">
            <div class="spinner"></div>
            <div>加载中</div>
          </div>
          <div id="results-empty" class="empty" style="display: none;">
            暂无测试数据
          </div>
          <div id="results-container" style="display: none;">
            <div class="table-wrapper">
              <table class="data-table" id="results-table">
                <thead>
                  <tr>
                    <th>分数</th>
                    <th>等级</th>
                    <th>优势</th>
                    <th>付款</th>
                    <th>微信</th>
                    <th>时间</th>
                  </tr>
                </thead>
                <tbody id="results-body"></tbody>
              </table>
            </div>
            <div class="pagination">
              <div class="pagination-info" id="results-info">显示 0-0 / 共 0 条</div>
              <div class="pagination-buttons">
                <button class="page-btn" id="results-prev" onclick="prevResultsPage()" disabled>上一页</button>
                <button class="page-btn" id="results-next" onclick="nextResultsPage()" disabled>下一页</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Users Tab -->
        <div id="tab-users" class="tab-content">
          <div class="search-box">
            <input type="text" class="search-input" id="user-search" placeholder="搜索用户名..." oninput="filterUsers()">
            <select class="filter-select" id="role-filter" onchange="filterUsers()">
              <option value="">全部角色</option>
              <option value="admin">管理员</option>
              <option value="paid">付费用户</option>
              <option value="free">免费用户</option>
            </select>
          </div>
          <div id="users-loading" class="loading">
            <div class="spinner"></div>
            <div>加载用户中</div>
          </div>
          <div id="users-empty" class="empty" style="display: none;">
            暂无用户数据
          </div>
          <div id="users-container" style="display: none;">
            <div class="table-wrapper">
              <table class="data-table" id="users-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>邮箱</th>
                    <th>角色</th>
                    <th>注册时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="users-body"></tbody>
              </table>
            </div>
            <div class="pagination">
              <div class="pagination-info" id="users-info">显示 0-0 / 共 0 条</div>
              <div class="pagination-buttons">
                <button class="page-btn" id="users-prev" onclick="prevUsersPage()" disabled>上一页</button>
                <button class="page-btn" id="users-next" onclick="nextUsersPage()" disabled>下一页</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <div>
        <!-- Quick Actions -->
        <div class="panel" style="margin-bottom: 1.5rem;">
          <div class="panel-header">
            <div class="panel-title">快捷操作</div>
          </div>
          <div class="quick-actions">
            <div class="quick-action" onclick="switchTab('users'); document.getElementById('user-search').focus();">
              <div class="quick-action-icon">◈</div>
              <div class="quick-action-label">搜索用户</div>
            </div>
            <div class="quick-action" onclick="exportData('json')">
              <div class="quick-action-icon">↓</div>
              <div class="quick-action-label">导出JSON</div>
            </div>
            <div class="quick-action" onclick="exportData('csv')">
              <div class="quick-action-icon">↓</div>
              <div class="quick-action-label">导出CSV</div>
            </div>
            <div class="quick-action" onclick="refreshAll()">
              <div class="quick-action-icon">↻</div>
              <div class="quick-action-label">刷新全部</div>
            </div>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">最近活动</div>
          </div>
          <ul class="activity-list" id="activity-list">
            <li class="empty">暂无活动记录</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- User Detail Modal -->
  <div id="user-modal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">用户详情</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="user-modal-body"></div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">关闭</button>
        <button class="btn btn-danger" id="delete-user-btn" onclick="deleteUser()">删除用户</button>
      </div>
    </div>
  </div>

  <script>
    let allResults = [];
    let allUsers = [];
    let filteredUsers = [];
    let resultsPage = 1;
    let usersPage = 1;
    const pageSize = 10;
    let currentUserId = null;

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.toggle('active', content.id === 'tab-' + tab);
      });
      if (tab === 'users' && allUsers.length === 0) {
        loadUsers();
      }
    }

    async function loadData() {
      document.getElementById('results-loading').style.display = 'block';
      document.getElementById('results-empty').style.display = 'none';
      document.getElementById('results-container').style.display = 'none';

      try {
        const [statsRes, resultsRes] = await Promise.all([
          fetch(API_BASE + '/api/stats'),
          fetch(API_BASE + '/api/admin/results')
        ]);

        const stats = await statsRes.json();
        const resultsData = await resultsRes.json();

        allResults = resultsData.data || [];

        // 更新统计
        document.getElementById('stat-total').textContent = stats.totalTests || 0;
        document.getElementById('stat-paid').textContent = stats.paidTests || 0;
        document.getElementById('stat-unpaid').textContent = stats.unpaidTests || 0;
        document.getElementById('stat-rate').textContent = (stats.conversionRate || 0) + '%';

        // 更新分数分布
        const dist = stats.scoreDistribution || {};
        const maxCount = Math.max(dist['80-100'] || 0, dist['60-79'] || 0, dist['40-59'] || 0, dist['0-39'] || 0, 1);

        ['80-100', '60-79', '40-59', '0-39'].forEach(range => {
          const count = dist[range] || 0;
          const barId = range === '80-100' ? 'bar-80' : range === '60-79' ? 'bar-60' : range === '40-59' ? 'bar-40' : 'bar-0';
          const countId = range === '80-100' ? 'count-80' : range === '60-79' ? 'count-60' : range === '40-59' ? 'count-40' : 'count-0';
          document.getElementById(countId).textContent = count;
          document.getElementById(barId).style.width = (count / maxCount * 100) + '%';
        });

        // 渲染表格
        renderResultsTable();
        addActivity('加载了测试数据');

      } catch (error) {
        console.error('Load error:', error);
        document.getElementById('results-empty').style.display = 'block';
        document.getElementById('results-empty').textContent = '数据加载失败';
      }

      document.getElementById('results-loading').style.display = 'none';
    }

    async function loadUsers() {
      document.getElementById('users-loading').style.display = 'block';
      document.getElementById('users-empty').style.display = 'none';
      document.getElementById('users-container').style.display = 'none';

      try {
        const token = localStorage.getItem('opc_token');
        const response = await fetch(API_BASE + '/api/admin/users', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || '获取用户列表失败');
        }

        allUsers = data.data || [];
        filteredUsers = [...allUsers];
        renderUsersTable();
        addActivity('加载了用户列表 (' + allUsers.length + ' 人)');

      } catch (error) {
        console.error('Load users error:', error);
        document.getElementById('users-empty').style.display = 'block';
        document.getElementById('users-empty').textContent = '加载失败: ' + error.message;
      }

      document.getElementById('users-loading').style.display = 'none';
    }

    function filterUsers() {
      const search = document.getElementById('user-search').value.toLowerCase();
      const role = document.getElementById('role-filter').value;

      filteredUsers = allUsers.filter(u => {
        const matchSearch = !search || (u.username && u.username.toLowerCase().includes(search)) || (u.email && u.email.toLowerCase().includes(search));
        const matchRole = !role || u.role === role;
        return matchSearch && matchRole;
      });

      usersPage = 1;
      renderUsersTable();
    }

    function renderResultsTable() {
      if (allResults.length === 0) {
        document.getElementById('results-empty').style.display = 'block';
        document.getElementById('results-container').style.display = 'none';
        return;
      }

      document.getElementById('results-empty').style.display = 'none';
      document.getElementById('results-container').style.display = 'block';

      const start = (resultsPage - 1) * pageSize;
      const end = start + pageSize;
      const pageData = allResults.slice(start, end);

      const tbody = document.getElementById('results-body');
      tbody.innerHTML = pageData.map(r => {
        const date = new Date(r.timestamp);
        const timeStr = date.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

        const levelMap = {
          '高度适合': 'high',
          '适合': 'medium-high',
          '中等': 'medium',
          '不太适合': 'low'
        };

        return `
          <tr>
            <td><span class="score">${r.fit_score}</span></td>
            <td><span class="level-badge" style="font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.125rem 0.375rem; border: 1px solid var(--line);">${r.fit_level || '-'}</span></td>
            <td style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${(r.strengths || []).slice(0, 2).join(', ') || '-'}</td>
            <td>${r.paid ? '<span class="paid-badge">已付</span>' : '<span class="unpaid-badge">未付</span>'}</td>
            <td style="color: var(--accent);">${r.wechat_id || '-'}</td>
            <td class="time">${timeStr}</td>
          </tr>
        `;
      }).join('');

      updateResultsPagination();
    }

    function renderUsersTable() {
      if (filteredUsers.length === 0) {
        document.getElementById('users-empty').style.display = 'block';
        document.getElementById('users-container').style.display = 'none';
        return;
      }

      document.getElementById('users-empty').style.display = 'none';
      document.getElementById('users-container').style.display = 'block';

      const start = (usersPage - 1) * pageSize;
      const end = start + pageSize;
      const pageData = filteredUsers.slice(start, end);

      const tbody = document.getElementById('users-body');
      tbody.innerHTML = pageData.map(u => {
        const date = new Date(u.created_at);
        const timeStr = date.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

        const roleClass = u.role === 'admin' ? 'admin' : u.role === 'paid' ? 'paid' : 'free';

        return `
          <tr>
            <td style="color: var(--text-tertiary); font-size: 0.75rem;">${u.id}</td>
            <td>${u.username || '-'}</td>
            <td style="color: var(--text-secondary);">${u.email || '-'}</td>
            <td><span class="role-badge ${roleClass}">${u.role || 'free'}</span></td>
            <td class="time">${timeStr}</td>
            <td>
              <button class="action-btn" onclick="viewUser('${u.id}')">查看</button>
              ${u.role !== 'admin' ? `
                <button class="action-btn" onclick="setUserRole('${u.id}', 'paid')">付费</button>
                <button class="action-btn" onclick="setUserRole('${u.id}', 'free')">免费</button>
                <button class="action-btn danger" onclick="confirmDeleteUser('${u.id}')">删除</button>
              ` : ''}
            </td>
          </tr>
        `;
      }).join('');

      updateUsersPagination();
    }

    function updateResultsPagination() {
      const total = allResults.length;
      const start = (resultsPage - 1) * pageSize + 1;
      const end = Math.min(resultsPage * pageSize, total);

      document.getElementById('results-info').textContent = total > 0 ? `显示 ${start}-${end} / 共 ${total} 条` : '无数据';
      document.getElementById('results-prev').disabled = resultsPage <= 1;
      document.getElementById('results-next').disabled = end >= total;
    }

    function updateUsersPagination() {
      const total = filteredUsers.length;
      const start = (usersPage - 1) * pageSize + 1;
      const end = Math.min(usersPage * pageSize, total);

      document.getElementById('users-info').textContent = total > 0 ? `显示 ${start}-${end} / 共 ${total} 条` : '无数据';
      document.getElementById('users-prev').disabled = usersPage <= 1;
      document.getElementById('users-next').disabled = end >= total;
    }

    function prevResultsPage() {
      if (resultsPage > 1) {
        resultsPage--;
        renderResultsTable();
      }
    }

    function nextResultsPage() {
      if (resultsPage * pageSize < allResults.length) {
        resultsPage++;
        renderResultsTable();
      }
    }

    function prevUsersPage() {
      if (usersPage > 1) {
        usersPage--;
        renderUsersTable();
      }
    }

    function nextUsersPage() {
      if (usersPage * pageSize < filteredUsers.length) {
        usersPage++;
        renderUsersTable();
      }
    }

    function viewUser(userId) {
      const user = allUsers.find(u => u.id == userId);
      if (!user) return;

      currentUserId = userId;

      const date = new Date(user.created_at);

      document.getElementById('user-modal-body').innerHTML = `
        <div class="user-detail-grid">
          <div class="user-detail-item">
            <div class="user-detail-label">用户ID</div>
            <div class="user-detail-value">${user.id}</div>
          </div>
          <div class="user-detail-item">
            <div class="user-detail-label">用户名</div>
            <div class="user-detail-value">${user.username || '-'}</div>
          </div>
          <div class="user-detail-item">
            <div class="user-detail-label">邮箱</div>
            <div class="user-detail-value">${user.email || '-'}</div>
          </div>
          <div class="user-detail-item">
            <div class="user-detail-label">角色</div>
            <div class="user-detail-value"><span class="role-badge ${user.role === 'admin' ? 'admin' : user.role === 'paid' ? 'paid' : 'free'}">${user.role || 'free'}</span></div>
          </div>
          <div class="user-detail-item">
            <div class="user-detail-label">注册时间</div>
            <div class="user-detail-value">${date.toLocaleString('zh-CN')}</div>
          </div>
          <div class="user-detail-item">
            <div class="user-detail-label">邮箱验证</div>
            <div class="user-detail-value">${user.email_verified ? '✓ 已验证' : '× 未验证'}</div>
          </div>
        </div>
        ${user.role !== 'admin' ? `
          <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
            <button class="btn" onclick="setUserRole('${userId}', 'paid'); closeModal();">设为付费</button>
            <button class="btn" onclick="setUserRole('${userId}', 'free'); closeModal();">设为免费</button>
          </div>
        ` : ''}
      `;

      document.getElementById('user-modal').style.display = 'flex';
      addActivity('查看了用户 ' + (user.username || userId));
    }

    function closeModal() {
      document.getElementById('user-modal').style.display = 'none';
      currentUserId = null;
    }

    function confirmDeleteUser(userId) {
      if (!confirm('确定要删除用户 ' + userId + ' 吗？此操作不可恢复。')) return;
      deleteUser(userId);
    }

    async function deleteUser(userId) {
      const userIdToDelete = userId || currentUserId;
      if (!userIdToDelete) return;

      try {
        const token = localStorage.getItem('opc_token');
        const response = await fetch(API_BASE + '/api/admin/delete-user', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ userId: userIdToDelete })
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || '删除失败');
        }

        alert('用户已删除');
        closeModal();
        addActivity('删除了用户 ' + userIdToDelete);
        loadUsers();

      } catch (error) {
        alert('删除失败: ' + error.message);
      }
    }

    async function setUserRole(userId, role) {
      try {
        const token = localStorage.getItem('opc_token');
        const response = await fetch(API_BASE + '/api/admin/set-role', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ userId, role })
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || '修改失败');
        }

        addActivity('将用户 ' + userId + ' 设为 ' + role);
        if (document.getElementById('tab-users').classList.contains('active')) {
          loadUsers();
        }

      } catch (error) {
        alert('修改失败: ' + error.message);
      }
    }

    function exportData(format = 'json') {
      if (format === 'json') {
        const data = {
          stats: {
            total: document.getElementById('stat-total').textContent,
            paid: document.getElementById('stat-paid').textContent,
            unpaid: document.getElementById('stat-unpaid').textContent,
            rate: document.getElementById('stat-rate').textContent
          },
          results: allResults,
          users: allUsers,
          exportTime: new Date().toISOString()
        };
        downloadFile(JSON.stringify(data, null, 2), 'opc-export.json', 'application/json');
      } else if (format === 'csv') {
        let csv = 'ID,用户名,邮箱,角色,注册时间,邮箱验证\n';
        allUsers.forEach(u => {
          csv += `${u.id},"${u.username || ''}","${u.email || ''}","${u.role || 'free'}","${new Date(u.created_at).toLocaleString('zh-CN')}",${u.email_verified || false}\n`;
        });
        downloadFile(csv, 'opc-users.csv', 'text/csv');
      }
      addActivity('导出了 ' + format.toUpperCase() + ' 数据');
    }

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function refreshAll() {
      loadData();
      if (document.getElementById('tab-users').classList.contains('active')) {
        loadUsers();
      }
      addActivity('刷新了全部数据');
    }

    function addActivity(text) {
      const list = document.getElementById('activity-list');
      const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

      // Remove empty message if present
      if (list.querySelector('.empty')) {
        list.innerHTML = '';
      }

      const item = document.createElement('li');
      item.className = 'activity-item';
      item.innerHTML = `<span>${text}</span><span class="activity-time">${time}</span>`;
      list.insertBefore(item, list.firstChild);

      // Keep only last 10
      while (list.children.length > 10) {
        list.removeChild(list.lastChild);
      }
    }

    // Close modal on escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Initial load
    loadData();
  </script>
</body>
</html>
