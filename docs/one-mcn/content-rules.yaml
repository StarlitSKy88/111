# ============== 晚站会数据汇总 ==============
daily_review:
  time: "20:00"
  duration_minutes: 15
  fields:
    - name: 发布数
      source: B1-publish log
      compare: vs_昨日
    - name: 完播率
      source: B2-data
      threshold: "> 30%"
    - name: 总播放
      source: B2-data
      compare: vs_昨日
    - name: 点赞
      source: B2-data
      ratio: 点赞/播放 "> 3%"
    - name: 评论
      source: B2-data
      highlight: 高赞评论 top 3
    - name: 分享
      source: B2-data
      ratio: 分享/播放 "> 1%"
    - name: 加微
      source: /go/wechat attribution
      compare: vs_昨日
    - name: 收入
      source: api/payments.json
      compare: vs_昨日
  output: 飞书 04·销售管道 (授权后)
  g0_check: true                # 同步检查 G0 熔断状态

# ============== 加微自动欢迎语 ==============
welcome:
  structure: 5_sentence         # 5 句丰富
  sentences:
    - name: 问候
      word_range: [10, 15]
      template: "你好{昵称}，我是愚者 AI。蹲过超市、盯过餐饮，AI 零基础，靠 1 套邪路子多挣 1 万。"
    - name: 认同
      word_range: [15, 25]
      template: "看到你加我，邪修老炮的规矩你懂的——不收徒、不外传，只给一路人。"
    - name: 价值
      word_range: [30, 50]
      template: "送你 1 个暗门工具: {工具名} ({url})，专给{身份}用的 AI 副业暗门。"
    - name: CTA
      word_range: [20, 30]
      template: "想知道你是{身份}吗？我给你开 1 个今天就能用的 AI 暗门。"
    - name: 邀请
      word_range: [10, 15]
      template: "回复 {身份关键词} 我把\"邪路子 AI 副业包\"发你，过时不候。"
  # 工具候选 (按身份/场景, 不按行业)
  tools_by_scenario:
    上班族: "AI 写作 (公众号 1000+ 粉) / AI 修图 (商品图一键出) / AI 视频 (短视频脚本)"
    学生: "AI 笔记 (论文整理) / AI PPT (答辩一键出) / AI 翻译 (论文精读)"
    宝妈: "AI 朋友圈 (育儿+带货) / AI 客服 (自动回评论) / AI 海报 (节日营销)"
    新人: "AI 头像 (小红书人设) / AI 写作 (知乎答主) / AI 复盘 (日报周报)"
  # 触发: 新用户加微后 1 分钟内自动发
  trigger: new_follower_added
  delay_seconds: 60

