# ONE-MCN 内容规则 (8 条授权)
# 授权日期: 2026-06-04
# 授权人: 昴君
# v1.1 变更: 2026-06-04 — 平台切换 视频号→抖音, 人设 阿泽→愚者 AI, 受众 OPC→实体店老板
# v1.1b 修正: 2026-06-04 — 受众改为"想做副业、但没 AI 基础的人"
# v1.1c 修正: 2026-06-04 — 人设加"邪修修辞包装"层 (神秘大佬 + 黑帽口罩 + 邪路子, 内容仍合规)
# 读取方: ~/.hermes/skills/one-mcn/*/SKILL.md (VPS Skills)
# 修改: 编辑本文件 + 提交 git, 蕾姆下次运行即按新规则

# ============== A4 脚本生成 ==============
script:
  # 风格
  style: dialogue              # 对话体 (1-2 句对话开场)
  word_count:
    min: 90                    # 最少 90 字
    max: 120                   # 最多 120 字
    target: 105                # 目标 105 字 (45s 口播)
  # 段落结构 (4 段式)
  structure:
    - name: 反问
      word_range: [15, 20]     # 15-20 字
      purpose: 吸引停留 (前 3s 决定 80% 完播)
    - name: 案例
      word_range: [40, 60]     # 40-60 字
      purpose: 1 个真实人物故事, 必有具体数字
    - name: 总结
      word_range: [20, 30]     # 20-30 字
      purpose: 1 句金句/方法论
    - name: CTA
      word_range: [10, 15]     # 10-15 字
      purpose: 引导评论/加微/看链接
  # 禁忌开场
  forbidden_openings:
    - 今天我们来讲
    - 大家好我是
    - 这期视频
  # 推荐开场模板 (邪修黑话 + 草根共情)
  preferred_openings:
    - "我跟你说啊，{身份}想多挣 1 万？… 这条邪路子，我只说一遍"
    - "你猜怎么着，{痛点}？… 90% 的人都走错路了"
    - "你知道吗，{反常识}？… 邪修 AI 老炮才懂的暗门"
    - "诶，{场景}？… 别人都告诉你走正路，我偏不"
    - "先说个数据：{数字}。再说个判断：{邪路子}"
  # 案例主题词 (邪修野路子 + 合规 AI 副业)
  case_themes:
    - AI 写作暗门 (公众号/小红书/知乎 一键排版)
    - AI 修图黑科技 (商品图/头像 一键出)
    - AI 视频脚本 (短视频脚本/自动剪辑 1 晚 1 条)
    - AI 客服话术 (朋友圈自动回/私域 1v1)
    - AI 数据整理 (Excel 自动化/日报/周报)
    - AI 副业邪路子 (不上班族的"暗门"组合拳)
  # 红线 (副业场景特化, 加固 v1.1c 邪修修辞边界)
  domain_red_lines:
    - 不能承诺"具体月入数字"
    - 不能诱导"躺赚 / 0 投入"
    - 不能保证"30 天学会"
    - 不能伪造"学员成功案例"
    - "邪修" 仅作修辞包装, 实际教 100% 合规内容
    - 不能擦边"刷单/黑产/黑五类"
    - 不能诱导"钻平台漏洞/批量封号"

# ============== A5 红线审查 ==============
red_lines:
  count: 7
  rules:
    - id: 极端替代
      description: 不能承诺"AI 完全替代员工/无人经营"
      keywords: [0 员工, 不用人, 无人店, 永不雇人, 全部 AI]
    - id: 融资
      description: 投资/融资/估值/上市
      keywords: [融资, 投资, 估值, IPO, 上市, 天使, A 轮]
    - id: 谎言
      description: 虚假数据/伪造案例
      keywords: [保证, 100%, 必赚, 稳赚, 躺赚, 月入]
    - id: 灰产
      description: 擦边/灰产/黑产
      keywords: [灰产, 黑产, 擦边, 偏门, 刷单]
    - id: 夸大
      description: 夸大/绝对化/违反广告法
      keywords: [最, 第一, 唯一, 顶级, 绝对, 国家级, 行业第一]
    - id: 数据外泄
      description: 不能诱导老板把核心数据交出去
      keywords: [共享经营数据, 上传客户名单, 提供给第三方, 全网公开]
    - id: 政治色情
      description: 政治/宗教/色情/暴力/低俗
      keywords: [政治, 宗教, 民族, 党派, 色情, 暴力, 低俗, 血腥]
  on_trigger:
    action: block_and_suggest
    message: "命中红线 {rule}, 不自动发布. 建议改写: {suggestion}"

# ============== A6 封面生成 ==============
cover:
  style: minimal               # 极简留白 (Ma 間)
  # 背景色 (二选一, 交替使用)
  backgrounds:
    dark: "#111110"            # 暖近黑
    light: "#F8F5F0"           # 和纸色
  # 主体
  font:
    family: "Noto Serif JP"
    weights: [200, 300]
  # 字号 (clamp)
  font_size: "clamp(48px, 8vw, 96px)"
  # 行高
  line_height: 0.95
  # 字间距
  letter_spacing: "-0.03em"
  # 强调色 (每封面 1 处)
  accent_color: "#C0392B"      # 朱红
  accent_usage: "1 个数字 或 1 个词"
  # 结构
  layout:
    - 主体 12-16 字 (居中或左对齐 1/3)
    - 底部 8px 朱红短水平线
  # 禁忌
  forbidden:
    - 圆角 (border-radius > 2px)
    - 渐变 (linear-gradient, radial-gradient)
    - 多色 (3+ colors)
    - Emoji
    - 边框包围

# ============== A7 TTS 配音 ==============
tts:
  voice: female_sophisticated  # 女性知性
  provider: minimax            # 默认 MiniMax-M3
  speed: 1.0
  pitch: 0                     # 默认
  # 停顿设置
  pauses:
    comma: 0.2s                # 逗号
    period: 0.4s               # 句号
    question: 0.5s             # 问号
  # 背景音乐
  bgm: none                    # 不加 BGM (纯净)

# ============== B1 自动发布 ==============
publish:
  # 频次
  frequency_per_day: 2
  # 发布时间 (双高峰 - 实体店老板收工后刷抖音)
  times:
    - "12:00"                  # 午间高峰
    - "21:00"                  # 晚间 (从 20:00 调至 21:00, 餐饮老板 21 点才收工)
  # 间隔
  min_interval_hours: 6
  # 平台 (本期先抖音)
  platforms:
    - name: 抖音
      enabled: true
      account_id: "113087899"
      account_name: 愚者 AI
      account_status: 空白待运营
    - name: 视频号
      enabled: false
      account_id: sphxzc9sQFa0nKy
      note: 北京枫叶工作室, 内容/视频无法修改, 暂弃
    - name: 小红书
      enabled: false
  # 人设 (v1.1c: 邪修修辞包装 + 合规内核)
  persona:
    name: 愚者 AI
    identity: 邪修 AI 老炮
    appearance:
      outfit: 黑色帽子 + 黑色口罩
      face: 从不露出
      voice: TTS 配音 (深沉男声, 非本人)
      presence: 不出镜·不直播·不收徒
    background_story: 蹲过超市拣货、盯过餐饮后厨, AI 零基础, 靠 1 套"邪路子"副业多挣 1 万
    voice_tone: 草根共情 + 邪修黑话 (野路子/老炮/暗门/不外传)
    rhetoric_layer: "邪修"  ← 这是修辞包装, 实际教 100% 合规的 AI 副业
    content_layer: 100% 合规的 AI 副业 (AI 写作/修图/视频/客服/数据/编程)
    forbidden_persona: 阿泽                  # 已弃用
    # 平台算法风险提示
    algorithm_warn: |
      抖音算法对"灰产/邪修/擦边"关键词敏感。
      实际发布时: 视频描述/标签 优先用"野路子/老炮/暗门", "邪修" 偶尔点到为止。
  # 受众
  audience:
    primary: 想做副业、但没 AI 基础的人 (上班族/学生/宝妈/新人)
    pain_point: "想用 AI 做副业, 不知道从哪开始, 工具太多看不完"
