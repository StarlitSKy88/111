  # 简介 (抖音 bio, 3 选 1, 邪修修辞包装版)
  # 2026-06-04 昴君拍板: 选 A 方案 (短句节奏版)
  bio_selected: A
  bio_locked_at: "2026-06-04"
  bio_candidates:
    A_rhythm: |  # ✅ 已锁定
      邪修 AI 老炮
      蹲过超市 盯过餐饮
      不教正路 只教暗门
      不收徒·不露脸·不直播
      关注我 每天 1 个"邪路子"
      —— 愚者 AI · 黑帽不露面
    B_story: |  # 备选
      我也曾是 AI 零基础
      正路都走不通
      后来靠 1 套"邪路子" 多挣 1 万
      现在每天 1 个 AI 暗门
      不露脸·不收徒·不外传
      —— 愚者 AI · 黑帽不露面
    C_value: |  # 备选
      AI 副业 别走正路
      正路都在卷 暗门才有钱
      我整理了 30 个"邪路子" AI 副业
      不教小白 不教学生
      只教想多挣 1 万的人
      —— 愚者 AI · 黑帽不露面
  # 标题模板 (草根共情 + 邪修黑话)
  title_templates:
    - "邪路子, 1 个视频告诉你 {身份}怎么多挣 1 万"
    - "{number}个 AI 暗门, 第{n}个最该今晚就试"
    - "你知道吗, {身份}其实能靠 {邪路子} 多挣 {金额}"
