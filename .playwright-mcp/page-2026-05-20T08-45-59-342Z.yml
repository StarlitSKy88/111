          - heading "二、30分钟完成基础加固" [level=3] [ref=e264]
          - heading "第1步：SSH加固（5分钟）" [level=4] [ref=e265]
          - code [ref=e267]: "# 1. 生成本地密钥对 ssh-keygen -t ed25519 -C \"你的邮箱\" # 2. 上传公钥到服务器 ssh-copy-id root@你的服务器IP # 3. 禁止密码登录 sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config sudo sed -i 's/#PermitRootLogin yes/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config sudo systemctl restart sshd"
          - heading "第2步：防火墙配置（5分钟）" [level=4] [ref=e268]
          - code [ref=e270]: "sudo ufw default deny incoming sudo ufw default allow outgoing sudo ufw allow 22 # SSH sudo ufw allow 80 # HTTP sudo ufw allow 443 # HTTPS sudo ufw enable"
          - heading "第3步：自动安全更新（2分钟）" [level=4] [ref=e271]
          - code [ref=e273]: "sudo apt install -y unattended-upgrades sudo dpkg-reconfigure unattended-upgrades # 选\"Yes\""
          - heading "第4步：数据库安全（10分钟）" [level=4] [ref=e274]
          - code [ref=e276]: "-- Supabase 的 Row Level Security 必须开启 ALTER TABLE users ENABLE ROW LEVEL SECURITY; -- 每个表定义谁能读、谁能写 CREATE POLICY \"用户读自己的数据\" ON users FOR SELECT USING (auth.uid() = id); -- 敏感字段不要返回给前端 -- 查询时永远不要 select * 如果包含密码/密钥字段"
          - heading "第5步：环境变量管理（3分钟）" [level=4] [ref=e277]
