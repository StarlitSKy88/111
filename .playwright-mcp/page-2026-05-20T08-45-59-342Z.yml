          - text: "信号可能发生了什么立刻做什么 CPU突然100%被装了挖矿程序`top` 查异常进程 → `kill` → 改密码 → 查SSH登录日志 数据库多了不认识的表数据库被注入/拖库立刻下线 → 从备份恢复 → 查API日志找注入点 用户反馈收到垃圾邮件邮件服务器被利用改邮箱密码 → 检查转发规则"
