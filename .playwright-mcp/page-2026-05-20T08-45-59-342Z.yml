          - text: "工具做什么怎么用 **Lynis**安全审计（扫描服务器找漏洞）`sudo apt install lynis && sudo lynis audit system` **Cloudflare**DDoS防护+CDN+WAF免费计划，域名DNS切到Cloudflare **SSL Labs**HTTPS配置评分[ssllabs.com](https://www.ssllabs.com/ssltest/) 输入域名 **Have I Been Pwned**检查域名是否泄露[haveibeenpwned.com](https://haveibeenpwned.com/domain/你的域名)"
