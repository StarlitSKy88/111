      - generic [ref=e208]:
        - generic [ref=e209]: 2026 UPDATE
        - generic [ref=e210]:
          - blockquote [ref=e211]: "**面向OPC**：Hello World跑通了，但你的页面是死的——没有数据、没有用户、没有记忆。本节点教你2026年OPC最省事的后端方案：Supabase，30分钟从零到有数据库+API。"
          - heading "一、2026年OPC为什么选Supabase" [level=3] [ref=e212]
          - heading "一句话" [level=4] [ref=e213]
          - paragraph [ref=e214]: Supabase = PostgreSQL数据库 + 自动生成的REST API + 用户认证系统 + 文件存储。开源，免费额度够用到1000个用户。
          - heading "对比：自己搭 vs Supabase" [level=4] [ref=e215]
          - table [ref=e216]:
            - rowgroup [ref=e217]:
              - row "要做的事 自己搭 Supabase" [ref=e218]:
