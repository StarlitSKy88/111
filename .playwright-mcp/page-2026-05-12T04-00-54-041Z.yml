                - cell "备份" [ref=e243]
                - cell "自己写脚本+cron（1天）" [ref=e244]
                - cell "自动每日备份" [ref=e245]
          - paragraph [ref=e246]:
            - strong [ref=e247]: OPC的铁律
            - text: ：除非你有明确的理由自建后端（比如需要复杂的自定义逻辑），否则一律用Supabase。
          - heading "二、30分钟从零到有数据的完整流程" [level=3] [ref=e248]
          - heading "步骤1：创建Supabase项目（2分钟）" [level=4] [ref=e249]
          - paragraph [ref=e250]: 1. 访问 [supabase.com](https://supabase.com) → Sign in with GitHub
          - paragraph [ref=e251]: 2. New Project → 输入项目名 → 设置数据库密码 → Create
          - paragraph [ref=e252]: 3. 等1-2分钟，项目就绪
          - heading "步骤2：建第一张表（3分钟）" [level=4] [ref=e253]
          - code [ref=e255]: "-- 在Supabase SQL Editor中执行 CREATE TABLE user_analyses ( id BIGSERIAL PRIMARY KEY, user_id UUID REFERENCES auth.users(id), input_text TEXT NOT NULL, result JSONB, created_at TIMESTAMPTZ DEFAULT NOW() ); -- 开启实时订阅 ALTER PUBLICATION supabase_realtime ADD TABLE user_analyses;"
          - heading "步骤3：开启Row Level Security（5分钟）" [level=4] [ref=e256]
          - code [ref=e258]: "-- 用户只能看到自己的数据 ALTER TABLE user_analyses ENABLE ROW LEVEL SECURITY; CREATE POLICY \"用户只能读自己的分析\" ON user_analyses FOR SELECT USING (auth.uid() = user_id); CREATE POLICY \"用户只能插入自己的分析\" ON user_analyses FOR INSERT WITH CHECK (auth.uid() = user_id);"
          - heading "步骤4：前端连接（10分钟）" [level=4] [ref=e259]
          - code [ref=e261]: "<script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2\"></script> <script> const supabase = window.supabase.createClient( 'https://你的项目ID.supabase.co', '你的anon_key' // Supabase Dashboard → Settings → API ); // 插入数据 await supabase.from('user_analyses').insert({ user_id: user.id, input_text: '用户输入的内容', result: { score: 85, suggestion: '...' } }); // 读取数据 const { data } = await supabase .from('user_analyses') .select('*') .order('created_at', { ascending: false }) .limit(10); // 实时订阅（新数据插入时自动更新页面） supabase.channel('analyses') .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'user_analyses' }, (payload) => { console.log('新数据:', payload.new); } ) .subscribe(); </script>"
          - heading "步骤5：用户认证（10分钟）" [level=4] [ref=e262]
          - code [ref=e264]: "// 邮箱注册 const { data, error } = await supabase.auth.signUp({ email: 'user@example.com', password: 'password123' }); // 邮箱登录 const { data, error } = await supabase.auth.signInWithPassword({ email: 'user@example.com', password: 'password123' }); // 获取当前用户 const { data: { user } } = await supabase.auth.getUser(); // OAuth登录（Google/GitHub，一行配置） await supabase.auth.signInWithOAuth({ provider: 'google' });"
          - heading "三、2026年Supabase免费额度" [level=3] [ref=e265]
          - text: 资源免费额度够用到多少用户 数据库500MB~10万条记录 API请求200万次/月~500日活用户 认证用户5万MAU够你用到第一轮融资 存储1GB~5000张图片 实时订阅200个并发连接~500同时在线 Edge Functions50万次调用/月够邮件发送等轻量任务
          - heading "四、什么时候该离开Supabase" [level=3] [ref=e266]
          - text: 场景方案 需要复杂后端逻辑（如支付回调处理）Supabase Edge Functions（Deno） 数据库查询太慢加索引；还慢就升级Plan 需要WebSocket之外的实时通信自建Socket.io服务器 需要对接微信支付等国内服务Edge Functions做代理转发
          - heading "五、检查清单" [level=3] [ref=e267]
