            - generic [ref=e93]: 8步总耗时
            - generic [ref=e94]: 约15分钟
            - generic [ref=e95]:
              - text: 第一次可能30分钟
              - text: 跟着做就能完成
              - text: 不需要任何设计基础
              - text: 只需要会上网
