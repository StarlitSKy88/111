        - heading "当留存率持续低迷（次日<20%）" [level=3] [ref=e328]
        - generic [ref=e330]: 留存率是你的产品价值的唯一客观评分。 如果不是技术bug导致的，那就是一件事： → 你的产品没有解决用户真正的问题。 验证方法： → 给上个月注册的10个用户发红包，做5分钟微信语音 → 问："为什么后来不用了？" → 听他们的原话，不要听"挺好用的就是没时间" 真实的答案通常是： "好用，但没觉得不用会怎样" "和朋友推荐XX了，他说YY更好用" "注册完不知道下一步该干嘛"
