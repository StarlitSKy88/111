        - generic [ref=e324]: ① 检查服务器 → Vercel dashboard 看部署状态 → Supabase dashboard 看API是否正常 → 用手机亲自访问一次 ② 检查支付 → 支付是否还能正常拉起？ → 有无支付回调失败通知？ ③ 检查封禁 → 微信有没有提示"已停止访问该网页"？ → 域名有没有被墙？ → 小程序有没有被下架/限流通知？ ④ 检查流量来源 → 百度统计→来源分析→看看哪个渠道掉量了 → 如果你靠SEO，检查搜索排名有没有掉 → 如果你靠社群，检查群里有没有人说了负面 ⑤ 找3个活跃用户直接微信问 → "这两天用我们的产品有什么不对劲吗？"
        - heading "当核心功能使用率持续偏低（<30%）" [level=3] [ref=e325]
