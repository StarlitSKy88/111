          - heading "高认知窗口锁定：像管理现金流一样管理精力" [level=2] [ref=e64]
          - paragraph [ref=e65]:
            - text: 放弃标准模板。通过为期两周的记录，精确锁定专属于你的
            - strong [ref=e66]: "\"高认知窗口\""
            - text: 。这类窗口通常在一天中出现两次，每次持续90至120分钟。
          - paragraph [ref=e67]: 判断标准极其简单：这段时间内，你能否无需任何外部刺激物，就自动进入逻辑清晰、思维活跃的状态。
          - paragraph [ref=e68]:
            - text: 一旦确认，进入单向保护模式：将直接产生收入或构建核心资产的任务，
            - strong [ref=e69]: 不可被任何事务侵占
            - text: 。窗口外时段则进行能量降级处理。
          - paragraph [ref=e71]: 任务价值 = (带来的收入或长期资产) ÷ (消耗的认知能量 + 情绪能量)。高能量回报任务必须亲自做到极致；AI可代理任务只做质检；能量吸血鬼任务直接砍掉或自动化。
