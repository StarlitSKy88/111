      - generic [ref=e15]: 一、OPC的数据展示第一原理
      - paragraph
      - heading "一个残酷的事实" [level=3] [ref=e16]
      - paragraph [ref=e17]: 用户在页面上停留的前3秒决定去留。3秒内没看懂的页面 = 用户关掉。
      - strong [ref=e18]: OPC的独特优势
      - text: ：你不是大公司，不需要做"数据大屏"。你只需要让用户看懂
      - strong [ref=e19]: 一个数字 + 一个趋势
      - text: 。
      - heading "黄金公式" [level=3] [ref=e20]
      - paragraph [ref=e21]:
        - text: ">"
        - strong [ref=e22]: 好的数据展示 = 1个大数字 × 1个趋势图 × 0个多余元素
      - list [ref=e23]:
        - listitem [ref=e24]: 大数字：48px以上，放在页面最上方，一眼看到
        - listitem [ref=e25]: 趋势图：一个简单的折线图或柱状图，展示"在变好"
        - listitem [ref=e26]: 0个多余：不要筛选器、不要导出按钮、不要对比视图
      - strong [ref=e27]: 反面案例
      - text: ：某OPC做了一个数据分析页，有7个筛选器、4种图表、3个导出格式。上线后DAU为零——因为用户打开页面后不知道看哪里。
      - strong [ref=e28]: 正面案例
      - text: ：同样是这个OPC，把数据页砍到只剩"本周收入 ¥1,247"一个大数字 + 一个7天收入折线图。DAU翻了三倍。
      - paragraph
