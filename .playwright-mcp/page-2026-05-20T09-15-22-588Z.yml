            - heading "退出准备：资产的\"去个人化\"剥离" [level=2] [ref=e58]
            - paragraph [ref=e59]: 退出交易的本质，是在出售一个脱离了你依然能运转的系统。超过半数的OPC退出失败案例，并非价格谈不拢，而是买方尽调后发现资产与创始人个人账户过度捆绑。
            - generic [ref=e60]:
              - generic [ref=e61]: 第一阶段：财务与账户的物理切断
              - generic [ref=e62]:
                - paragraph [ref=e63]: 公私混同是最致命的合规红线
                - paragraph [ref=e64]: 新《公司法》强化了对"实质一人公司"的穿透审查。必须将项目所有收入切换至独立对公账户，过往个人微信、支付宝收款历史必须导出完整流水并补开合规发票。服务器、API调用费、域名续费等运营成本必须从项目独立账户支出，严禁混合支付。
            - generic [ref=e65]:
              - generic [ref=e66]: 第二阶段：数字资产的清点与权限集中
              - generic [ref=e67]:
                - paragraph [ref=e68]: 无形资产三件套
                - paragraph [ref=e69]:
                  - text: 代码与数据权属：私有数据集和大模型微调权重已成为核心议价点。
                  - text: 社媒与分发渠道：订阅号、App Store开发者账号的所有权，若无法变更估值折价30%。
                  - text: 合约权利转让：含有"主体变更即违约"条款的合同，必须先行取得客户书面谅解。
            - generic [ref=e70]:
              - generic [ref=e71]: 第三阶段：核心能力的AI文档化封装
              - generic [ref=e72]:
                - paragraph [ref=e73]: 制作"AI可读操作包"
                - paragraph [ref=e74]:
                  - text: 录制决策逻辑：把每日判断"何时投流、何时关停、如何回复复杂客诉"的思维过程转化为结构化决策树。
                  - text: 沉淀运营提示库：整理处理业务的全部Prompt指令。一份高质量AI指令集可直接带来10%-15%的溢价。
          - generic [ref=e75]:
            - generic [ref=e76]:
