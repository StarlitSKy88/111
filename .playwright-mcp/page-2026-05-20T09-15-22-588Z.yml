                - paragraph [ref=e79]: 未完成财务切断就接触买家
                - paragraph [ref=e80]: 认为"找到买家再清理账目也不迟"。新买方律师会重点核查公私混同，若无法做出清晰切割，交易对手不仅会压价，更可能设置24-36个月的历史债务追索条款。
            - generic [ref=e81]:
