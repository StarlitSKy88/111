                  - cell "白干了" [ref=e154]
                  - cell "你用X个月买了一个别人没有的经验" [ref=e155]
            - paragraph [ref=e156]:
              - strong [ref=e157]: 2026年最成功的OPC们，平均经历过2.3个"失败"项目才找到那个赚钱的。
            - heading "二、四种退出方式" [level=3] [ref=e158]
            - heading "方式1：关停（最快，最常用）" [level=4] [ref=e159]
            - paragraph [ref=e160]:
              - strong [ref=e161]: 什么时候该关停
              - text: ：
            - text: 信号标准 连续亏损6个月总收入<总支出 用户不增长连续3个月月活无增长 你不想做了打开代码都觉得痛苦（持续1个月以上） 更好的机会来了有一个明确更赚钱/更有意义的方向
            - paragraph [ref=e162]:
              - strong [ref=e163]: 关停的正确姿势
              - text: ：
            - paragraph [ref=e164]: 1. 给现有用户发一封邮件/公告："XX产品将于X月X日停止服务。数据可在X月X日前导出。感谢你的支持。"
            - paragraph [ref=e165]: 2. 导出所有数据备份（留作纪念和复盘）
            - paragraph [ref=e166]: 3. 写一篇复盘文章：《我做了X个月的产品为什么失败了》→ 这篇文章可能比你产品赚得还多（行业内有大量失败复盘文章的阅读量>10万）
            - heading "方式2：卖掉（最赚钱，最难）" [level=4] [ref=e167]
            - paragraph [ref=e168]:
              - strong [ref=e169]: 2026年OPC产品能卖多少钱
              - text: ：
            - text: 产品状态估值范围在哪卖 有用户无收入¥5000-20000Acquire.com, 即刻/推特发帖 月收入¥1000-5000年收入×1-2倍Acquire.com, Flippa 月收入¥5000-20000年收入×2-3倍MicroAcquire, 私下 月收入>¥20000年收入×3-5倍投资人/同行直接联系
            - paragraph [ref=e170]:
              - strong [ref=e171]: 2026年OPC产品交易平台
              - text: ：
            - list [ref=e172]:
              - listitem [ref=e173]: "[Acquire.com](https://acquire.com) — 全球最大的小微SaaS交易市场"
              - listitem [ref=e174]: "[Flippa](https://flippa.com) — 适合内容站/电商/小工具"
              - listitem [ref=e175]: 即刻/推特发帖 — 中文独立开发者圈内交易
              - listitem [ref=e176]:
                - link "2026年更新" [ref=e177] [cursor=pointer]:
                  - /url: "#s2026"
            - paragraph [ref=e178]:
              - strong [ref=e179]: 卖掉前要准备的
              - text: ：
            - list [ref=e180]:
              - listitem [ref=e181]: 6个月的收入数据截图
              - listitem [ref=e182]: 用户数和增长曲线
              - listitem [ref=e183]: 技术栈文档（买家要能接手）
              - listitem [ref=e184]: 为什么卖的真实原因（买家会问）
            - heading "方式3：转为副业（最温和）" [level=4] [ref=e185]
            - paragraph [ref=e186]: 产品不赚钱但用户还在用 → 不关停，也不全力做。
            - code [ref=e188]: 转为副业的操作： 1. 服务器降到最低配置（月费¥24） 2. 关闭需要人工介入的功能（如客服咨询） 3. 设置自动回复："这个产品目前由我一个人维护，回复可能较慢" 4. 每个月花1天看看运行状态 5. 把90%的精力投入下一个产品
            - heading "方式4：开源（最有长期价值）" [level=4] [ref=e189]
            - paragraph [ref=e190]: 产品不赚钱但对社区有价值 → 开源。
            - code [ref=e192]: "# 1. 清理敏感信息 git filter-branch --force --index-filter \\ \"git rm --cached --ignore-unmatch .env\" --prune-empty -- --all # 2. Push到GitHub Public git remote add public https://github.com/你的用户名/项目名.git git push public main # 3. 写README（为什么做、怎么用、为什么不做了） # 4. 在V2EX/即刻/推特宣布开源"
            - paragraph [ref=e193]:
              - strong [ref=e194]: 开源的价值
              - text: ：GitHub上的开源项目=你的永久技术名片。很多OPC的下一个客户/合伙人，是通过他的开源项目找到他的。
            - heading "三、退出决策框架" [level=3] [ref=e195]
            - code [ref=e197]: 每个季度问自己一遍： □ 这个产品还在增长吗？（用户数/收入/我的兴趣） □ 如果今天重新选择，我还会做这个产品吗？ □ 我花在上面的时间，如果用来做别的，会不会更好？ 如果有2个以上"否" → 认真考虑退出。
            - heading "四、检查清单" [level=3] [ref=e198]
            - list [ref=e199]:
              - listitem [ref=e200]: "[ ] 已明确当前产品的退出标准（什么时候该关/卖/开源）"
              - listitem [ref=e201]: "[ ] 产品数据有定期备份"
              - listitem [ref=e202]: "[ ] 用户数据导出功能可用（关停时用户要能拿走自己的数据）"
              - listitem [ref=e203]: "[ ] 如果卖：6个月财务数据已整理"
              - listitem [ref=e204]: "[ ] 如果开源：敏感信息已清理"
            - heading "节点资源链接" [level=3] [ref=e205]
