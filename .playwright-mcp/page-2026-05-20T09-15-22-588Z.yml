                  - columnheader "资源重新配置、止损、为下一个项目腾出精力" [ref=e149]
                - row "项目死了 经验留下了" [ref=e150]:
                  - cell "项目死了" [ref=e151]
                  - cell "经验留下了" [ref=e152]
