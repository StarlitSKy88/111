                - paragraph [ref=e85]: 忽视"隐性知识"的价值交付。买家真正收购的是一个可立即投入运营的"微型盈利系统"：客户列表、自动化SOP、专属数据集。只交付代码但不交付运营逻辑，估值至少打5折。
