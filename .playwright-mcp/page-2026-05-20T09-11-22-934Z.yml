        - generic [ref=e237]:
          - blockquote [ref=e238]: "**面向OPC**：你有了第一批用户，他们觉得产品不错。现在怎么让这些用户帮你拉新用户？不花钱的那种。本节点告诉你2026年OPC最有效的三种推荐机制。"
          - heading "一、推荐的本质：给用户一个\"分享的理由\"" [level=3] [ref=e239]
          - heading "用户分享的三个动机（优先级从高到低）" [level=4] [ref=e240]
          - table [ref=e241]:
            - rowgroup [ref=e242]:
