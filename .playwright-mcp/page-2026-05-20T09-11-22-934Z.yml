                - cell "**利益**" [ref=e256]
                - cell "\"邀请好友注册，双方各得7天会员\"" [ref=e257]
                - cell "⭐ 最低（但稳定）" [ref=e258]
          - paragraph [ref=e259]:
            - strong [ref=e260]: OPC启示
            - text: ：功能里天然带"可分享的结果" > 花钱做推荐奖励。
          - heading "二、2026年OPC的三种推荐机制" [level=3] [ref=e261]
          - heading "机制1：结果卡片分享（零成本，最高效）" [level=4] [ref=e262]
          - paragraph [ref=e263]: 用户完成核心功能后，生成一张"结果卡片"：
          - code [ref=e265]: ┌──────────────────────────┐ │ 🏆 OPC适配度评分 │ │ │ │ 92 分 │ │ 超过了 95% 的创业者 │ │ │ │ "你非常适合一人创业" │ │ │ │ 测测你的 → 扫码 │ │ [产品名+二维码] │ └──────────────────────────┘
          - paragraph [ref=e266]:
            - strong [ref=e267]: 实现
            - text: "：`html2canvas`（GitHub 30k+星标）3行代码生成图片。"
          - paragraph [ref=e268]:
            - strong [ref=e269]: 数据
            - text: ：带有个人化结果的分享卡片，分享率是通用分享链接的3-5倍。
          - heading "机制2：邀请双向奖励（最稳定）" [level=4] [ref=e270]
          - code [ref=e272]: 现有用户邀请新用户 → 双方各得奖励
          - text: 奖励类型适合产品成本 7天会员SaaS/工具边际成本≈0 一次免费分析AI工具API调用成本¥0.01-0.1 ¥5优惠券电商/付费产品¥5/人
          - paragraph [ref=e273]:
            - strong [ref=e274]: 2026年避坑
            - text: ：微信严厉打击诱导分享。奖励机制不能强制要求"分享到群"才给——改成"邀请链接注册"双方得奖励。
          - heading "机制3：用户案例展示（最持久）" [level=4] [ref=e275]
          - paragraph [ref=e276]: 把用户的使用成果做成案例页面，用户天然愿意转发：
          - code [ref=e278]: "\"从0到1，我是怎么用OPC节点百科完成公司注册的\" —— 用户张三的真实经历 用户会转发这篇文章，因为： 1. 文章主角是他自己（炫耀动机） 2. 文章有价值（互助动机） 3. 顺手帮了你的产品（无成本的善意）"
          - heading "三、推荐系统的数据指标" [level=3] [ref=e279]
          - text: 指标公式基准线 推荐率使用推荐功能的用户÷总用户>10% K因子每个用户带来的新用户数>0.3（>1=病毒增长） 推荐转化率通过推荐注册÷点击推荐链接>20%
          - paragraph [ref=e280]:
            - strong [ref=e281]: OPC现实
            - text: ：K因子>0.3就很好了。K因子>1的病毒增长极其罕见，别把目标设那么高。
          - heading "四、什么时候该做推荐" [level=3] [ref=e282]
          - list [ref=e283]:
            - listitem [ref=e284]: ✅ 核心功能有可分享的结果（评分/数据/证书）
            - listitem [ref=e285]: ✅ 用户留存率>30%（用户自己愿意用，才愿意推荐）
            - listitem [ref=e286]: ❌ 产品还在MVP阶段（先把核心体验做好）
            - listitem [ref=e287]: ❌ NPS<30（用户自己都不满意，不会推荐）
          - heading "五、检查清单" [level=3] [ref=e288]
          - list [ref=e289]:
            - listitem [ref=e290]: "[ ] 至少有一种\"可分享的结果卡片\""
            - listitem [ref=e291]: "[ ] 卡片上有产品名+访问入口"
            - listitem [ref=e292]: "[ ] 邀请机制已实现（双向奖励）"
            - listitem [ref=e293]: "[ ] 推荐数据可追踪（推荐链接带来源参数）"
            - listitem [ref=e294]: "[ ] K因子>0.3"
