          - listitem [ref=e145]: 自动生成热力图（看到用户点了哪里）——这是免费功能
          - listitem [ref=e146]: 微信小程序也可接入
        - heading "接入步骤（3分钟）" [level=3] [ref=e147]
        - generic [ref=e148]:
