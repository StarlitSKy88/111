      - separator [ref=e100]
      - generic [ref=e101]:
        - heading "二、GA4 接入5分钟教程（2026年5月界面）" [level=2] [ref=e102]
        - heading "什么是GA4" [level=3] [ref=e103]
        - paragraph [ref=e104]:
          - text: Google Analytics 4，谷歌的免费网站分析工具。
          - strong [ref=e105]: 2026年最实用的免费分析方案。
        - heading "注册和接入" [level=3] [ref=e106]
        - generic [ref=e107]:
          - heading "第1步：注册GA4账号（1分钟）" [level=4] [ref=e108]
          - list [ref=e109]:
            - listitem [ref=e110]:
              - text: 打开
              - link "analytics.google.com" [ref=e111] [cursor=pointer]:
                - /url: https://analytics.google.com
            - listitem [ref=e112]: 用Google账号登录（没有的话注册一个，免费）
            - listitem [ref=e113]: 点击"创建账号" → 输入账号名称（比如你的产品名）
            - listitem [ref=e114]: 点击"创建媒体资源" → 输入产品名 + 时区选"中国标准时间"
            - listitem [ref=e115]: 点击"创建" → 选择"网站"平台
            - listitem [ref=e116]: 输入你的网站URL → 点击"创建数据流"
        - generic [ref=e117]:
          - heading "第2步：获取测量ID（30秒）" [level=4] [ref=e118]
          - paragraph [ref=e119]:
            - text: 数据流创建后，你会看到一个"测量ID"，格式为
            - code [ref=e120]: G-XXXXXXXXXX
            - text: 。复制它。
        - generic [ref=e121]:
          - heading "第3步：粘贴代码（2分钟）" [level=4] [ref=e122]
          - paragraph [ref=e123]:
            - text: 在网站每个页面的
            - code [ref=e124]: <head>
            - text: 标签内，粘贴以下代码：
          - code [ref=e126]: "<!-- Google tag (gtag.js) --> <script async src=\"https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX\"></script> <script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-XXXXXXXXXX'); </script>"
          - paragraph [ref=e127]:
            - text: 替换
            - code [ref=e128]: G-XXXXXXXXXX
            - text: 为你的测量ID。
        - generic [ref=e129]:
          - heading "第4步：验证（1分钟）" [level=4] [ref=e130]
          - paragraph [ref=e131]: 部署后，打开GA4 → 报告 → 实时。用手机打开你的网站，30秒内应该能在实时报告中看到"1个活跃用户"。
        - generic [ref=e132]:
          - generic [ref=e133]: 国内注意事项
          - paragraph [ref=e134]:
            - text: GA4依赖Google服务器，
            - strong [ref=e135]: 国内用户直接访问可能不稳定
            - text: 。如果你是用Trae做开发、主要面向国内用户，建议GA4 + 百度统计双接入（见下一章）。
          - paragraph [ref=e136]:
            - strong [ref=e137]: 补救方案
            - text: ：Vercel部署的网站可以开一个中间代理，把GA4请求转发到自己的域名上。如果不会配，直接用百度统计替代。
