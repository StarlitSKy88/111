      - generic [ref=e259]: 五、技术可行性验证
      - heading "只验证\"唯一的那个东西\"" [level=2] [ref=e260]
      - paragraph [ref=e261]: 工具选得再好，也得先验证——你的核心功能在技术上能不能实现。
      - paragraph [ref=e262]: OPC在验证阶段最容易犯的错：先做登录系统、用户权限、后台管理、设置页面……然后累死在半路上。
