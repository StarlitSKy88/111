      - heading "\"人造现实\"验证法：用造假装一个真的" [level=3] [ref=e281]
      - paragraph [ref=e282]: 不需要先构建完整后端。用这三个递进层次：
      - generic [ref=e283]:
        - generic [ref=e284]:
          - heading "L1：录屏原型（半天）" [level=4] [ref=e285]
          - paragraph [ref=e286]: 用任何录屏工具录一段操作演示。发给目标用户问："如果你有这个，你会用吗？"——零代码验证需求。
        - generic [ref=e287]:
          - heading "L2：硬编码响应（一天）" [level=4] [ref=e288]
          - paragraph [ref=e289]: 前端做完整，但后端所有返回值都是写死的。用户点击"分析"，永远返回同一份模拟结果。验证的是交互流程。
        - generic [ref=e290]:
          - heading "L3：绿野仙踪模式（两天）" [level=4] [ref=e291]
          - paragraph [ref=e292]: 前端完整 + 用户提交后你手动用AI处理 + 粘贴结果回去。在用户看来系统是"自动"的，实际你是幕后的法师。
      - heading "72小时微型实验" [level=3] [ref=e293]
      - paragraph [ref=e294]:
        - text: •
        - strong [ref=e295]: 招募：
        - text: 5-10个正在经历你解决的问题的人（不是"对品类感兴趣的"，是"现在就在痛"的）
        - text: •
        - strong [ref=e296]: 观察：
        - text: 不要问"你觉得怎么样"，而是看——他能不能不问你就理解第一步操作？有没有出现超过10秒的停滞？
        - text: •
        - strong [ref=e297]: 边界：
        - text: 72小时，5-15人，一个核心行为完成率。这是OPC最残酷也最诚实的验证边界。
