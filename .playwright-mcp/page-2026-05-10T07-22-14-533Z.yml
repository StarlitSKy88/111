          - paragraph [ref=e194]:
            - strong [ref=e195]: Copilot Chat：
            - text: 在IDE内直接对话，可以选中代码问"这段为什么慢"。
          - paragraph [ref=e196]:
            - strong [ref=e197]: 弱点：
            - text: 代理能力弱于Cursor和Claude Code，只能做单文件级别的修改，做不到跨文件的自主重构。
          - generic [ref=e198]: Individual $10/月
        - generic [ref=e199]:
          - heading "4. Claude Code — 最聪明的\"外包工程师\"" [level=4] [ref=e200]
