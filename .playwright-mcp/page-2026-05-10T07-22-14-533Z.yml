      - generic [ref=e69]: 二、后端正解
      - heading "为什么OPC只需要Supabase" [level=2] [ref=e70]
      - heading "\"后端\"不是服务器" [level=3] [ref=e71]
      - paragraph [ref=e72]: 传统认知里，做产品需要：买服务器 → 装Linux → 配Nginx → 装数据库 → 写API。这条路OPC一个人走，至少浪费30天。
