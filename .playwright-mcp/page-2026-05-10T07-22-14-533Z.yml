        - generic [ref=e168]:
          - heading "1. Trae — 国内OPC的首选IDE" [level=4] [ref=e169]
          - generic [ref=e170]: 字节跳动2025年推出，中文原生支持碾压所有竞品
          - paragraph [ref=e171]:
            - strong [ref=e172]: 核心竞争力：
            - text: 对中文技术文档、微信小程序开发、国内云服务（阿里云/腾讯云）的生态集成远超海外工具。
          - paragraph [ref=e173]:
            - strong [ref=e174]: 典型场景：
            - text: 用中文描述"做一个微信小程序登录页"，Trae能直接生成符合微信规范的完整代码。
          - paragraph [ref=e175]:
            - strong [ref=e176]: 弱点：
            - text: 海外服务（Vercel/Stripe/Supabase）的集成经验不如Cursor和GitHub Copilot丰富。
          - generic [ref=e177]: 基础版免费 · Pro ¥199/月
        - generic [ref=e178]:
          - heading "2. Cursor — 技术型OPC的日常主力" [level=4] [ref=e179]
          - generic [ref=e180]: AI IDE品类综合体验最好，"AI搭档"而非补全工具
          - paragraph [ref=e181]:
            - strong [ref=e182]: 核心竞争力：
            - text: Tab补全快如闪电（100ms级）+ Composer多文件编辑 + 项目级上下文（自动索引整个项目结构）。
          - paragraph [ref=e183]:
            - strong [ref=e184]: 代理模式：
            - text: Cursor Agent可以接收自然语言指令，自主完成"找文件→理解逻辑→多文件修改→运行测试→修复错误"的完整链路。
          - paragraph [ref=e185]:
            - strong [ref=e186]: 最大特色：
            - code [ref=e187]: .cursorrules
            - text: 文件让你定义项目级AI行为准则，相当于给你的AI搭档写了一本"员工手册"。
          - generic [ref=e188]: Pro $20/月 · Business $40/月
        - generic [ref=e189]:
          - heading "3. GitHub Copilot — 最安全的选择" [level=4] [ref=e190]
          - generic [ref=e191]: Microsoft出品，嵌入VS Code生态，"绝对不会错"
          - paragraph [ref=e192]:
