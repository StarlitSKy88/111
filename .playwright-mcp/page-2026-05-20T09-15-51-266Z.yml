    - heading "税务报到与筹划" [level=1] [ref=e9]
    - paragraph [ref=e10]: 执照到手不是终点——30天内必须报到、数电票时代发票怎么开、每季度申报怎么做、年底如何合法省税。本文覆盖OPC从注册到年度筹划的完整税务周期。
