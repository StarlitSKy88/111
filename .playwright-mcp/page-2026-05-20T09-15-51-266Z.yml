        - strong [ref=e15]: 30日内
        - text: 必须完成税务报到。实务中，执照下发后电子税务局会自动生成"新办企业待办"任务，要求
        - strong [ref=e16]: 15日内
        - text: 登录确认。
      - heading "报到操作（5分钟完成）" [level=3] [ref=e17]
