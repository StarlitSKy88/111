            - cell "系统根据经营数据动态调整额度" [ref=e102]
      - heading "额度管理" [level=3] [ref=e103]
      - paragraph [ref=e104]: 系统根据经营数据动态调整授信额度：
      - list [ref=e105]:
        - listitem [ref=e106]:
          - strong [ref=e108]: 连续6个月稳定开票缴税
          - text: → 自动提额
        - listitem [ref=e109]:
          - strong [ref=e111]: 零申报、社保为零但有大额开票
          - text: → 降额或锁票
        - listitem [ref=e112]:
          - strong [ref=e114]: 每月开票金额稳定
          - text: → 额度保持
      - heading "开票红线（绝对不能碰）" [level=3] [ref=e115]
      - paragraph [ref=e116]:
        - text: 数电票开具后
        - strong [ref=e117]: 实时同步至税务数字账户
        - text: ，申报时自动预填开票金额。开票当月必须如实申报，不能递延确认收入。
      - generic [ref=e118]:
        - generic [ref=e119]: ⚠ 过票、环开、买票冲成本 = 虚开增值税专用发票罪
        - paragraph [ref=e120]: 《刑法》第205条。一人公司法定代表人是直接责任人。
