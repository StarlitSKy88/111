          - generic [ref=e103]:
            - generic [ref=e104]: CSS
            - generic [ref=e105]:
              - generic [ref=e106]: 页面长什么样
              - generic [ref=e107]: 深色背景、白色文字、红色按钮、居中对齐...
          - generic [ref=e108]:
            - generic [ref=e109]: JS
