        - paragraph [ref=e93]: 你不需要成为前端工程师，但需要能看懂AI写的代码在干什么。以下是只需要30秒就够用的理解：
        - generic [ref=e94]:
          - generic [ref=e95]: 文件结构
          - generic [ref=e96]: ┌────────────────────────────────────────────┐ │ index.html │ │ │ │ <style>...</style> ← CSS：管"长什么样" │ │ 颜色、大小、间距、居中... │ │ │ │ <body>...</body> ← HTML：管"有什么" │ │ 标题、按钮、图片、输入框... │ │ │ │ <script>...</script> ← JS：管"干什么" │ │ 点击后弹出提示、提交数据、跳转页面... │ │ │ └────────────────────────────────────────────┘
        - generic [ref=e97]:
