            - cell "你自己准备（图标1024×1024px）" [ref=e80]
          - row "小程序截图（至少3张） 小程序内操作截图" [ref=e81]:
            - cell "小程序截图（至少3张）" [ref=e82]
            - cell "小程序内操作截图" [ref=e83]
          - row "测试账号（如需登录） 提供一个测试用的微信号/手机号" [ref=e84]:
