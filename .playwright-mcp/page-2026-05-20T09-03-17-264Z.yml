      - generic [ref=e56]: 二、微信小程序审核（国内OPC最常遇到的）
      - paragraph
      - heading "审核看什么（2026年微信审核规则）" [level=3] [ref=e57]
      - paragraph [ref=e58]: 2026年微信小程序审核变化：引入AI辅助初审，审核时长从原来的3-7天缩短至1-3天（部分类目）。但AI对违规内容的识别率提升明显，以下是最新审核要点：
      - list [ref=e59]:
        - listitem [ref=e60]:
          - strong [ref=e61]: 类目匹配
          - text: ：你的小程序选的类目必须和实际功能匹配。工具类不能选社交类，选了会被拒。
        - listitem [ref=e62]:
          - strong [ref=e63]: 资质齐全
          - text: ：涉及商业/支付/社交等类目，需要上传对应的许可证或资质证明。
        - listitem [ref=e64]:
          - strong [ref=e65]: 功能完整
          - text: ：提交审核时小程序不能是"空壳"。必须有可交互的功能。
        - listitem [ref=e66]:
          - strong [ref=e67]: 无诱导分享
          - text: ：不能有"分享到群才能用""转发得红包"等诱导行为。
        - listitem [ref=e68]:
          - strong [ref=e69]: 用户协议+隐私政策
          - text: ：必须有，且必须在用户使用前弹窗展示。
      - heading "准备材料清单" [level=3] [ref=e70]
      - table [ref=e72]:
        - rowgroup [ref=e73]:
          - row "材料 在哪获取" [ref=e74]:
