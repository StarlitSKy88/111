    - generic [ref=e36]:
      - generic [ref=e37]: 纸笔原型法：比任何软件都快
      - generic [ref=e38]:
        - generic [ref=e39]:
          - generic [ref=e40]: "1"
          - generic [ref=e41]:
            - generic [ref=e42]: 画方框
            - generic [ref=e43]: 在一张纸上画一个手机屏幕大小的矩形。在里面画3-4个方框——这是你产品的核心区域。不用画任何细节。方框就够了。
        - generic [ref=e44]:
          - generic [ref=e45]: "2"
          - generic [ref=e46]:
            - generic [ref=e47]: 写按钮名
            - generic [ref=e48]: 在每个方框旁边写一句话，说明这个方框里会发生什么。比如："用户点这里上传文件"、"这里显示分析结果"、"点这里付款"。
        - generic [ref=e49]:
          - generic [ref=e50]: "3"
          - generic [ref=e51]:
            - generic [ref=e52]: 画箭头
            - generic [ref=e53]:
              - text: 用箭头把方框连起来，表示用户的操作流程。
              - code [ref=e54]: "[首页] → [上传文件] → [分析中] → [查看结果] → [付款]"
        - generic [ref=e55]:
          - generic [ref=e56]: "4"
          - generic [ref=e57]:
            - generic [ref=e58]: 标注3个按钮
            - generic [ref=e59]: 用红笔圈出最核心的3个按钮。问自己：用户第一眼能看到它们吗？如果用户10秒内找不到——按钮位置不对。
        - generic [ref=e60]:
          - generic [ref=e61]: "5"
          - generic [ref=e62]:
            - generic [ref=e63]: 拍照
            - generic [ref=e64]: 用手机拍下这张纸。这就是你的第一版原型。
      - paragraph [ref=e66]: 2024年，一位深圳独立开发者想做小红书数据分析工具。他在咖啡馆餐巾纸上画了三个页面，照片发到即刻上配文"打算做这个，需要的人扣1"。2小时内72个回复。他周末两天用Cursor写出了第一版。如果先写代码再找用户——他可能花两周才发现需求根本不对。
    - generic [ref=e67]:
      - generic [ref=e68]: Figma入门：8步出可交互原型
      - generic [ref=e69]:
        - generic [ref=e70]:
          - generic [ref=e71]: 为什么是Figma
          - generic [ref=e72]: 免费且国内可访问
          - generic [ref=e73]:
            - text: 个人用户免费，最多3个项目
            - text: 浏览器运行，不需要安装
            - text: 国内可直接访问
            - text: AI友好：Figma截图喂给AI能直接生成代码
        - generic [ref=e74]:
          - generic [ref=e75]: 8步总耗时
          - generic [ref=e76]: 约15分钟
          - generic [ref=e77]:
            - text: 第一次可能30分钟
            - text: 跟着做就能完成
            - text: 不需要任何设计基础
            - text: 只需要会上网
      - generic [ref=e78]:
        - generic [ref=e79]:
          - generic [ref=e80]: "1"
          - generic [ref=e81]:
            - generic [ref=e82]: 注册（1分钟）
            - generic [ref=e83]: 打开 figma.com → 点击"Get started for free" → 用Google/邮箱注册 → 选择"Personal"免费计划。
        - generic [ref=e84]:
          - generic [ref=e85]: "2"
          - generic [ref=e86]:
            - generic [ref=e87]: 新建Frame（30秒）
            - generic [ref=e88]:
              - text: 点击左上角"Design file"新建文件 → 按键盘
              - code [ref=e89]: F
              - text: → 右侧面板选"iPhone 15 Pro"（或你目标用户最常用的设备尺寸）。
        - generic [ref=e90]:
          - generic [ref=e91]: "3"
          - generic [ref=e92]:
            - generic [ref=e93]: 画矩形（1分钟）
            - generic [ref=e94]:
              - text: 按键盘
              - code [ref=e95]: R
              - text: （矩形工具） → 在Frame里拖出一个矩形。这是你的一个页面区域。再按
              - code [ref=e96]: R
              - text: 多画几个矩形——每个矩形代表一个内容模块。
        - generic [ref=e97]:
          - generic [ref=e98]: "4"
          - generic [ref=e99]:
            - generic [ref=e100]: 加文字（2分钟）
            - generic [ref=e101]:
              - text: 按键盘
              - code [ref=e102]: T
              - text: （文字工具） → 点击任意位置输入文字。不用管字体、字号、颜色。你需要写的文字只有：页面标题、按钮文字（比如"上传文件""立即购买"）、每个模块的简短说明。
        - generic [ref=e103]:
          - generic [ref=e104]: "5"
          - generic [ref=e105]:
            - generic [ref=e106]: 改颜色（1分钟，可选）
            - generic [ref=e107]:
              - text: 选中任意矩形 → 右侧面板 Fill → 点颜色块 → 选一个颜色。OPC配色建议：背景用白或极浅灰，主按钮用一个鲜明颜色（比如蓝
              - code [ref=e108]: "#3B82F6"
              - text: 或红
              - code [ref=e109]: "#C0392B"
              - text: ），文字用黑。
        - generic [ref=e110]:
          - generic [ref=e111]: "6"
          - generic [ref=e112]:
            - generic [ref=e113]: 复制页面（30秒）
            - generic [ref=e114]:
              - text: 在左侧图层栏，选中你的Frame →
              - code [ref=e115]: Ctrl/⌘ + D
              - text: 复制一份。在复制出的第二个Frame里，改成另一个页面的内容。每个页面一个Frame。一个简单产品通常3-5个页面。
        - generic [ref=e116]:
          - generic [ref=e117]: "7"
          - generic [ref=e118]:
            - generic [ref=e119]: 加交互连线（3分钟）
            - generic [ref=e120]: 切换到"Prototype"模式（右上角标签）。点击第一个页面上的按钮 → 拖出蓝色的线 → 连到第二个页面。弹出的面板里选 "On click" → "Navigate to"。这样在预览模式下，点击按钮就能跳转到对应页面。
        - generic [ref=e121]:
          - generic [ref=e122]: "8"
          - generic [ref=e123]:
            - generic [ref=e124]: 手机预览（1分钟）
            - generic [ref=e125]: 安装 Figma 手机APP（iOS/Android都有）。在手机APP上打开你的文件 → 点击"播放"按钮 → 就可以像真App一样操作你的原型。发给朋友测试：让对方在手机上操作，你在旁边看——一句话都不要解释。如果对方卡住了——那是原型的问题，不是对方的问题。
