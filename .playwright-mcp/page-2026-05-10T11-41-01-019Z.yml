      - generic [ref=e238]: 总纲
      - paragraph [ref=e240]: 原型不是设计——原型是沟通工具。它是OPC和AI之间的共同语言。
      - generic [ref=e241]:
        - generic [ref=e242]: 三步出原型
        - generic [ref=e243]:
          - strong [ref=e244]: 1. 纸笔
          - text: （10分钟）→ 确认方向对不对
          - strong [ref=e245]: 2. Figma
          - text: （30分钟）→ 确认交互顺不顺
          - strong [ref=e246]: 3. 喂给AI
          - text: （5分钟）→ 变成可以运行的代码
      - paragraph [ref=e247]:
        - text: 原型的目的是被推翻。不要花2天画一个"完美"的原型——那你会不敢改它。
        - text: （本文写于2026年5月。Figma界面可能持续更新，但核心操作逻辑长期不变。）
