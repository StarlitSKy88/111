            - text: 之前：
          - code [ref=e145]: "<script> var _hmt = _hmt || []; (function() { var hm = document.createElement(\"script\"); hm.src = \"https://hm.baidu.com/hm.js?你的统计ID\"; var s = document.getElementsByTagName(\"script\")[0]; s.parentNode.insertBefore(hm, s); })(); </script>"
        - generic [ref=e146]:
          - heading "第5步" [level=4] [ref=e147]
          - paragraph [ref=e148]: 等5分钟，打开百度统计后台 → "实时访客"，用手机访问你的网站验证。
        - heading "百度统计 vs GA4" [level=3] [ref=e149]
