        - generic [ref=e137]:
          - heading "第3步" [level=4] [ref=e138]
          - paragraph [ref=e139]: 填入你的网站域名 → 获取JS代码
        - generic [ref=e140]:
          - heading "第4步" [level=4] [ref=e141]
          - paragraph [ref=e142]:
            - text: 将代码粘贴到所有页面的
