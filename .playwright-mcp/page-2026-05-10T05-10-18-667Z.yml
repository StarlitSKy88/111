      - heading "数据监控" [level=1] [ref=e26]
      - paragraph [ref=e27]: 你的产品上线了，现在每天都有数据进来。但一个人盯不过来——本章只用看3个数字，配一个5分钟就能搭好的监控系统。不需要数据分析师，不需要SQL。
