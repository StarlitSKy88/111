        - paragraph [ref=e79]: 你不是字节跳动。你有300个用户，拆10个维度后每个格子只有3个人。3个人的数据变化没有任何统计学意义。
        - paragraph [ref=e81]: OPC数据分析的原则是：盯住命门，忽略其他。
      - separator [ref=e82]
      - generic [ref=e83]:
        - heading "二、GA4 接入5分钟教程（2026年5月界面）" [level=2] [ref=e84]
        - heading "什么是GA4" [level=3] [ref=e85]
        - paragraph [ref=e86]:
          - text: Google Analytics 4，谷歌的免费网站分析工具。
          - strong [ref=e87]: 2026年最实用的免费分析方案。
        - heading "注册和接入" [level=3] [ref=e88]
        - generic [ref=e89]:
          - heading "第1步：注册GA4账号（1分钟）" [level=4] [ref=e90]
          - list [ref=e91]:
            - listitem [ref=e92]:
              - text: 打开
              - link "analytics.google.com" [ref=e93] [cursor=pointer]:
                - /url: https://analytics.google.com
            - listitem [ref=e94]: 用Google账号登录（没有的话注册一个，免费）
            - listitem [ref=e95]: 点击"创建账号" → 输入账号名称（比如你的产品名）
            - listitem [ref=e96]: 点击"创建媒体资源" → 输入产品名 + 时区选"中国标准时间"
            - listitem [ref=e97]: 点击"创建" → 选择"网站"平台
            - listitem [ref=e98]: 输入你的网站URL → 点击"创建数据流"
        - generic [ref=e99]:
          - heading "第2步：获取测量ID（30秒）" [level=4] [ref=e100]
          - paragraph [ref=e101]:
            - text: 数据流创建后，你会看到一个"测量ID"，格式为
            - code [ref=e102]: G-XXXXXXXXXX
            - text: 。复制它。
        - generic [ref=e103]:
          - heading "第3步：粘贴代码（2分钟）" [level=4] [ref=e104]
          - paragraph [ref=e105]:
            - text: 在网站每个页面的
            - code [ref=e106]: <head>
            - text: 标签内，粘贴以下代码：
          - code [ref=e108]: "<!-- Google tag (gtag.js) --> <script async src=\"https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX\"></script> <script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-XXXXXXXXXX'); </script>"
          - paragraph [ref=e109]:
            - text: 替换
            - code [ref=e110]: G-XXXXXXXXXX
            - text: 为你的测量ID。
        - generic [ref=e111]:
          - heading "第4步：验证（1分钟）" [level=4] [ref=e112]
          - paragraph [ref=e113]: 部署后，打开GA4 → 报告 → 实时。用手机打开你的网站，30秒内应该能在实时报告中看到"1个活跃用户"。
        - generic [ref=e114]:
          - generic [ref=e115]: 国内注意事项
          - paragraph [ref=e116]:
            - text: GA4依赖Google服务器，
            - strong [ref=e117]: 国内用户直接访问可能不稳定
            - text: 。如果你是用Trae做开发、主要面向国内用户，建议GA4 + 百度统计双接入（见下一章）。
          - paragraph [ref=e118]:
            - strong [ref=e119]: 补救方案
            - text: ：Vercel部署的网站可以开一个中间代理，把GA4请求转发到自己的域名上。如果不会配，直接用百度统计替代。
      - separator [ref=e120]
      - generic [ref=e121]:
        - heading "三、百度统计接入：国内用户必备" [level=2] [ref=e122]
        - heading "为什么需要百度统计" [level=3] [ref=e123]
        - list [ref=e124]:
          - listitem [ref=e125]: 服务器在国内，加载速度快（一秒之内）
          - listitem [ref=e126]: 中文后台，无学习曲线
          - listitem [ref=e127]: 自动生成热力图（看到用户点了哪里）——这是免费功能
          - listitem [ref=e128]: 微信小程序也可接入
        - heading "接入步骤（3分钟）" [level=3] [ref=e129]
        - generic [ref=e130]:
          - heading "第1步" [level=4] [ref=e131]
          - paragraph [ref=e132]:
            - text: 打开
            - link "tongji.baidu.com" [ref=e133] [cursor=pointer]:
              - /url: https://tongji.baidu.com
        - generic [ref=e134]:
          - heading "第2步" [level=4] [ref=e135]
