      - generic [ref=e88]:
        - generic [ref=e89]: 二、新公司法关键条款
        - heading "2024修订·2026年现行有效" [level=2] [ref=e90]
        - paragraph [ref=e91]: 2024年7月1日起施行的新《公司法》对OPC影响最大的三条：
        - generic [ref=e92]:
          - heading "1. 五年实缴制（第47条）" [level=4] [ref=e93]
          - paragraph [ref=e94]: 不再是"认缴一个亿、实缴五十块"的时代了。
          - paragraph [ref=e95]:
            - text: 全体股东认缴的出资额，必须在公司成立之日起
            - strong [ref=e96]: 5年内
            - text: 缴足。这是硬性规定，没有例外。
          - paragraph [ref=e97]:
            - strong [ref=e98]: 对你的影响
            - text: ：注册资本不要乱填。填100万 = 5年内要有100万现金进对公账户。
        - generic [ref=e99]:
          - heading "2. 一人公司财产独立举证责任（第23条）" [level=4] [ref=e100]
          - paragraph [ref=e102]: 一人公司股东若不能证明公司财产独立于自己财产的，应当对公司债务承担连带责任。
          - paragraph [ref=e103]:
            - text: 翻译成人话：
            - strong [ref=e104]: 不是债权人证明你混同，而是你自证清白。
            - text: 每年必须有完整审计报告，否则有限责任保护伞等于白纸。
        - generic [ref=e105]:
          - heading "3. 一人股份有限公司首次合法化（第92条）" [level=4] [ref=e106]
          - paragraph [ref=e107]: 新法首次允许设立"一人股份有限公司"。股份可以自由转让、可以分期发行——为未来融资和股权激励预留了标准接口。
