      - separator [ref=e99]
      - generic [ref=e100]:
        - heading "二、GA4 接入5分钟教程（2026年5月界面）" [level=2] [ref=e101]
        - heading "什么是GA4" [level=3] [ref=e102]
        - paragraph [ref=e103]:
          - text: Google Analytics 4，谷歌的免费网站分析工具。
          - strong [ref=e104]: 2026年最实用的免费分析方案。
        - heading "注册和接入" [level=3] [ref=e105]
        - generic [ref=e106]:
          - heading "第1步：注册GA4账号（1分钟）" [level=4] [ref=e107]
          - list [ref=e108]:
            - listitem [ref=e109]:
              - text: 打开
              - link "analytics.google.com" [ref=e110] [cursor=pointer]:
                - /url: https://analytics.google.com
            - listitem [ref=e111]: 用Google账号登录（没有的话注册一个，免费）
            - listitem [ref=e112]: 点击"创建账号" → 输入账号名称（比如你的产品名）
            - listitem [ref=e113]: 点击"创建媒体资源" → 输入产品名 + 时区选"中国标准时间"
            - listitem [ref=e114]: 点击"创建" → 选择"网站"平台
            - listitem [ref=e115]: 输入你的网站URL → 点击"创建数据流"
        - generic [ref=e116]:
          - heading "第2步：获取测量ID（30秒）" [level=4] [ref=e117]
          - paragraph [ref=e118]:
            - text: 数据流创建后，你会看到一个"测量ID"，格式为
            - code [ref=e119]: G-XXXXXXXXXX
            - text: 。复制它。
        - generic [ref=e120]:
          - heading "第3步：粘贴代码（2分钟）" [level=4] [ref=e121]
          - paragraph [ref=e122]:
            - text: 在网站每个页面的
            - code [ref=e123]: <head>
            - text: 标签内，粘贴以下代码：
          - code [ref=e125]: "<!-- Google tag (gtag.js) --> <script async src=\"https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX\"></script> <script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-XXXXXXXXXX'); </script>"
          - paragraph [ref=e126]:
            - text: 替换
            - code [ref=e127]: G-XXXXXXXXXX
            - text: 为你的测量ID。
        - generic [ref=e128]:
          - heading "第4步：验证（1分钟）" [level=4] [ref=e129]
          - paragraph [ref=e130]: 部署后，打开GA4 → 报告 → 实时。用手机打开你的网站，30秒内应该能在实时报告中看到"1个活跃用户"。
        - generic [ref=e131]:
          - generic [ref=e132]: 国内注意事项
          - paragraph [ref=e133]:
            - text: GA4依赖Google服务器，
            - strong [ref=e134]: 国内用户直接访问可能不稳定
            - text: 。如果你是用Trae做开发、主要面向国内用户，建议GA4 + 百度统计双接入（见下一章）。
          - paragraph [ref=e135]:
            - strong [ref=e136]: 补救方案
            - text: ：Vercel部署的网站可以开一个中间代理，把GA4请求转发到自己的域名上。如果不会配，直接用百度统计替代。
