        - heading "当DAU突然腰斩（连续3天）" [level=3] [ref=e323]
        - generic [ref=e325]: ① 检查服务器 → Vercel dashboard 看部署状态 → Supabase dashboard 看API是否正常 → 用手机亲自访问一次 ② 检查支付 → 支付是否还能正常拉起？ → 有无支付回调失败通知？ ③ 检查封禁 → 微信有没有提示"已停止访问该网页"？ → 域名有没有被墙？ → 小程序有没有被下架/限流通知？ ④ 检查流量来源 → 百度统计→来源分析→看看哪个渠道掉量了 → 如果你靠SEO，检查搜索排名有没有掉 → 如果你靠社群，检查群里有没有人说了负面 ⑤ 找3个活跃用户直接微信问 → "这两天用我们的产品有什么不对劲吗？"
        - heading "当核心功能使用率持续偏低（<30%）" [level=3] [ref=e326]
        - generic [ref=e328]: ① 检查引导 → 新用户进来第一屏能直接看到核心功能入口吗？ → 还是藏在菜单深处？ → 用一个非技术朋友测试：打开产品，问他能在10秒内找到核心功能吗 ② 检查功能名 → 功能按钮上写的文案，用户能看懂吗？ → A/B测试两个按钮名（比如"立即分析"vs"上传文件"） ③ 检查是否有竞品 → 用户有没有直接告诉你"我觉得XX更好用"？ → 去知乎/小红书搜你的品类名，看最新评论
        - heading "当留存率持续低迷（次日<20%）" [level=3] [ref=e329]
        - generic [ref=e331]: 留存率是你的产品价值的唯一客观评分。 如果不是技术bug导致的，那就是一件事： → 你的产品没有解决用户真正的问题。 验证方法： → 给上个月注册的10个用户发红包，做5分钟微信语音 → 问："为什么后来不用了？" → 听他们的原话，不要听"挺好用的就是没时间" 真实的答案通常是： "好用，但没觉得不用会怎样" "和朋友推荐XX了，他说YY更好用" "注册完不知道下一步该干嘛"
