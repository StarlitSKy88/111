      - generic [ref=e269]: 六、注册后立即要做的三件事
      - heading "合规从第一天开始" [level=2] [ref=e270]
      - generic [ref=e271]:
        - heading "第一件：财产隔离（注册当天）" [level=4] [ref=e272]
        - paragraph [ref=e274]:
          - strong [ref=e275]: 核心铁律：公司账户与个人账户必须完全分离。
        - paragraph [ref=e276]:
          - text: 所有经营收入必须先进入公司对公账户，再通过正规渠道（工资、分红）提取至个人卡。合法提取方式：
          - strong [ref=e277]: 发工资
          - text: （签劳动合同，依法代扣个税）、
          - strong [ref=e278]: 分红
