            - heading "第二刀：只留\"用户核心任务\"" [level=4]
            - paragraph:
              - text: 问自己：
              - strong [ref=e162]: 用户打开我的产品，是为了完成什么任务？
            - list:
              - listitem [ref=e163]: 如果3秒内说不出来 → 这个功能砍掉
              - listitem [ref=e164]: 如果用户不用这个功能也能完成任务 → 砍掉
              - listitem:
