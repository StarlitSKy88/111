            - paragraph:
              - strong [ref=e166]: 砍完这一刀，6条变成3条。
            - heading "第三刀：3条里选1条最先做" [level=4]
            - paragraph: 剩下的3条核心功能，按"用户最痛的问题"排序。只做第一条，其他两条用文字先标注"即将上线"。
            - paragraph:
              - strong [ref=e167]: 砍完这一刀，只剩下1个核心功能 + 2个文字占位。
            - heading "第四刀：这1个功能，只做80%" [level=4]
            - paragraph: 一个功能有"基本流程"和"各种边界情况"。MVP只做基本流程：
            - text: 基本流程（MVP必做）边界情况（MVP不做） 用户上传简历→AI分析→显示评分上传PDF格式不对时的提示 用户下单→微信支付→支付成功支付超时后的自动退款 用户输入→AI生成→展示结果输入超过1000字时的截断处理
            - heading "三、MVP范围文档模板" [level=3] [ref=e168]
            - code [ref=e170]: "# [产品名] MVP ## 一句话价值主张 [动词] + [对象] + [结果] ## 核心指标（上线后2周内必须达到） - 注册用户：≥50人 - 核心功能使用率：≥40%（注册用户中使用核心功能的比例） - 用户反馈中\"愿意付费\"的比例：≥20% ## MVP功能清单 ### P0（必须有） 1. [核心功能1的80%] 2. 注册/登录 3. 页面能正常打开（无白屏） ### P1（最好有，没有也能上） 4. [占位功能2：标注\"即将上线\"] 5. [占位功能3：标注\"即将上线\"] ## 明确不做（P2+） - 暗色模式 - 数据导出 - 个人中心 - 消息通知 - 多语言"
            - heading "四、2026年MVP开发时间锚" [level=3] [ref=e171]
            - text: 产品类型MVP最长开发时间超过这个时间=你做的不是MVP AI工具/内容站1-2周用v0/Cursor加速，1周够了 SaaS2-4周用Supabase省掉后端时间 微信小程序2-4周含审核时间 电商2-4周用现成模板
            - paragraph:
              - strong [ref=e172]: 如果4周做不完→范围砍得不够狠。回去继续砍。
