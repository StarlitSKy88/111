          - heading "从\"周期复盘\"到\"触发式迭代\"：2026 OPC迭代范式转移" [level=2] [ref=e43]
          - paragraph [ref=e44]:
            - text: 传统迭代模型（Scrum回顾会议）在OPC场景下
            - strong [ref=e45]: 彻底失灵
            - text: 。它假设存在可以相互校验、分担认知负荷的团队，但一人公司中你既是飞行员又是地勤还是空管。
          - paragraph [ref=e46]:
            - strong [ref=e47]: 触发式迭代
            - text: ：不是被计划出来的，而是被三个硬核信号"逼"出来的。
          - paragraph [ref=e48]:
            - text: ①
            - strong [ref=e49]: 用户行为异常信号
            - text: ：当本应完成核心路径的用户在某环节表现出犹豫、折返或愤怒点击时，触发"微复盘事件"，15分钟回放录屏后立即部署修复。
          - paragraph [ref=e50]:
            - text: ②
            - strong [ref=e51]: 创始人HRV衰减信号
            - text: ：智能手表检测到心率变异性（HRV）连续下降，或AI日记发现消极语言模式，触发"红色复盘"——复盘问题不是"增长为何停滞"而是"我是否在用战术勤奋掩盖战略倦怠"。
          - paragraph [ref=e52]:
            - text: ③
            - strong [ref=e53]: 财务边界压力信号
            - text: ：当维护某旧功能投入的时间折算时薪跌破"生存底线时薪"，立即触发"杀留决策点"。
          - paragraph [ref=e55]: OPC的有效迭代不取决于复盘文档写得多好，取决于你对这些信号的触发器有多灵敏，以及你是否在这些时刻拥有按下暂停键的决断力。
