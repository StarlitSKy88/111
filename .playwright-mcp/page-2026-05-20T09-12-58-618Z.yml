          - paragraph [ref=e74]:
            - strong [ref=e75]: 外循环（用户反馈驱动）
            - text: ：只关注"口头反馈与实际行为发生矛盾"的时刻。用户嘴上说"需要这个功能"，但点击率持续为零，这就是行为冲突，是复盘的黄金原点。
          - paragraph [ref=e76]:
            - strong [ref=e77]: 内循环（自我认知驱动）
            - text: ：将"分心指数"和"能量值恢复率"纳入复盘。如果连续两周"停止"栏都有"深夜优化CSS动画导致次日判断力下降"，下周唯一关键行动是"晚上10点后禁止打开代码编辑器"。
          - paragraph [ref=e78]:
            - strong [ref=e79]: 双轨归因原则
            - text: ：产品表现不佳往往不是代码逻辑出错，而是决策疲劳或情绪透支。复盘结论必须同时包含"硬数据"和"软指标"。
          - paragraph [ref=e81]: 北极星指标（激活率/首日留存/支付转化率）是外循环的唯一目的。如果复盘结论无法对应北极星指标的微动，该迭代点就是"无效劳动"。
