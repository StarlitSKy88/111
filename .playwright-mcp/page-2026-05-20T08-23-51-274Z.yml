        - generic [ref=e26]: 节点 12 · 核心功能开发
        - heading "核心功能1开发" [level=1] [ref=e27]
        - paragraph [ref=e28]: 你已经有了登录系统、数据库。现在要做出产品的第一个核心功能——用户真正会用的那个东西。本章不是教你写代码，是教你跟AI配合的Vibecoding循环：一次Prompt → 测试 → 出错 → 修复 → 再测试，直到功能完整可用。
      - generic:
        - generic: 启动前检查清单
        - paragraph: 在给AI写任何一个字之前，先确认下面5件事：
        - generic [ref=e29]:
          - generic:
            - text: □ 1. 原型的核心页面截图打开了吗？
            - text: → 截图就是你的"需求文档"。不用写PRD。
            - text: □ 2. Supabase的表建好了吗？
            - text: → 核心功能1涉及几张表？字段都加了吗？
            - text: → 回顾节点10：每个功能至少对应一张表。
            - text: □ 3. RLS策略开了吗？
            - text: → 如果这个功能需要保护用户数据，先配好RLS（见节点11）。
            - text: □ 4. 明确"核心功能1"是什么——用一句话能说清楚吗？
            - text: → 好的描述："用户输入一个链接，系统提取关键信息并保存"
            - text: → 不好的描述："做一个内容分析工具"
            - text: □ 5. 准备好了一个干净的 git commit 起点吗？
            - text: → git status 看有没有未提交的改动
            - text: → 有的话先 commit（见节点09）
        - paragraph: 5项全部打勾 → 开始写Prompt。
