        - generic [ref=e31]: 给AI的完整Prompt模板
        - generic [ref=e33]: "【项目背景】 产品名：[你的产品名] 目标用户：[一句话描述你的用户] 核心场景：[用户打开产品后要完成什么任务] 【当前技术栈】 - 前端：纯HTML/CSS/JS，单文件应用 - 后端：Supabase（Project URL + anon key 见下方） - 认证：Supabase Auth（已实现邮箱登录） - 部署：Vercel 【Supabase信息】 - Project URL: https://xxxxxxxxxxxx.supabase.co - anon key: [你的anon key] 【本月要开发的功能】 功能名称：[核心功能1的名称] 功能描述：[用一段话说清楚这个功能从用户视角是怎么工作的] 具体交互流程： 1. 用户看到 [页面A]，上面有 [元素1、元素2] 2. 用户点击/输入 [操作描述] 3. 系统做 [后端逻辑：查询Supabase / 调用AI / 计算 / ...] 4. 用户看到 [结果页面B]，展示 [结果内容] 5. 如果出错，显示 [错误提示文案] 【数据需求】 涉及Supabase表：[表名] 需要调用的API： - 读取：[select什么字段，按什么条件] - 写入：[insert哪些字段，值从哪来] 【UI要求】 - 参考截图：[附上原型截图] - 颜色：主色#C0392B，背景#111110，文字#F0EDE6 - 移动端适配 - 按钮最小触控区44×44px - 交互反馈：加载中显示转圈，成功/失败显示提示 【边界情况】（告诉AI要考虑的特殊场景） - 输入为空时怎么处理？ - 数据不存在时怎么展示？ - 网络断掉时怎么提示？ - 用户连续点击按钮怎么防抖？ 【代码规范】 - 单文件 index.html - CDN引入 supabase-js - ES Module方式（<script type=\"module\">） - 代码分节，用注释标注每个区块是干什么的 - 中文注释"
