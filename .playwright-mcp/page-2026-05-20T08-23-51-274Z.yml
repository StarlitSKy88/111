            - paragraph:
              - strong [ref=e196]: 如果这5步有任何一步卡住了 → 回去改prompt重新生成，不要手动改代码。
            - heading "步骤3：三种状态的处理" [level=4]
            - paragraph: 核心功能1必须覆盖三种状态（否则用户会觉得产品是坏的）：
            - code [ref=e198]: "// 状态1：加载中 if (loading) return '<div class=\"loading\">分析中...</div>'; // 状态2：空状态（首次使用） if (!data) return '<div class=\"empty\">上传你的简历，开始第一次分析</div>'; // 状态3：错误 if (error) return '<div class=\"error\">出错了：${error.message}，请刷新重试</div>'; // 正常展示 return renderResult(data);"
            - heading "三、核心功能1的完成标准（上线前自检）" [level=3] [ref=e199]
            - text: 标准检查方式 输入→输出完整链路无痕浏览器，从头走一遍 数据持久化刷新页面，数据还在 三种状态都有分别触发Loading/Empty/Error 移动端可用手机微信打开，核心流程走通 20秒内完成操作计时：从打开到看到结果≤20秒
            - heading "四、最容易犯的两个错误" [level=3] [ref=e200]
            - heading "错误1：想要\"完美\"的第一版" [level=4]
            - paragraph: ❌ 做了3天还在调UI颜色和动画
            - paragraph: ✅ 功能跑通就停手。UI优化等节点14一起做。
            - heading "错误2：跳过错误处理" [level=4]
            - paragraph: ❌ "这个输入框用户不会填错的"
            - paragraph: ✅ 空输入、超长输入、特殊字符全部处理。自己测试时用真实数据，别用"test"。
            - heading "五、检查清单" [level=3] [ref=e201]
            - list:
