        - generic [ref=e51]: 开户前置准备
        - generic [ref=e52]:
          - generic [ref=e53]: "01"
          - heading "必备材料清单" [level=2] [ref=e54]
        - generic [ref=e55]:
          - generic [ref=e56]:
            - generic [ref=e57]: 基础材料
            - generic [ref=e58]: 营业执照、身份证、印章
            - generic [ref=e59]: 营业执照正副本（部分地区支持电子营业执照扫码核验）、法定代表人身份证原件、公章、财务章、法人名章。
          - generic [ref=e60]:
            - generic [ref=e61]: 经营场所
            - generic [ref=e62]: 最大的变量
            - generic [ref=e63]: 托管地址：工位租赁合同+托管协议。实体地址：租赁合同+房产证。家庭地址：提前拍摄清晰的办公区域照片。
          - generic [ref=e64]:
            - generic [ref=e65]: 受益所有人
            - generic [ref=e66]: 持股100%的实际控制人
            - generic [ref=e67]: 现行规定要求采集受益所有人信息。作为持股100%的唯一股东，这一项填报极为简单，但不可省略。
        - generic [ref=e68]:
          - generic [ref=e69]: 并行预约策略
          - generic [ref=e70]: 在工商系统提交设立申请的同时，登录目标银行官网完成开户预约。当前多数银行支持预开户或意向登记，用统一社会信用代码前9位即可锁定开户通道。
      - generic [ref=e71]:
        - generic [ref=e72]: 银行尽职调查
        - generic [ref=e73]:
          - generic [ref=e74]: "02"
          - heading "如何证明\"真实经营\"而非空壳" [level=2] [ref=e75]
        - generic [ref=e76]:
          - generic [ref=e77]:
            - generic [ref=e78]: 核心逻辑
            - generic [ref=e79]: 银行最在意的是"你像不像在做真实生意"
            - generic [ref=e80]: 客户经理最在意的不是场地豪华度，而是"你看起来像不像在做真实生意"。与其准备一堆纸质租赁合同，不如一个实时拉取的测试订单更有说服力。
          - generic [ref=e81]:
            - generic [ref=e82]: 佐证材料
            - generic [ref=e83]: 无正式合同时的破解之道
            - generic [ref=e84]: 电商平台店铺后台截图+实时数据、服务协议框架、意向客户沟通邮件、与知名平台的交易记录。一份加盖公章的《业务说明》描述商业模式和预计流水规模，同样有效。
          - generic [ref=e85]:
            - generic [ref=e86]: 核验重点
            - generic [ref=e87]: 银行问什么？
            - generic [ref=e88]: 做什么业务？主要客户是谁？如何收款？有无实际经营地址？如实回答，不要夸大。
        - generic [ref=e89]:
          - generic [ref=e90]:
            - generic [ref=e91]: 错误示范
            - generic [ref=e92]: 空手去，说"我有执照就行"
            - generic [ref=e93]: 没有商业佐证材料，触发反欺诈拦截，直接导致开户失败或账户功能受限。
          - generic [ref=e94]:
            - generic [ref=e95]: 正确回答
            - generic [ref=e96]: 带上"三件套"去开户
            - generic [ref=e97]: ①后台数据截图（实时）②业务说明（加盖公章）③意向合同或沟通记录。
          - generic [ref=e98]:
            - generic [ref=e99]: 推荐银行
            - generic [ref=e100]: 生态型银行选择
            - generic [ref=e101]: 网商银行（打通支付宝）、平安数字口袋（聚合支付）、招行小企业e家（税银互动）。选内置SaaS服务的。
      - generic [ref=e102]:
        - generic [ref=e103]: 简易开户通道
        - generic [ref=e104]:
          - generic [ref=e105]: "03"
          - heading "小微企业的最优选择与升级路径" [level=2] [ref=e106]
        - generic [ref=e107]:
          - generic [ref=e108]:
            - generic [ref=e109]: 什么是简易开户
            - generic [ref=e110]: 功能精简，门槛更低
            - generic [ref=e111]: 针对小微企业设计的精简账户。初期仅限基础收款和限额转账，不收取高昂账户管理费，对日均余额要求非常低。
          - generic [ref=e112]:
            - generic [ref=e113]: 初期限制
            - generic [ref=e114]: 单日收款额度上限
            - generic [ref=e115]: 简易账户通常有收款额度限制（如单日累计收款不超过5万元），但对于初创业务测试阶段已经足够。1-3个月观察期后即可申请升级。
          - generic [ref=e116]:
            - generic [ref=e117]: 全线上开户
            - generic [ref=e118]: 2026年的首选路径
            - generic [ref=e119]: 部分互联网银行及传统银行直销银行部推出专属"生意卡"或数字化对公钱包，支持电子营业执照+法人远程视频完成全线上开户。
        - generic [ref=e120]:
          - generic [ref=e121]: 升级路径
          - generic [ref=e122]: 先用简易通道下户 → 1-3个月后用真实流水和合同申请升级全功能账户。比一开始就死磕全功能账户通过率高出许多。
      - generic [ref=e123]:
        - generic [ref=e124]: 商户号申请
        - generic [ref=e125]:
          - generic [ref=e126]: "04"
          - heading "微信/支付宝/聚合支付的一次性打通" [level=2] [ref=e127]
        - generic [ref=e128]:
          - generic [ref=e129]:
            - generic [ref=e130]: 并行申请
            - generic [ref=e131]: 对公账户激活当天同步发起商户申请
            - generic [ref=e132]: 微信支付、支付宝均允许"凭营业执照预开通商户号"，仅结算打款环节需要填写银行账户验证。开户等待期间即可完成商户号实名认证、费率签约和技术对接。
          - generic [ref=e133]:
            - generic [ref=e134]: 审核周期
            - generic [ref=e135]: T+1到T+3
            - generic [ref=e136]: 支付宝企业认证通常T+1，微信支付普遍T+2至T+3。等待商户号下发的空档，正好用来完成技术侧的接口预埋。
          - generic [ref=e137]:
            - generic [ref=e138]: 小额打款验证
            - generic [ref=e139]: 最终的所有权校验
            - generic [ref=e140]: 平台向你的对公账户打一笔随机金额，完成账户所有权验证。验证完成后，立即绑定财税软件，设置收款流水自动同步规则。
        - generic [ref=e141]:
          - generic [ref=e142]: 聚合支付优势
          - generic [ref=e143]: 找一家具备央行支付牌照的聚合服务商，一次性开通微信、支付宝，云闪付，数字人民币。一个收银链接或固定二维码，接收所有支付方式。
      - generic [ref=e144]:
        - generic [ref=e145]: 公私账户隔离
        - generic [ref=e146]:
          - generic [ref=e147]: "05"
          - heading "资金流转的合规红线与正确姿势" [level=2] [ref=e148]
        - generic [ref=e149]:
          - generic [ref=e150]: 核心原则
          - generic [ref=e151]: 对公账户与个人账户必须完全分离
          - generic [ref=e152]: 所有经营收入必须先进入公司对公账户，再通过正规渠道提取至个人卡。哪怕是一笔几十元的小额收款。一旦被认定为财产混同，将刺破公司面纱，股东承担无限连带责任。
        - generic [ref=e153]: 合规提取方式 说明 发放工资 需签订劳动合同，依法代扣个税 税后利润分红 需有股东决定书 借款 需签订借款协议，约定还款期限和利率
        - paragraph [ref=e155]: 用个人卡隐匿经营收入极易触发预警，被认定为隐匿收入面临补税+滞纳金。更严重的是：公私混同会刺破有限责任保护，债务责任扩张至个人家庭资产。
      - generic [ref=e156]:
        - generic [ref=e157]: 持续合规维护
        - generic [ref=e158]:
          - generic [ref=e159]: "06"
          - heading "季度自查清单与风控要点" [level=2] [ref=e160]
        - generic [ref=e161]: 事项 时间要求 说明 地址变更同步 10个工作日内 营业执照地址变动后，银行预留信息和支付平台商户资料需同步更新 商户号风控 3-6个月观察期 避免深夜时段集中大额收款、避免IP频繁跳变、避免相同金额多笔入账 年度复评 每年 银行自动调取年报状态和税务信用评级，未按时公示→账户转为"只收不付" 季度自查 每季度 证照信息一致性、账户活动、商户号状态、财务报表与商户收款匹配
        - generic [ref=e162]:
          - generic [ref=e163]: 监控红线
          - generic [ref=e164]: 单月公转私超过50笔或20万元 → 触发预警。金税四期重点关注公私互转。
      - generic [ref=e165]:
        - generic [ref=e166]: 总纲
        - paragraph [ref=e168]:
          - text: 收款能力才是真正的商业闭环。
          - text: 金融基础设施的搭建不是"开户-申请商户号-接入支付"的线性流程，而是需要并行推进、持续维护的系统工程。把这套体系搭建好，你的OPC才能真正开始运转。
        - generic [ref=e169]:
          - generic [ref=e170]: 2026 UPDATE
          - generic [ref=e171]:
            - blockquote [ref=e172]: "**面向OPC**：公司注册好了（节点23），现在需要开银行账户收钱。开对公账户比注册公司还麻烦——银行会派人上门核查。本节点告诉你2026年怎么一次过。"
            - heading "一、对公账户 vs 个人账户" [level=3] [ref=e173]
            - table [ref=e174]:
              - rowgroup [ref=e175]:
                - row "维度 个人账户 对公账户" [ref=e176]:
                  - cell "维度" [ref=e177]
