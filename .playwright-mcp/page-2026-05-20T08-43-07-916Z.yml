                  - columnheader "收客户款" [ref=e181]
                  - columnheader "✅ 可以用" [ref=e182]
                  - columnheader "✅ 正规，可开发票" [ref=e183]
                - row "微信/支付宝商户 ❌ 需要企业对公账户 ✅" [ref=e184]:
                  - cell "微信/支付宝商户" [ref=e185]
                  - cell "❌ 需要企业对公账户" [ref=e186]
                  - cell "✅" [ref=e187]
                - row "税务合规 ⚠️ 个人账户收经营款有风险 ✅ 完全合规" [ref=e188]:
                  - cell "税务合规" [ref=e189]
                  - cell "⚠️ 个人账户收经营款有风险" [ref=e190]
                  - cell "✅ 完全合规" [ref=e191]
                - row "年费 0 ¥200-500/年" [ref=e192]:
                  - cell "年费" [ref=e193]
                  - cell "0" [ref=e194]
                  - cell "¥200-500/年" [ref=e195]
                - row "开户难度 即开即用 预约+上门核查+1-2周" [ref=e196]:
                  - cell "开户难度" [ref=e197]
                  - cell "即开即用" [ref=e198]
                  - cell "预约+上门核查+1-2周" [ref=e199]
            - paragraph [ref=e200]:
              - strong [ref=e201]: OPC结论
              - text: ：做了公司就必须开对公账户。否则等于白注册。
            - heading "二、2026年开户全流程" [level=3] [ref=e202]
            - heading "步骤1：选银行（5分钟）" [level=4] [ref=e203]
            - text: 银行年费开户周期推荐理由 **招商银行**¥300/年1周服务好，App好用 **工商银行**¥200/年1-2周网点最多，公司户首选 **建设银行**¥240/年1周小微企业友好 **网商银行**免费3天纯线上，但功能受限 **微众银行**免费1天纯线上，适合轻量经营
            - paragraph [ref=e204]:
              - strong [ref=e205]: 2026年趋势
              - text: ：网商银行和微众银行对OPC最友好——纯线上开户，不需要上门核查。但功能不如传统银行全面（如不能开支票）。
            - heading "步骤2：预约开户（5分钟）" [level=4] [ref=e206]
            - paragraph [ref=e207]: 1. 下载所选银行的App → 搜索"对公开户"
            - paragraph [ref=e208]: 2. 填写企业信息（营业执照上的统一社会信用代码）
            - paragraph [ref=e209]: 3. 预约上门核查时间
            - heading "步骤3：准备材料" [level=4] [ref=e210]
            - text: 材料来源 营业执照正副本工商局/电子营业执照 公章、财务章、法人章刻章店（注册公司时一般一起刻了） 法人身份证原件- 经营场所证明租房合同/房产证 公司章程注册公司时工商备案的那份
            - heading "步骤4：配合上门核查（最关键的一步）" [level=4] [ref=e211]
            - paragraph [ref=e212]: 银行工作人员会到你的注册地址拍照。他们看三样东西：
            - paragraph [ref=e213]:
              - text: "1."
              - strong [ref=e214]: 门牌号
              - text: ：你的注册地址门口必须有公司名牌（一张A4纸打印贴门上就行）
            - paragraph [ref=e215]:
              - text: "2."
              - strong [ref=e216]: 办公环境
              - text: ：至少有一张桌子、一把椅子、一台电脑（看起来像在办公）
            - paragraph [ref=e217]:
              - text: "3."
              - strong [ref=e218]: 法人在场
              - text: ：你必须亲自在场，带身份证
            - paragraph [ref=e219]:
              - strong [ref=e220]: OPC注意
              - text: ：如果你用家庭地址注册的，把客厅收拾干净，摆一台电脑，挂个公司名牌。核查人员不是来查"你是不是真的在这里办公"，是来确认"这个地址确实存在且你能用"。
            - heading "步骤5：激活账户" [level=4] [ref=e221]
            - paragraph [ref=e222]: 核查通过后 → 去银行网点领开户许可证 → 开通网银 → 存¥100激活。
            - heading "三、微信支付商户号申请" [level=3] [ref=e223]
            - paragraph [ref=e224]: 有了对公账户，才能申请微信支付商户号：
            - paragraph [ref=e225]: 1. 访问 [pay.weixin.qq.com](https://pay.weixin.qq.com) → 注册
            - paragraph [ref=e226]: 2. 上传营业执照 + 对公账户信息 + 法人身份证
            - paragraph [ref=e227]: 3. 微信打一笔小额验证款到对公账户（¥0.01-1.00）
            - paragraph [ref=e228]: 4. 在商户平台输入验证金额 → 审核通过
            - paragraph [ref=e229]:
              - strong [ref=e230]: 周期
              - text: ：1-5个工作日。费用：0.6%交易手续费。
            - heading "四、检查清单" [level=3] [ref=e231]
            - list [ref=e232]:
              - listitem [ref=e233]: "[ ] 对公账户已开立"
              - listitem [ref=e234]: "[ ] 网银已开通"
              - listitem [ref=e235]: "[ ] 微信支付商户号已申请"
              - listitem [ref=e236]: "[ ] 商户号审核已通过"
              - listitem [ref=e237]: "[ ] 做过1分钱真实收款测试"
              - listitem [ref=e238]: "[ ] 银行年费已了解（第一年一般免费）"
              - listitem [ref=e239]:
                - link "2026年更新" [ref=e240] [cursor=pointer]:
                  - /url: "#s2026"
            - heading "节点资源链接" [level=3] [ref=e241]
            - list [ref=e242]:
              - listitem [ref=e243]: 节点23：公司注册与主体选择
              - listitem [ref=e244]: 节点45：税务报到与筹划
              - listitem [ref=e245]: 节点16：支付代码集成
          - paragraph [ref=e246]: 以上内容基于2026年5月最新实践编写，工具版本和价格可能更新，请以官方文档为准。
