    - separator [ref=e83]
    - generic [ref=e84]:
      - heading "二、GA4 接入5分钟教程（2026年5月界面）" [level=2] [ref=e85]
      - heading "什么是GA4" [level=3] [ref=e86]
      - paragraph [ref=e87]:
        - text: Google Analytics 4，谷歌的免费网站分析工具。
        - strong [ref=e88]: 2026年最实用的免费分析方案。
      - heading "注册和接入" [level=3] [ref=e89]
      - generic [ref=e90]:
        - heading "第1步：注册GA4账号（1分钟）" [level=4] [ref=e91]
        - list [ref=e92]:
          - listitem [ref=e93]:
            - text: 打开
            - link "analytics.google.com" [ref=e94] [cursor=pointer]:
              - /url: https://analytics.google.com
          - listitem [ref=e95]: 用Google账号登录（没有的话注册一个，免费）
          - listitem [ref=e96]: 点击"创建账号" → 输入账号名称（比如你的产品名）
          - listitem [ref=e97]: 点击"创建媒体资源" → 输入产品名 + 时区选"中国标准时间"
          - listitem [ref=e98]: 点击"创建" → 选择"网站"平台
          - listitem [ref=e99]: 输入你的网站URL → 点击"创建数据流"
      - generic [ref=e100]:
        - heading "第2步：获取测量ID（30秒）" [level=4] [ref=e101]
        - paragraph [ref=e102]:
          - text: 数据流创建后，你会看到一个"测量ID"，格式为
          - code [ref=e103]: G-XXXXXXXXXX
          - text: 。复制它。
      - generic [ref=e104]:
        - heading "第3步：粘贴代码（2分钟）" [level=4] [ref=e105]
        - paragraph [ref=e106]:
          - text: 在网站每个页面的
          - code [ref=e107]: <head>
          - text: 标签内，粘贴以下代码：
        - code [ref=e109]: "<!-- Google tag (gtag.js) --> <script async src=\"https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX\"></script> <script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-XXXXXXXXXX'); </script>"
        - paragraph [ref=e110]:
          - text: 替换
          - code [ref=e111]: G-XXXXXXXXXX
          - text: 为你的测量ID。
      - generic [ref=e112]:
        - heading "第4步：验证（1分钟）" [level=4] [ref=e113]
        - paragraph [ref=e114]: 部署后，打开GA4 → 报告 → 实时。用手机打开你的网站，30秒内应该能在实时报告中看到"1个活跃用户"。
      - generic [ref=e115]:
        - generic [ref=e116]: 国内注意事项
        - paragraph [ref=e117]:
          - text: GA4依赖Google服务器，
          - strong [ref=e118]: 国内用户直接访问可能不稳定
          - text: 。如果你是用Trae做开发、主要面向国内用户，建议GA4 + 百度统计双接入（见下一章）。
        - paragraph [ref=e119]:
          - strong [ref=e120]: 补救方案
          - text: ：Vercel部署的网站可以开一个中间代理，把GA4请求转发到自己的域名上。如果不会配，直接用百度统计替代。
