          - paragraph [ref=e407]: 不用会写，但要会读。每周挑一段AI生成的业务逻辑代码，用Cursor的"解释这段代码"功能理解它。你不需要成为程序员，但需要能在出问题时，用一句话准确描述问题给AI。
        - generic [ref=e408]:
