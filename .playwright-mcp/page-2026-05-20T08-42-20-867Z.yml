            - strong [ref=e283]: OPC首选
            - text: ：知乎效果广告。原因：CPM最低、用户质量最高、投放门槛最低。
          - heading "三、广告投放的三步法（以知乎为例）" [level=3] [ref=e284]
          - heading "步骤1：创建一条\"不像广告\"的广告" [level=4] [ref=e285]
          - code [ref=e287]: 标题：【真实经历】我一个人花了30天做了一款XX工具 内容：之前一直用Excel记账，每次月底都头疼。后来干脆自己做了个工具，现在用了3个月... 配图：产品截图（不要用精美设计的海报——真实图点击率更高） 落地页：产品的核心功能页面（不要专门做landing page）
          - paragraph [ref=e288]:
            - strong [ref=e289]: 关键
            - text: ：知乎用户讨厌广告。你的广告必须看起来像一篇正常回答/文章。
          - heading "步骤2：设预算和定向" [level=4] [ref=e290]
          - code [ref=e292]: 日预算：¥50（最低启动） 定向：关注"创业""独立开发""效率工具"话题的用户 地域：一线城市（付费意愿最高） 出价：OCPM自动优化
          - heading "步骤3：看数据、调、再投" [level=4] [ref=e293]
          - text: 数据正常需要优化 CTR（点击率）>1%<0.5%→换标题/封面图 CPC（单次点击成本）<¥3>¥5→关闭该广告 CPM（千次曝光成本）<¥20>¥30→换定向 转化率>2%<1%→换落地页
          - paragraph [ref=e294]:
            - strong [ref=e295]: 前¥200是测试预算。
            - text: 不要一次性充¥5000——先花¥200看数据，再决定加不加。
          - heading "四、OPC广告 vs 大厂广告" [level=3] [ref=e296]
          - text: 维度大厂OPC 月预算¥10万+¥500-2000 优化方式专业优化师天天调你每周看一次数据 素材专业设计团队出图Canva模板+产品截图 目标品牌曝光+转化只追转化
          - paragraph [ref=e297]:
            - strong [ref=e298]: 记住这个差距。
            - text: 不要学大厂的打法——他们烧的是融资的钱，你烧的是自己的饭钱。
          - heading "五、一次¥200的广告实验模板" [level=3] [ref=e299]
          - code [ref=e301]: 广告平台：知乎 日预算：¥50，跑4天 标题A："我花了30天做了XX"（真实经历型） 标题B："2026年还在用Excel记账？试试这个"（痛点型） 每个标题¥100预算，看哪个CTR高 4天后：高CTR的留下，低的关掉 如果两个CTR都<0.5%→广告不适合你目前的产品，回去做内容
          - heading "六、检查清单" [level=3] [ref=e302]
          - list [ref=e303]:
            - listitem [ref=e304]: "[ ] 免费获客渠道已跑通（月自然新增≥50）"
            - listitem [ref=e305]: "[ ] LTV已估算（用户生命周期价值>获客成本）"
            - listitem [ref=e306]: "[ ] 转化追踪已设置（能知道广告带来了几个注册/付费）"
            - listitem [ref=e307]: "[ ] 首次投放预算≤¥200"
            - listitem [ref=e308]: "[ ] 至少测试2个不同标题/封面"
            - listitem [ref=e309]: "[ ] 4天后根据数据决定继续或停止"
