            - strong [ref=e280]: OPC铁律
            - text: ：月利润<¥5000之前，不投广告。5000以下的增长靠内容和社群。
          - heading "二、2026年OPC能投的四个平台" [level=3] [ref=e281]
          - text: 平台最低日预算适合产品2026年特点 **微信朋友圈广告**¥50/天面向企业主/30岁以上用户精准但贵，CPM约¥30-50 **小红书聚光**¥100/天面向年轻女性/生活方式种草效果好，但需要好看的内容 **抖音巨量引擎**¥200/天面向大众用户流量大但转化率低 **知乎效果广告**¥50/天面向高知/决策型用户CPM低（¥5-10），适合SaaS/工具
