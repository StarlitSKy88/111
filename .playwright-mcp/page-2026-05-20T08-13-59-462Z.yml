          - generic [ref=e42]:
            - generic [ref=e43]: 画方框
            - generic [ref=e44]: 在一张纸上画一个手机屏幕大小的矩形。在里面画3-4个方框——这是你产品的核心区域。不用画任何细节。方框就够了。
        - generic [ref=e45]:
          - generic [ref=e46]: "2"
          - generic [ref=e47]:
            - generic [ref=e48]: 写按钮名
            - generic [ref=e49]: 在每个方框旁边写一句话，说明这个方框里会发生什么。比如："用户点这里上传文件"、"这里显示分析结果"、"点这里付款"。
        - generic [ref=e50]:
          - generic [ref=e51]: "3"
          - generic [ref=e52]:
            - generic [ref=e53]: 画箭头
            - generic [ref=e54]:
              - text: 用箭头把方框连起来，表示用户的操作流程。
              - code [ref=e55]: "[首页] → [上传文件] → [分析中] → [查看结果] → [付款]"
        - generic [ref=e56]:
          - generic [ref=e57]: "4"
          - generic [ref=e58]:
            - generic [ref=e59]: 标注3个按钮
            - generic [ref=e60]: 用红笔圈出最核心的3个按钮。问自己：用户第一眼能看到它们吗？如果用户10秒内找不到——按钮位置不对。
        - generic [ref=e61]:
          - generic [ref=e62]: "5"
          - generic [ref=e63]:
            - generic [ref=e64]: 拍照
            - generic [ref=e65]: 用手机拍下这张纸。这就是你的第一版原型。
      - paragraph [ref=e67]: 2024年，一位深圳独立开发者想做小红书数据分析工具。他在咖啡馆餐巾纸上画了三个页面，照片发到即刻上配文"打算做这个，需要的人扣1"。2小时内72个回复。他周末两天用Cursor写出了第一版。如果先写代码再找用户——他可能花两周才发现需求根本不对。
