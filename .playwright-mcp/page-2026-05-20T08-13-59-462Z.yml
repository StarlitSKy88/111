              - code [ref=e90]: F
              - text: → 右侧面板选"iPhone 15 Pro"（或你目标用户最常用的设备尺寸）。
        - generic [ref=e91]:
          - generic [ref=e92]: "3"
          - generic [ref=e93]:
            - generic [ref=e94]: 画矩形（1分钟）
            - generic [ref=e95]:
              - text: 按键盘
              - code [ref=e96]: R
              - text: （矩形工具） → 在Frame里拖出一个矩形。这是你的一个页面区域。再按
              - code [ref=e97]: R
              - text: 多画几个矩形——每个矩形代表一个内容模块。
        - generic [ref=e98]:
          - generic [ref=e99]: "4"
          - generic [ref=e100]:
            - generic [ref=e101]: 加文字（2分钟）
            - generic [ref=e102]:
              - text: 按键盘
              - code [ref=e103]: T
              - text: （文字工具） → 点击任意位置输入文字。不用管字体、字号、颜色。你需要写的文字只有：页面标题、按钮文字（比如"上传文件""立即购买"）、每个模块的简短说明。
        - generic [ref=e104]:
          - generic [ref=e105]: "5"
          - generic [ref=e106]:
            - generic [ref=e107]: 改颜色（1分钟，可选）
            - generic [ref=e108]:
              - text: 选中任意矩形 → 右侧面板 Fill → 点颜色块 → 选一个颜色。OPC配色建议：背景用白或极浅灰，主按钮用一个鲜明颜色（比如蓝
              - code [ref=e109]: "#3B82F6"
              - text: 或红
              - code [ref=e110]: "#C0392B"
              - text: ），文字用黑。
        - generic [ref=e111]:
          - generic [ref=e112]: "6"
          - generic [ref=e113]:
            - generic [ref=e114]: 复制页面（30秒）
            - generic [ref=e115]:
              - text: 在左侧图层栏，选中你的Frame →
              - code [ref=e116]: Ctrl/⌘ + D
              - text: 复制一份。在复制出的第二个Frame里，改成另一个页面的内容。每个页面一个Frame。一个简单产品通常3-5个页面。
        - generic [ref=e117]:
          - generic [ref=e118]: "7"
          - generic [ref=e119]:
            - generic [ref=e120]: 加交互连线（3分钟）
            - generic [ref=e121]: 切换到"Prototype"模式（右上角标签）。点击第一个页面上的按钮 → 拖出蓝色的线 → 连到第二个页面。弹出的面板里选 "On click" → "Navigate to"。这样在预览模式下，点击按钮就能跳转到对应页面。
        - generic [ref=e122]:
          - generic [ref=e123]: "8"
          - generic [ref=e124]:
            - generic [ref=e125]: 手机预览（1分钟）
            - generic [ref=e126]: 安装 Figma 手机APP（iOS/Android都有）。在手机APP上打开你的文件 → 点击"播放"按钮 → 就可以像真App一样操作你的原型。发给朋友测试：让对方在手机上操作，你在旁边看——一句话都不要解释。如果对方卡住了——那是原型的问题，不是对方的问题。
