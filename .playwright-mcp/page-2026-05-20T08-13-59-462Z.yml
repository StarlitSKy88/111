    - generic [ref=e238]:
      - generic [ref=e239]: 总纲
      - paragraph [ref=e241]: 原型不是设计——原型是沟通工具。它是OPC和AI之间的共同语言。
      - generic [ref=e242]:
        - generic [ref=e243]: 三步出原型
        - generic [ref=e244]:
          - strong [ref=e245]: 1. 纸笔
          - text: （10分钟）→ 确认方向对不对
          - strong [ref=e246]: 2. Figma
          - text: （30分钟）→ 确认交互顺不顺
          - strong [ref=e247]: 3. 喂给AI
          - text: （5分钟）→ 变成可以运行的代码
      - paragraph [ref=e248]:
        - text: 原型的目的是被推翻。不要花2天画一个"完美"的原型——那你会不敢改它。
        - text: （本文写于2026年5月。Figma界面可能持续更新，但核心操作逻辑长期不变。）
      - generic [ref=e249]:
        - generic [ref=e250]: 2026 UPDATE
        - generic [ref=e251]:
          - blockquote [ref=e252]: "**面向OPC**：你有一个想法，但你不能花三个月把它做出来才发现没人要。原型的作用是：用最短的时间，做出\"看起来像真的\"的东西，拿去给别人看，收集反馈，再决定做不做。"
