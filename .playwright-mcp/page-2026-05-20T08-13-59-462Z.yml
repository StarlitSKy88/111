          - heading "二、2026年原型工具矩阵" [level=3] [ref=e277]
          - text: 工具适合费用2026年亮点 **Excalidraw**手绘风格线框图免费开源2026年支持AI生成布局 **Figma**高保真交互原型免费（个人）2026年AI插件可文字生成设计稿 **v0.dev**文字描述→生成UI代码免费额度Vercel出品，直接生成React/Tailwind代码 **bolt.new**一句话→生成全栈应用免费额度StackBlitz出品，直接在线运行 **Cursor + prompt**精准控制代码原型$20/月最灵活，但需要会描述需求
          - heading "三、OPC原型设计三原则" [level=3] [ref=e278]
          - heading "1. 只画核心流程" [level=4] [ref=e279]
          - paragraph [ref=e280]:
            - text: 不是把所有页面都画出来，只画
            - strong [ref=e281]: 用户完成核心任务的那条路径
            - text: 。
          - code [ref=e283]: 例：一个AI简历优化工具 只画：首页 → 上传简历 → 查看优化建议 → 下载优化版 不画：设置页、个人中心、历史记录、付费页面（原型阶段不考虑）
          - heading "2. 用真实内容，不用\"Lorem Ipsum\"" [level=4] [ref=e284]
          - paragraph [ref=e285]: 假文字（"标题标题标题"）让人无法判断产品价值。用真实场景的内容。
          - heading "3. 原型做完当天就拿给人看" [level=4] [ref=e286]
          - paragraph [ref=e287]: 不要打磨原型。粗糙但能传达想法的原型 > 精美但一周后才拿出来的原型。
          - heading "四、从原型到验证的完整流程（2026年）" [level=3] [ref=e288]
          - code [ref=e290]: "Day 1 上午: Excalidraw画核心流程（30分钟） Day 1 下午: 用v0.dev/bot.new生成可点击版本（2小时） Day 1 傍晚: 发给3个朋友，问\"你看懂这是什么了吗？\" Day 2: 根据反馈修改 → 再发给2个目标用户 Day 3: 决定：做 / 改方向 / 放弃"
          - paragraph [ref=e291]:
            - strong [ref=e292]: 铁律
            - text: ：原型阶段超过3天=你在做产品，不是在验证想法。
          - heading "五、检查清单" [level=3] [ref=e293]
          - list [ref=e294]:
            - listitem [ref=e295]: "[ ] 核心流程已画出（不是全部页面）"
            - listitem [ref=e296]: "[ ] 原型中有真实内容（非Lorem Ipsum）"
            - listitem [ref=e297]: "[ ] 至少3个人看过原型"
            - listitem [ref=e298]: "[ ] 收集了\"看不懂的地方\"和\"愿意用吗\"的反馈"
            - listitem [ref=e299]: "[ ] 3天内做出了Go/No-Go决策"
