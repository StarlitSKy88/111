          - generic [ref=e48]:
            - paragraph [ref=e49]:
              - text: 范围锁定的标准不是"能不能跑通一个简化流程"，而是
              - strong [ref=e50]: "\"能不能立刻产生一次不可逆的价值交换\""
              - text: 。
            - paragraph [ref=e51]:
              - text: 锁定范围的第一步，就是把这一轮实验约束为
              - strong [ref=e52]: 只验证一个核心假设
              - text: 。这个假设必须是指向付费行为的断言。
        - generic [ref=e53]:
