            - generic [ref=e55]: "02"
            - heading "功能二分法：砍掉它还能收费吗？" [level=3] [ref=e56]
          - generic [ref=e57]:
            - paragraph [ref=e58]:
              - text: 把每一个功能单独拎出来，问自己一个非常苛刻的问题——
              - strong [ref=e59]: "\"砍掉它，我还能不能完成一单完整收费？\""
            - paragraph [ref=e60]: 如果能，就直接划掉。你会发现，用户资料头像、密码修改、多语言切换、数据导出甚至管理后台，在这一刀面前全部倒下。
            - paragraph [ref=e61]:
              - text: 真正留下来的，往往是：
              - text: 一个极窄的输入 + 一个核心处理逻辑 + 一个收费点 + 一个交付结果
