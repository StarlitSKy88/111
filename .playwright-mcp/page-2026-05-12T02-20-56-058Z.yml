        - generic [ref=e150]: 用AI写出第一个API调用
        - paragraph [ref=e151]: 目标：在 index.html 里加一个输入框 + 一个按钮。用户在输入框里打字 → 点按钮 → 数据存到Supabase → 页面下方显示刚才保存的所有消息。
        - generic [ref=e152]:
          - generic [ref=e153]: Prompt 模板
          - generic [ref=e154]: "我在做一个Web应用，使用Supabase作为后端。 Supabase信息： - Project URL: https://xxxxxxxxxxxx.supabase.co - anon key: [你的anon key] 请修改我的 index.html，增加以下功能： 1. 在按钮下方新增一个区域： - 一个文本输入框（placeholder：\"输入你想说的话...\"） - 一个提交按钮（文字：\"保存到数据库\"） 2. 点击提交按钮后： - 把输入框的内容保存到 Supabase 的 messages 表（字段：content） - 保存成功后，刷新下面的消息列表 3. 在提交按钮下方新增一个消息列表区域： - 从Supabase读取messages表的所有记录 - 按 created_at 降序排列（最新的在最上面） - 每条消息显示内容和创建时间 4. 页面打开时自动加载消息列表 技术实现： - 通过CDN引入 supabase-js SDK：https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm - 使用ES Module方式导入 - 所有逻辑写在"