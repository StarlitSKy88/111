            - text: 第一步
            - heading "在Gitee上创建远程仓库" [level=3] [ref=e102]
          - paragraph [ref=e104]:
            - text: 1. 点右上角 "+" → "新建仓库"
            - text: 2. 仓库名称：my-first-app
            - text: 3. 可见性：选"私有"（你的产品代码不要公开）
            - text: "4."
            - strong [ref=e105]: 不要勾选
            - text: "\"使用Readme文件初始化仓库\"（重要！因为你本地已经有代码了）"
            - text: 5. 点"创建"
        - generic [ref=e106]:
          - generic [ref=e107]:
            - text: 第二步
            - heading "在本地项目中执行（VS Code终端）" [level=3] [ref=e108]
          - generic [ref=e110]:
            - generic [ref=e111]: 完整命令序列
            - generic [ref=e112]: "# 第1步：初始化Git仓库 git init # 第2步：创建.gitignore（告诉Git忽略哪些文件） echo \"node_modules/ .env .DS_Store\" > .gitignore # 第3步：把所有文件加入暂存区 git add . # 第4步：创建第一次提交 git commit -m \"第一个页面：Hello World\" # 第5步：关联远程仓库（替换为你的仓库地址） git remote add origin git@gitee.com:你的用户名/my-first-app.git # 第6步：推送到Gitee git push -u origin main"
        - generic [ref=e113]:
          - generic [ref=e114]:
            - text: 第三步
            - heading "同时推送到GitHub（可选）" [level=3] [ref=e115]
          - generic [ref=e116]:
            - generic [ref=e118]: "# 添加GitHub作为第二个远程仓库 git remote add github git@github.com:你的用户名/my-first-app.git # 推送到GitHub git push -u github main"
            - paragraph [ref=e119]:
              - text: 以后每次改完代码：
              - code [ref=e120]: git push
              - text: — 推送到Gitee
              - code [ref=e121]: git push github
              - text: — 推送到GitHub
        - paragraph [ref=e122]: 打开Gitee → 进入 my-first-app 仓库 → 你应该能看到你的 index.html 和 package.json。
      - generic:
        - generic: .gitignore 的正确写法
        - paragraph: 告诉Git"这些文件/文件夹不要管它们，不要上传"。
        - generic [ref=e123]:
          - generic: OPC项目标准 .gitignore
          - generic: "# 依赖包（太大，通过package.json记录就够了，不需要上传几万个小文件） node_modules/ # 环境变量（里面有密码、API密钥，绝对不能上传！） .env .env.local .env.*.local # 系统文件 .DS_Store # Mac自动生成的文件夹信息 Thumbs.db # Windows自动生成的缩略图 # 构建输出 dist/ build/ .next/ # IDE配置 .vscode/ .idea/ # 调试文件 *.log npm-debug.log*"
        - generic:
          - generic:
            - text: 不小心
            - heading "已经上传了不该上传的东西？" [level=3]
          - generic [ref=e124]:
            - generic: "# 1. 先把文件加入.gitignore（比如你忘了忽略 node_modules） echo \"node_modules/\" >> .gitignore # 2. 从Git跟踪中移除（但不删除本地文件） git rm -r --cached node_modules/ # 3. 提交这个改动 git add .gitignore git commit -m \"添加.gitignore，移除误上传的node_modules\" # 4. 推送 git push"
