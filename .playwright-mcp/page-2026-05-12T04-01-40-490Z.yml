          - strong [ref=e344]: ¥12,000
          - text: 作为锚点（年14.4万），覆盖基本扣除和社保。年底根据实际利润开"一人股东会"，形成书面分红决议后再提取。
        - heading "核心策略二：个人资源合规转化为企业成本" [level=3] [ref=e345]
        - paragraph [ref=e346]: 这是OPC的独特优势——你既是老板又是员工，个人资产与公司天然高度关联。
        - generic [ref=e347]:
          - heading "① 私车公用" [level=4] [ref=e348]
          - paragraph [ref=e349]: 签订《私车公用租赁协议》，约定租金（¥500-2000/月区间较合理）。公司支付租金后，油费、过路费、停车费可合规入账。月租金≤10万免增值税。
        - generic [ref=e350]:
          - heading "② 个人房产办公" [level=4] [ref=e351]
          - paragraph [ref=e352]: 签订房屋租赁协议，按实际办公面积比例列支。假设月租金¥5000，30%用于办公——公司月付¥1500，年入账成本¥18000。住房出租按10%税率计税，远低于20%分红税率。
        - generic [ref=e353]:
          - heading "③ 无形资产授权" [level=4] [ref=e354]
          - paragraph [ref=e355]: 如果你有软件著作权、商标、专利——授权给公司使用，收取使用费。公司支付使用费→减少应税所得→减少企业所得税。个人收到的使用费按特许权使用费计税（3%-8%），远低于20%分红税率。
