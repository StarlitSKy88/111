      - generic [ref=e127]:
        - generic [ref=e128]: 首次 git init → add → commit → push
        - generic [ref=e129]:
          - generic [ref=e130]:
            - text: 第一步
            - heading "在Gitee上创建远程仓库" [level=3] [ref=e131]
          - paragraph [ref=e133]:
            - text: 1. 点右上角 "+" → "新建仓库"
            - text: 2. 仓库名称：my-first-app
            - text: 3. 可见性：选"私有"（你的产品代码不要公开）
            - text: "4."
            - strong [ref=e134]: 不要勾选
            - text: "\"使用Readme文件初始化仓库\"（重要！因为你本地已经有代码了）"
            - text: 5. 点"创建"
        - generic [ref=e135]:
          - generic [ref=e136]:
            - text: 第二步
            - heading "在本地项目中执行（VS Code终端）" [level=3] [ref=e137]
          - generic [ref=e139]:
            - generic [ref=e140]: 完整命令序列
            - generic [ref=e141]: "# 第1步：初始化Git仓库 git init # 第2步：创建.gitignore（告诉Git忽略哪些文件） echo \"node_modules/ .env .DS_Store\" > .gitignore # 第3步：把所有文件加入暂存区 git add . # 第4步：创建第一次提交 git commit -m \"第一个页面：Hello World\" # 第5步：关联远程仓库（替换为你的仓库地址） git remote add origin git@gitee.com:你的用户名/my-first-app.git # 第6步：推送到Gitee git push -u origin main"
        - generic [ref=e142]:
          - generic [ref=e143]:
            - text: 第三步
            - heading "同时推送到GitHub（可选）" [level=3] [ref=e144]
          - generic [ref=e145]:
            - generic [ref=e147]: "# 添加GitHub作为第二个远程仓库 git remote add github git@github.com:你的用户名/my-first-app.git # 推送到GitHub git push -u github main"
            - paragraph [ref=e148]:
              - text: 以后每次改完代码：
              - code [ref=e149]: git push
              - text: — 推送到Gitee
              - code [ref=e150]: git push github
              - text: — 推送到GitHub
        - paragraph [ref=e151]: 打开Gitee → 进入 my-first-app 仓库 → 你应该能看到你的 index.html 和 package.json。
      - generic [ref=e152]:
        - generic [ref=e153]: .gitignore 的正确写法
        - paragraph [ref=e154]: 告诉Git"这些文件/文件夹不要管它们，不要上传"。
        - generic [ref=e155]:
          - generic [ref=e156]: OPC项目标准 .gitignore
          - generic [ref=e157]: "# 依赖包（太大，通过package.json记录就够了，不需要上传几万个小文件） node_modules/ # 环境变量（里面有密码、API密钥，绝对不能上传！） .env .env.local .env.*.local # 系统文件 .DS_Store # Mac自动生成的文件夹信息 Thumbs.db # Windows自动生成的缩略图 # 构建输出 dist/ build/ .next/ # IDE配置 .vscode/ .idea/ # 调试文件 *.log npm-debug.log*"
        - generic [ref=e158]:
          - generic [ref=e159]:
            - text: 不小心
            - heading "已经上传了不该上传的东西？" [level=3] [ref=e160]
          - generic [ref=e163]: "# 1. 先把文件加入.gitignore（比如你忘了忽略 node_modules） echo \"node_modules/\" >> .gitignore # 2. 从Git跟踪中移除（但不删除本地文件） git rm -r --cached node_modules/ # 3. 提交这个改动 git add .gitignore git commit -m \"添加.gitignore，移除误上传的node_modules\" # 4. 推送 git push"
