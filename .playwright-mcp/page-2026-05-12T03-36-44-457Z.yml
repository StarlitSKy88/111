            - generic [ref=e82]:
              - generic [ref=e83]: 注册Gitee（如果还没账号）
              - generic [ref=e84]: 打开 gitee.com → 点"注册"，用手机号或微信注册 → 登录后，点右上角头像 → "设置" → "SSH公钥"（先放着，等下用）
          - generic [ref=e85]:
            - generic [ref=e86]: "2"
            - generic [ref=e87]:
              - generic [ref=e88]: 注册GitHub（同上）
              - generic [ref=e89]: 打开 github.com → 点"Sign up"，用邮箱注册 → 登录后，点头像 → "Settings" → "SSH and GPG keys"
          - generic [ref=e90]:
            - generic [ref=e91]: "3"
            - generic [ref=e92]:
              - generic [ref=e93]: 生成SSH密钥（关键步骤）
              - generic [ref=e94]:
                - text: SSH密钥 = 你的电脑和Gitee/GitHub之间的"身份卡"。配好之后，推送代码不需要每次输密码。
                - text: 在VS Code终端中执行（一路回车，不要设密码）：
        - generic [ref=e95]:
          - generic [ref=e96]: 终端命令
          - generic [ref=e97]: ssh-keygen -t ed25519 -C "你的邮箱@example.com"
        - paragraph [ref=e98]: 终端会显示密钥保存位置。默认在：
        - list [ref=e99]:
          - listitem [ref=e100]: Mac：/Users/你的用户名/.ssh/id_ed25519.pub
          - listitem [ref=e101]: Windows：C:\Users\你的用户名\.ssh\id_ed25519.pub
        - generic [ref=e102]:
          - generic [ref=e103]:
            - generic [ref=e104]: 复制公钥 - Mac
            - generic [ref=e105]: 终端执行
