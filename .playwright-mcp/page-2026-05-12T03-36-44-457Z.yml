          - generic [ref=e107]:
            - generic [ref=e108]: 复制公钥 - Windows
            - generic [ref=e109]: PowerShell执行
            - generic [ref=e110]: type $env:USERPROFILE\.ssh\id_ed25519.pub
        - paragraph [ref=e111]:
          - text: 输出的内容类似
          - code [ref=e112]: ssh-ed25519 AAAAC3... 你的邮箱
          - text: 。复制全部。
