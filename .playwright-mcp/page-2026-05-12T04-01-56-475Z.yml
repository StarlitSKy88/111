        - heading "四、\"何时能全职\"：一套可操作的判断逻辑" [level=2] [ref=e187]
        - paragraph [ref=e188]: 辞职全职创业需要同时满足三个条件：
        - generic [ref=e189]:
          - heading "条件一：产品月收入覆盖个人生活支出" [level=4] [ref=e190]
          - paragraph [ref=e191]:
            - text: 你的产品每个月稳定进账 ≥ 你的房租+吃饭+交通。
            - strong [ref=e192]: 不是某一两个月
            - text: ，而是看
            - strong [ref=e193]: 连续6个月
            - text: 的平均值。如果某月¥30,000、下月¥0，不算稳定。
        - generic [ref=e194]:
          - heading "条件二：现金跑道 ≥ 12个月" [level=4] [ref=e195]
          - paragraph [ref=e196]:
            - text: 在零新增收入的情况下，你的存款够你维持12个月的生存。
            - text: 这12个月的缓冲不是让你躺平，是让你在连续两个月收入为零的时候仍然有试错空间。
        - generic [ref=e197]:
          - heading "条件三：有至少两个收入来源" [level=4] [ref=e198]
          - paragraph [ref=e199]: 不要把全部收入押在一个客户或一个产品上。
          - list [ref=e200]:
            - listitem [ref=e201]: 主产品收入 + 一个副流（咨询/外包/课程）
            - listitem [ref=e203]: 产品收入 + 存款利息/投资收入
            - listitem [ref=e205]: 产品对公收入 + 伴侣/家人稳定收入
        - blockquote [ref=e207]:
          - strong [ref=e208]: 满足三个条件 → 可以全职。
          - text: 否则 → 继续兼职验证。
