      - generic [ref=e372]: 七、工具绑定风险与迁移预案
      - heading "最大的风险：你根本不知道你的应用怎么跑起来的" [level=2] [ref=e373]
      - paragraph [ref=e374]: 2026年有大量"描述即生成"的工具。危险在于——它们在让你30分钟做出一个产品的同时，也让你对产品的技术细节完全失明。
      - paragraph [ref=e375]:
        - strong [ref=e376]: 真实案例：
        - text: 2025年底，某OPC用AI工具生成了一整套SaaS后端。半年后想迁移到自建服务器，发现数据库结构全嵌在平台私有方案里，迁移成本几乎等于重写。
      - heading "防锁死三原则" [level=3] [ref=e377]
      - generic [ref=e378]:
        - generic [ref=e379]:
          - generic [ref=e380]: 原则一
          - generic [ref=e381]: 第一天就下指令
        - paragraph [ref=e382]: 在任何AI工具中，第一次让它生成代码时就加上这段话：
        - generic [ref=e383]: "\"请用标准、通用的方案实现。数据库请用PostgreSQL标准SQL语法，鉴权请用JWT标准方案，避免任何平台专属函数或私有API。\""
      - generic [ref=e384]:
        - generic [ref=e385]:
          - generic [ref=e386]: 原则二
          - generic [ref=e387]: 理解核心流程
        - paragraph [ref=e388]: 不用会写，但要会读。每周挑一段AI生成的业务逻辑代码，用Cursor的"解释这段代码"功能理解它。你不需要成为程序员，但需要能在出问题时，用一句话准确描述问题给AI。
      - generic [ref=e389]:
        - generic [ref=e390]:
          - generic [ref=e391]: 原则三
          - generic [ref=e392]: 保持数据主权
        - paragraph [ref=e393]:
          - text: • 数据库用Supabase（开源，随时可以导出标准SQL）
          - text: • 代码托管在GitHub（你拥有完整的git历史）
          - text: • 域名在你自己的注册商手里（不要用平台送的临时域名）
          - text: • 不要在任何单一平台上同时绑定代码、数据库和域名
