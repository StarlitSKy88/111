          - heading "L1：录屏原型（半天）" [level=4] [ref=e299]
          - paragraph [ref=e300]: 用任何录屏工具录一段操作演示。发给目标用户问："如果你有这个，你会用吗？"——零代码验证需求。
        - generic [ref=e301]:
          - heading "L2：硬编码响应（一天）" [level=4] [ref=e302]
          - paragraph [ref=e303]: 前端做完整，但后端所有返回值都是写死的。用户点击"分析"，永远返回同一份模拟结果。验证的是交互流程。
        - generic [ref=e304]:
          - heading "L3：绿野仙踪模式（两天）" [level=4] [ref=e305]
          - paragraph [ref=e306]: 前端完整 + 用户提交后你手动用AI处理 + 粘贴结果回去。在用户看来系统是"自动"的，实际你是幕后的法师。
