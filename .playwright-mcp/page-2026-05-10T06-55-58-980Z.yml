              - cell "他的卡点是\"收到200份简历但没有一份能用，筛选太浪费时间\"" [ref=e194]
        - heading "五个追问魔法词" [level=3] [ref=e195]
        - paragraph [ref=e196]: 当用户说"XX好麻烦/好烦/好难"时，用这五个词追问：
        - list [ref=e197]:
          - listitem [ref=e198]:
            - strong [ref=e199]: "\"上次是？\""
            - text: → 把模糊抱怨变成具体场景
          - listitem [ref=e200]:
            - strong [ref=e201]: "\"怎么解决的？\""
            - text: → 了解现有方案的缺陷
          - listitem [ref=e202]:
            - strong [ref=e203]: "\"多久一次？\""
            - text: → 判断是高频痛点还是偶尔困扰
          - listitem [ref=e204]:
            - strong [ref=e205]: "\"最坏会怎样？\""
            - text: → 衡量痛点的真实代价
          - listitem [ref=e206]:
            - strong [ref=e207]: "\"试过别的吗？\""
            - text: → 了解竞品和替代方案
