        - generic [ref=e96]:
          - heading "第2步：找到对的人（2小时）" [level=4] [ref=e97]
          - paragraph [ref=e98]:
            - strong [ref=e99]: 你需要的不是"对品类感兴趣的"，而是"正在经历这个问题的"。
          - table [ref=e100]:
            - rowgroup [ref=e101]:
              - row "找人的渠道 适合场景 实操方法" [ref=e102]:
                - columnheader "找人的渠道" [ref=e103]
                - columnheader "适合场景" [ref=e104]
                - columnheader "实操方法" [ref=e105]
            - rowgroup [ref=e106]:
              - row "微信朋友圈/群聊 B2C、知识付费 发一条动态：\"想聊一下[某话题]，请喝咖啡（¥30红包），限10人\"" [ref=e107]:
                - cell "微信朋友圈/群聊" [ref=e108]
                - cell "B2C、知识付费" [ref=e109]
                - cell "发一条动态：\"想聊一下[某话题]，请喝咖啡（¥30红包），限10人\"" [ref=e110]
              - row "即刻/小红书私信 年轻用户、兴趣社区 搜索相关话题，找最近1周内发过相关内容的人私信" [ref=e111]:
                - cell "即刻/小红书私信" [ref=e112]
                - cell "年轻用户、兴趣社区" [ref=e113]
