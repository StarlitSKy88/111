              - cell "方向对但解法错" [ref=e47]
              - cell "~30%" [ref=e48]
              - cell "问了用户，但问法有诱导性" [ref=e49]
            - row "有用户但价格错 ~20% 没验证用户\"真掏钱\"的意愿" [ref=e50]:
              - cell "有用户但价格错" [ref=e51]
              - cell "~20%" [ref=e52]
              - cell "没验证用户\"真掏钱\"的意愿" [ref=e53]
            - row "其他 ~10% 法律、资金、技术等" [ref=e54]:
              - cell "其他" [ref=e55]
              - cell "~10%" [ref=e56]
              - cell "法律、资金、技术等" [ref=e57]
        - paragraph [ref=e58]:
          - strong [ref=e59]: 核心问题不是"会不会做"，而是"有没有搞清楚到底该做什么"。
        - heading "一个真实国内案例：微信红包" [level=3] [ref=e60]
        - paragraph [ref=e61]: 2014年春节，微信红包团队做了一件事——他们没去设计"觉得用户会喜欢"的功能，而是在广东地区观察春节期间人们真实的红包行为：
        - blockquote [ref=e62]:
          - text: ① 广东人过年发红包有"利是"传统（小额、高频）
          - text: ② 人们在微信群里的自然行为已经是"抢红包"（拼手气群接龙）
          - text: ③ 问题不是"怎么发红包"，而是"线下的红包怎么搬到线上还能保持那个感觉"
        - paragraph [ref=e63]: 他们把观察到的问题定义为："让用户在微信群里体验到和线下收红包一样的快乐"。然后才做了拼手气红包——不是先想功能再找用户，而是先看懂用户再想功能。
        - generic [ref=e64]:
          - generic [ref=e65]: OPC的铁律
          - paragraph [ref=e66]: 你的第一个版本，不应该超过5个人反复跟你聊过之后你才确定的。
      - separator [ref=e67]
      - generic [ref=e68]:
        - heading "二、10人1对1访谈法：OPC专属执行版" [level=2] [ref=e69]
        - heading "为什么是10人不是100人" [level=3] [ref=e70]
        - blockquote [ref=e71]:
          - text: Jakob Nielsen（尼尔森诺曼集团创始人）的研究表明：
          - strong [ref=e72]: 5个用户就能发现85%的可用性问题。
          - text: 10个人足以覆盖你目标用户的绝大多数行为模式。
        - paragraph [ref=e73]: 对OPC来说，10人访谈 = 你可以在一周内完成的验证规模。不需要问卷星、不需要广撒网——你一个人打电话、面谈、微信语音，全搞定。
        - heading "执行六步" [level=3] [ref=e74]
        - generic [ref=e75]:
          - heading "第1步：定义你的\"问题假设\"（30分钟）" [level=4] [ref=e76]
          - paragraph [ref=e77]: 在找人之前，先用一句话写下你的假设：
          - blockquote [ref=e78]: "\"我观察到[某类人]在[某个场景下]做[某件事]的时候，最困扰的是[某个问题]。\""
          - paragraph [ref=e79]:
            - strong [ref=e80]: 真实示例（国内OPC场景）
            - text: ：
          - table [ref=e81]:
            - rowgroup [ref=e82]:
              - row "不好的假设 好的假设" [ref=e83]:
                - columnheader "不好的假设" [ref=e84]
                - columnheader "好的假设" [ref=e85]
            - rowgroup [ref=e86]:
              - row "\"小企业需要CRM\" \"我观察到三线城市的建材批发店主，每天用微信手动回复几十个客户的询价，经常漏单、记错价格\"" [ref=e87]:
                - cell "\"小企业需要CRM\"" [ref=e88]
                - cell "\"我观察到三线城市的建材批发店主，每天用微信手动回复几十个客户的询价，经常漏单、记错价格\"" [ref=e89]
              - row "\"年轻人需要理财\" \"我观察到25-30岁的一线城市打工人，每月工资到账后不知道该怎么分配，余额宝利率越来越低但不敢碰基金\"" [ref=e90]:
                - cell "\"年轻人需要理财\"" [ref=e91]
                - cell "\"我观察到25-30岁的一线城市打工人，每月工资到账后不知道该怎么分配，余额宝利率越来越低但不敢碰基金\"" [ref=e92]
              - row "\"餐饮店需要小程序\" \"我观察到二线城市社区周边的独立咖啡馆，美团抽成22%后几乎没利润，想建自己的渠道但不会做\"" [ref=e93]:
