      - separator [ref=e276]
      - generic [ref=e277]:
        - heading "六、付费意愿验证：真金白银比承诺更诚实" [level=2] [ref=e278]
        - heading "为什么\"我愿意付费\"不可信" [level=3] [ref=e279]
        - paragraph [ref=e280]: 国内用户出于礼貌习惯性说"挺好的""应该会用"。这是OPC验证阶段的第一杀手。
        - generic [ref=e281]:
          - generic [ref=e282]: 数据
          - paragraph [ref=e283]:
            - text: 哈佛商学院研究——调查中表示"愿意购买"的用户，实际购买转化率仅为
            - strong [ref=e284]: 10%-20%
            - text: 。
        - heading "三种真实验证方法" [level=3] [ref=e285]
        - generic [ref=e286]:
          - heading "方法一：48小时预售页测试" [level=4] [ref=e287]
          - paragraph [ref=e288]: 做一个极简单页（用Trae或Canva），放上产品介绍 + 一个"预购"按钮。按钮链接到一个真实的收款页面（微信赞赏码/支付宝收款码）。
          - list [ref=e289]:
            - listitem [ref=e290]: 发给你访谈过的10个人 + 朋友圈/社群
            - listitem [ref=e291]: 48小时后看有多少人点了付款
            - listitem [ref=e292]:
              - strong [ref=e293]: 超过0人付款 = 信号成立
              - text: （哪怕只有¥9.9）
          - paragraph [ref=e294]:
            - strong [ref=e295]: 国内真实案例
            - text: ：2023年，一位独立开发者做了一个"小红书文案AI辅助工具"。在写任何代码之前，他在即刻上发了一条动态：
          - blockquote [ref=e296]: "\"做了一个小红书爆款标题生成器，输入你的主题，帮你生成10个标题。预售¥9.9，限前50人，加我微信付款。\""
          - paragraph [ref=e297]: 48小时内37人付款。他花了3天写了第一版。如果没人付钱——他连3天都不会浪费。
        - generic [ref=e298]:
          - heading "方法二：虚假门测试" [level=4] [ref=e299]
          - paragraph [ref=e300]: 在目标用户聚集的地方发布一个"内测招募"，设置一个门槛：
          - blockquote [ref=e301]: "\"我们正在做一个[产品简述]，首期开放20个内测名额，需要填写申请表并支付¥1锁定名额（正式上线后抵扣¥20）。\""
          - paragraph [ref=e302]:
            - text: 关键指标：
            - strong [ref=e303]: 登记率
            - text: 。如果看到信息的人里有超过20%填写了申请表——这比你问100个人"你会用吗"都更有说服力。
        - generic [ref=e304]:
          - heading "方法三：礼宾式交付" [level=4] [ref=e305]
          - paragraph [ref=e306]:
            - strong [ref=e307]: 不做产品，先做服务。你本人充当产品的"AI引擎"，手动为前3个用户提供结果。
          - paragraph [ref=e308]:
            - strong [ref=e309]: 典型操作
            - text: ：
          - list [ref=e310]:
            - listitem [ref=e311]: 用户发来需求 → 你手动用ChatGPT处理 → 把结果发给用户
            - listitem [ref=e312]: 用户不知道背后是人工
            - listitem [ref=e313]: 观察：用户愿意为这个结果付费吗？用户会回来吗？
          - paragraph [ref=e314]:
            - strong [ref=e315]: 国内案例
            - text: ：某知识付费创作者想做一个"帮你写周报"的AI工具。他没有先开发——他在微信上对10个朋友说："每周五把你这周的工作要点发我，我帮你写周报，¥19.9/次。"做了4周，发现复购率为零——不是需求不对，是写周报这事一个月都不一定需要一次。他调整方向做了"帮你写晋升答辩PPT"——客单价¥299，复购（跳槽/年度述职）稳定。
