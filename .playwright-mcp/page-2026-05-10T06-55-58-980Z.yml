    - main [ref=e29]:
      - heading "问题定义与用户调研" [level=1] [ref=e30]
      - paragraph [ref=e31]: 62%的一人公司在18个月内注销——大多数不是败于市场，而是败于从未验证过"我解决的是不是真问题"。本章不教问卷调查、不教SPSS分析——只教一套一个人72小时内就能完成的验证方法。
      - generic [ref=e32]:
        - heading "一、为什么用户访谈是OPC的生死线" [level=2] [ref=e33]
        - heading "国内OPC最常见的死法" [level=3] [ref=e34]
