                - cell "B2B、垂直行业" [ref=e121]
                - cell "在群里发一个具体问题求助，私聊愿意回答的人" [ref=e122]
              - row "朋友的朋友 所有场景 让朋友介绍，比直接找陌生人转化率高3倍" [ref=e123]:
                - cell "朋友的朋友" [ref=e124]
                - cell "所有场景" [ref=e125]
                - cell "让朋友介绍，比直接找陌生人转化率高3倍" [ref=e126]
          - paragraph [ref=e128]:
            - strong [ref=e129]: 关键原则
            - text: ：不要找你的朋友。朋友会出于礼貌说"挺好的"——这种反馈比没反馈更危险。
        - generic [ref=e130]:
          - heading "第3步：做访谈（每人30分钟）" [level=4] [ref=e131]
          - paragraph [ref=e132]:
            - strong [ref=e133]: 铁律
            - text: ：
          - list [ref=e134]:
            - listitem [ref=e135]: 不要解释你的产品
            - listitem [ref=e136]: 不要问"如果有一个工具可以……"
            - listitem [ref=e137]: 只问他们现在的行为、现在的痛点、现在的解决方案
        - generic [ref=e138]:
          - heading "第4步：记录（当场）" [level=4] [ref=e139]
          - paragraph [ref=e140]:
            - text: 用手机录音（征得同意），但更重要的是
            - strong [ref=e141]: 当场记笔记
            - text: ——你会在当场捕捉到录音里听不出来的东西：对方说某句话时皱了一下眉头、停顿了3秒、突然提高了音量。
        - generic [ref=e142]:
          - heading "第5步：找出模式（访谈结束后2小时）" [level=4] [ref=e143]
          - paragraph [ref=e144]:
            - text: 把10个人的访谈记录摊开，用荧光笔标注反复出现的词。
            - strong [ref=e145]: 如果10个人里有7个人不约而同地用了同一个词来形容他们的痛点——这就是你的产品应该解决的那个问题。
        - generic [ref=e146]:
          - heading "第6步：回到假设，修正或推翻（30分钟）" [level=4] [ref=e147]
          - paragraph [ref=e148]: 把你的原始假设和访谈结果对比。修正你的假设，或者——如果发现假设根本不对——果断放弃。这比做了半年产品才发现没人需要便宜得多。
      - separator [ref=e149]
      - generic [ref=e150]:
        - heading "三、访谈提问模板（直接复制使用）" [level=2] [ref=e151]
        - heading "模板A：面对面/微信语音访谈（30分钟版）" [level=3] [ref=e152]
        - generic [ref=e154]: ═══════════════════════════════════════ 用户访谈提纲 · OPC版 ═══════════════════════════════════════ 受访人：__________ 日期：__________ 行业/身份：__________ 访谈方式：__________ ━━━ 第一部分：热身（5分钟）━━━ 1. 先简单介绍一下你自己吧，平时主要做什么？ ━━━ 第二部分：理解现状（15分钟）━━━ 2. 你上次遇到[某问题]是在什么时候？能具体跟我讲讲当时的情况吗？ （追问：当时你是怎么解决的？花了多长时间？） 3. 这个问题多久出现一次？是一周几次、一个月一次、还是偶尔？ 4. 你目前用什么办法处理这个问题？ （追问：这个办法有什么不满意的地方吗？） 5. 你有没有尝试过其他的解决办法？为什么没用下去？ 6. 这个问题如果不解决，对你来说最大的代价是什么？ （追问：比如会损失钱、时间、机会？） ━━━ 第三部分：验证意愿（10分钟）━━━ 7. 如果有一个方案能帮你[解决核心问题]，你愿意为它付费吗？ （如果愿意）你觉得多少钱比较合理？ （如果不愿意）为什么？ 8. 你身边还有哪些人和你遇到了同样的问题？ （追问：方便介绍我聊聊吗？） ━━━ 第四部分：收尾 ━━━ 9. 还有什么我没问到、但你觉得我应该知道的吗？ 10. 如果后续有新的想法，我可以再找你聊几分钟吗？ ═══════════════════════════════════════
        - heading "模板B：微信文字访谈（轻量版）" [level=3] [ref=e155]
        - generic [ref=e157]: Hi [名字]，想请教你一个小问题~ 你平时[做某件事]的时候，有没有觉得特别麻烦的地方？ → 等对方回答后追问： "那你现在怎么处理这个麻烦？" "这个麻烦大概多久出现一次？" "如果花钱能解决，你觉得多少可以接受？" 感谢！送你一杯咖啡 [发30元红包]
      - separator [ref=e158]
      - generic [ref=e159]:
        - heading "四、从\"我好烦XX\"到真实需求的提取方法" [level=2] [ref=e160]
        - heading "用户说的 ≠ 用户需要的" [level=3] [ref=e161]
        - paragraph [ref=e162]:
          - strong [ref=e163]: 经典案例：滴滴早期
        - paragraph [ref=e164]: 2012年，程颐（滴滴创始人）自己在北京街头做了大量司机访谈。司机们说："最大的问题是找不到乘客。"但如果程颐直接做一个"帮司机找乘客"的工具，滴滴不会是今天的样子。
        - paragraph [ref=e165]:
          - text: 他多问了一层："
          - strong [ref=e166]: 除了找不到乘客之外，还有什么让你烦？
          - text: "\""
        - paragraph [ref=e167]: 司机说："最烦的是空车跑——不知道乘客在哪，跑过去发现人已经走了。"
        - paragraph [ref=e169]: 核心需求不是"匹配司机和乘客"，而是"减少空驶率"。
        - heading "提取公式" [level=3] [ref=e170]
