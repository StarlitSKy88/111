              - generic [ref=e103]: 打开 figma.com → 点击"Get started for free" → 用Google/邮箱注册 → 选择"Personal"免费计划。
          - generic [ref=e104]:
            - generic [ref=e105]: "2"
            - generic [ref=e106]:
              - generic [ref=e107]: 新建Frame（30秒）
              - generic [ref=e108]:
