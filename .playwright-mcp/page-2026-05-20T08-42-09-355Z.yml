          - generic [ref=e51]: 规模小=不稳定=随时跑路，这是甲方最本能的顾虑。
        - generic [ref=e52]:
          - generic [ref=e53]: 核心转化
          - generic [ref=e54]: 规模≠稳定，小而美反而更专注。关键在于：透明展示能力边界 + 建立系统化保障 + 用案例说话。
