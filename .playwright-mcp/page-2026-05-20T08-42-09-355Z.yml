          - generic [ref=e57]:
            - text: 1. 承认规模："我们确实是小团队，但正因为小，每一个项目都是我的名片"
            - text: 2. 展示保障："我们有标准化SOP和长期合作伙伴，单点故障不会影响交付"
            - text: 3. 用案例证明："您可以联系我们的客户，他们比我们更能说明问题"
