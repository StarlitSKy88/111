            - text: "\"您放心，我们不会跑路的……\"（赌咒发誓，无效）"
            - text: "\"我们和很多大公司有合作……\"（模糊表述，不可信）"
        - generic [ref=e63]:
          - generic [ref=e64]: 正确回答
          - generic [ref=e65]: "\"我理解您的顾虑。确实，我们是小团队——但正因为小，您的项目没有层层外包，直接到我，由我负责到底。我们公司是SOP社区形式，确保即使我生病或者跑路了，公司的其他OPC也可以和您进行非常顺利的对接——我们公司现在有48名OPC，分别负责不同的项目，每个人都是可以做决策+开发+售前售后的全栈工程师。\""
