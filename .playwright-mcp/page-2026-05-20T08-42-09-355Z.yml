          - generic [ref=e92]: "\"我确实没有做过您这个行业——但我做过类似的场景，解决的是同一个本质问题。您需要的不是模板复制，而是深度定制的方案。我的做法是：先和您聊30分钟，找到真正痛点，再出方案。当然如果我判断您的业务比较复杂或者独特，我们最好的解决方案就是入场一周左右。\""
