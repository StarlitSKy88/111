[databases]
one_mcn_test = host=localhost port=54322 dbname=one_mcn_test
test_restore = host=localhost port=54322 dbname=test_restore

[pgbouncer]
pool_mode = session  # 关键：session 模式才能保留 SET LOCAL app.tenant_id
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
log_connections = 1
log_disconnections = 1
