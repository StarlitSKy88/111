<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPC节点百科 — 知识图谱</title>
  <meta name="description" content="OPC节点百科 — 57 节点 / 7 阶段，一张图看清 OPC 创业完整路径">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111110'/><circle cx='16' cy='16' r='9' stroke='%23C0392B' stroke-width='1' fill='none'/><circle cx='16' cy='16' r='2.5' fill='%23C0392B'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;700&family=Noto+Serif+JP:wght@200;300;400;600&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <style>
    /* ========== MA TOKENS ========== */
    :root {
      --bg: #111110;
      --surface: #1A1A18;
      --text-primary: #F0EDE6;
      --text-secondary: #B8B4AE;
      --text-tertiary: #7A7670;
      --text-quaternary: #4A4744;
      --line: #2A2A28;
      --line-soft: #1F1F1D;
      --line-strong: #4A4744;
      --accent: #C0392B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    /* ========== MOTION ========== */
    .node-group, .link {
      will-change: transform, opacity;
    }

    /* Respect prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .node-group, .link, .col-headers {
        opacity: 1 !important;
        transform: none !important;
      }
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== HEADER ========== */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.875rem clamp(1.25rem, 4vw, 2.5rem);
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.875rem;
      letter-spacing: 0.15em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.625rem;
      font-weight: 400;
      text-decoration: none;
    }

    .logo-mark {
      width: 8px;
      height: 8px;
      border: 1px solid var(--text-tertiary);
      display: inline-block;
    }

    .nav-right {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-link {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.6875rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      text-decoration: none;
      transition: color 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .nav-link:hover { color: var(--text-primary); }
    .nav-link.active { color: var(--text-primary); }

    /* ========== STAGE FILTER (left rail) ========== */
    .stage-rail {
      position: fixed;
      top: 4.5rem;
      left: clamp(1.25rem, 4vw, 2.5rem);
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 220px;
    }

    .stage-rail-title {
      font-family: 'Noto Sans SC', sans-serif;
      color: var(--text-tertiary);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      font-size: 0.5rem;
      font-weight: 400;
    }

    .stage-chip {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 0.625rem 0;
      border-top: 1px solid var(--line-soft);
      cursor: pointer;
      background: transparent;
      border-left: none;
      border-right: none;
      border-bottom: none;
      text-align: left;
      width: 100%;
      font-family: inherit;
      transition: opacity 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .stage-chip:last-child { border-bottom: 1px solid var(--line-soft); }

    .stage-chip:hover { opacity: 0.7; }

    .stage-chip.active .stage-chip-num { color: var(--text-primary); }
    .stage-chip.active .stage-chip-name { color: var(--text-primary); }

    .stage-chip-num {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.875rem;
      color: var(--text-tertiary);
      font-weight: 300;
      letter-spacing: 0.05em;
      min-width: 1.5rem;
      transition: color 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .stage-chip-name {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: 0.02em;
      flex: 1;
    }

    .stage-chip-count {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.5625rem;
      color: var(--text-quaternary);
      letter-spacing: 0.1em;
      font-weight: 300;
    }

    .stage-reset {
      margin-top: 0.875rem;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.5625rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      text-align: left;
      font-weight: 400;
      transition: color 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .stage-reset:hover { color: var(--text-primary); }

    /* ========== GRAPH CANVAS ========== */
    #graph-container {
      position: fixed;
      inset: 0;
      z-index: 5;
    }

    #graph { width: 100%; height: 100%; display: block; }

    /* ========== HUGE BACKGROUND NUMBER (Ma anchor) ========== */
    .bg-number {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(280px, 32vw, 520px);
      font-weight: 200;
      fill: var(--text-primary);
      opacity: 0.025;
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    /* ========== STAGE HEADERS (positioned at stage centers) ========== */
    .stage-headers {
      pointer-events: none;
      user-select: none;
    }

    .stage-label-num {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      fill: var(--text-quaternary);
    }

    .stage-label-name {
      font-family: 'Noto Serif JP', serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.06em;
      fill: var(--text-secondary);
    }

    .stage-label-count {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 8px;
      font-weight: 300;
      letter-spacing: 0.15em;
      fill: var(--text-quaternary);
    }

    /* ========== LINKS (paths, allow curves) ========== */
    .link {
      fill: none;
      transition: stroke 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  stroke-width 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  opacity 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .link.sequential {
      stroke: var(--line-strong);
      stroke-width: 0.7;
      opacity: 0.38;
    }

    .link.reference {
      stroke: var(--text-tertiary);
      stroke-width: 0.9;
      opacity: 0.62;
    }

    .link.key {
      stroke: var(--accent);
      stroke-width: 1.1;
      opacity: 0.7;
    }

    .link.highlighted {
      stroke: var(--text-primary) !important;
      stroke-width: 1.5 !important;
      opacity: 1 !important;
    }

    .link.dimmed { opacity: 0.04 !important; }

    /* ========== NODES (small 6-9px, knowledge-graph feel) ========== */
    .node-group { cursor: pointer; }

    .node-circle {
      fill: var(--bg);
      stroke: var(--text-tertiary);
      stroke-width: 1;
      transition: stroke 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  stroke-width 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .node-group:hover .node-circle {
      stroke: var(--text-primary);
      stroke-width: 1.5;
    }

    .node-circle.key {
      fill: var(--accent);
      stroke: var(--accent);
      stroke-width: 1;
    }

    .node-id {
      font-family: 'Noto Serif JP', serif;
      font-size: 9px;
      font-weight: 400;
      text-anchor: middle;
      pointer-events: none;
      letter-spacing: 0.04em;
      fill: var(--text-primary);
      transition: fill 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .node-circle.key + .node-id { fill: var(--bg); }

    .node-group:hover .node-id { fill: var(--text-primary); }
    .node-group:hover .node-circle.key + .node-id { fill: var(--bg); }

    .node-label {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 8px;
      font-weight: 300;
      text-anchor: middle;
      pointer-events: none;
      letter-spacing: 0.04em;
      fill: var(--text-quaternary);
      transition: fill 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .node-group:hover .node-label { fill: var(--text-secondary); }

    .node-group.dimmed { opacity: 0.12; }
    .node-group.focused .node-circle { stroke: var(--text-primary); stroke-width: 1.5; }
    .node-group.focused .node-label { fill: var(--text-secondary); }

    /* ========== TITLE / STATS (top right) ========== */
    .meta-panel {
      position: fixed;
      top: 4.5rem;
      right: clamp(1.25rem, 4vw, 2.5rem);
      z-index: 90;
      max-width: 280px;
      text-align: right;
    }

    .meta-eyebrow {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.6875rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 0.5rem;
    }

    .meta-heading {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.125rem;
      font-weight: 300;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      margin-bottom: 0.875rem;
    }

    .meta-stats {
      display: flex;
      gap: 1.5rem;
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      padding-top: 0.625rem;
    }

    .meta-stat-value {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.25rem;
      font-weight: 300;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .meta-stat-label {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.5rem;
      color: var(--text-tertiary);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.25rem;
      font-weight: 400;
    }

    /* ========== SEARCH ========== */
    .search-panel {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 0.625rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.875rem;
      min-width: 320px;
      transition: border-color 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .search-panel:focus-within { border-color: var(--accent); }

    .search-icon {
      color: var(--text-tertiary);
      font-size: 0.875rem;
      font-weight: 300;
    }

    .search-input {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 0.8125rem;
      outline: none;
      letter-spacing: 0.04em;
      width: 280px;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
      font-size: 0.6875rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 300;
    }

    /* ========== ZOOM CONTROLS ========== */
    .zoom-controls {
      position: fixed;
      bottom: 2rem;
      right: clamp(1.25rem, 4vw, 2.5rem);
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .zoom-btn {
      width: 36px;
      height: 36px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text-secondary);
      font-size: 0.875rem;
      cursor: pointer;
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      transition: color 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  border-color 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .zoom-btn:hover { color: var(--text-primary); border-color: var(--text-primary); }
    .zoom-btn:first-child { border-bottom: none; }
    .zoom-btn .material { font-size: 14px; }

    /* ========== TOOLTIP ========== */
    .tooltip {
      position: fixed;
      z-index: 200;
      background: var(--bg);
      border: 1px solid var(--line-strong);
      padding: 1rem 1.25rem;
      max-width: 280px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  transform 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .tooltip.visible { opacity: 1; transform: translateY(0); }

    .tooltip-id {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.6875rem;
      color: var(--text-tertiary);
      letter-spacing: 0.2em;
      margin-bottom: 0.5rem;
    }

    .tooltip-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.9375rem;
      color: var(--text-primary);
      margin-bottom: 0.625rem;
      font-weight: 400;
      line-height: 1.3;
    }

    .tooltip-meta {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.625rem;
      font-size: 0.5625rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      font-weight: 300;
    }

    .tooltip-summary {
      font-size: 0.75rem;
      color: var(--text-secondary);
      line-height: 1.7;
      letter-spacing: 0.02em;
      font-weight: 300;
    }

    /* ========== MODAL ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 16, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--bg);
      border: 1px solid var(--line);
      max-width: 520px;
      width: 90%;
      padding: 2.5rem 3rem;
      transform: translateY(16px);
      transition: transform 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .modal-overlay.active .modal { transform: translateY(0); }

    .modal-id {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.75rem;
      color: var(--text-tertiary);
      letter-spacing: 0.3em;
      margin-bottom: 0.75rem;
    }

    .modal-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.5rem;
      color: var(--text-primary);
      font-weight: 300;
      line-height: 1.2;
      margin-bottom: 1.25rem;
      letter-spacing: -0.01em;
    }

    .modal-meta {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.6875rem;
      color: var(--text-tertiary);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
      font-weight: 300;
    }

    .modal-summary {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.9;
      margin-bottom: 1.75rem;
      letter-spacing: 0.02em;
      font-weight: 300;
    }

    .modal-actions {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .modal-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.6875rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-primary);
      text-decoration: none;
      border-bottom: 1px solid var(--text-primary);
      padding-bottom: 0.375rem;
      font-weight: 400;
      transition: opacity 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .modal-link:hover { opacity: 0.6; }
    .modal-link.accent { color: var(--accent); border-color: var(--accent); }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 0.6875rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.375rem 0;
      font-family: inherit;
      transition: color 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .modal-close:hover { color: var(--text-primary); }

    /* ========== MOBILE ========== */
    @media (max-width: 900px) {
      .stage-rail {
        top: 4rem;
        left: 1rem;
        right: 1rem;
        max-width: none;
        flex-direction: row;
        overflow-x: auto;
        gap: 1.25rem;
        padding-bottom: 0.5rem;
      }
      .stage-rail-title, .stage-reset { display: none; }
      .stage-chip {
        flex-shrink: 0;
        border-top: none;
        border-bottom: 1px solid var(--line-soft);
        padding: 0.5rem 0;
      }
      .stage-chip:last-child { border-bottom: 1px solid var(--line-soft); }
      .meta-panel { display: none; }
      .search-panel { min-width: auto; width: calc(100% - 2rem); left: 1rem; right: 1rem; transform: none; }
      .search-input { width: 100%; }
      .zoom-controls { bottom: 6rem; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-mark"></span>
      <span>OPC 节点百科</span>
    </a>
    <nav class="nav-right">
      <a href="index.html" class="nav-link">首页</a>
      <a href="graph.html" class="nav-link active">图谱</a>
    </nav>
  </header>

  <!-- META PANEL (top right) -->
  <div class="meta-panel">
    <div class="meta-eyebrow">知识图谱</div>
    <div class="meta-heading">57 节点的<br>完整路径</div>
    <div class="meta-stats">
      <div>
        <div class="meta-stat-value" id="stat-nodes">57</div>
        <div class="meta-stat-label">节点</div>
      </div>
      <div>
        <div class="meta-stat-value" id="stat-links">61</div>
        <div class="meta-stat-label">关系</div>
      </div>
      <div>
        <div class="meta-stat-value">7</div>
        <div class="meta-stat-label">阶段</div>
      </div>
    </div>
  </div>

  <!-- STAGE RAIL (left) -->
  <div class="stage-rail" id="stage-rail">
    <div class="stage-rail-title">阶段</div>
    <!-- Filled by JS -->
  </div>

  <!-- GRAPH -->
  <div id="graph-container">
    <svg id="graph"></svg>
  </div>

  <!-- SEARCH (bottom center) -->
  <div class="search-panel">
    <span class="search-icon">⌕</span>
    <input type="text" class="search-input" id="search" placeholder="搜索节点" autocomplete="off">
  </div>

  <!-- ZOOM CONTROLS (bottom right) -->
  <div class="zoom-controls">
    <button class="zoom-btn" id="zoom-in" title="放大"><span class="material">+</span></button>
    <button class="zoom-btn" id="zoom-out" title="缩小"><span class="material">−</span></button>
    <button class="zoom-btn" id="zoom-fit" title="重置视图" style="font-size:11px; letter-spacing:0;">RESET</button>
  </div>

  <!-- TOOLTIP -->
  <div class="tooltip" id="tooltip">
    <div class="tooltip-id" id="tooltip-id"></div>
    <div class="tooltip-title" id="tooltip-title"></div>
    <div class="tooltip-meta" id="tooltip-meta"></div>
    <div class="tooltip-summary" id="tooltip-summary"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-id" id="modal-id"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-meta" id="modal-meta"></div>
      <p class="modal-summary" id="modal-summary"></p>
      <div class="modal-actions">
        <a href="#" class="modal-link accent" id="modal-cta">进入节点 →</a>
        <button class="modal-close" onclick="closeModal()">关闭</button>
      </div>
    </div>
  </div>

  <script>
    /* ========== STAGES ========== */
    const STAGES = [
      { id: 'product',  name: '产品验证', range: [1, 6] },
      { id: 'env',      name: '环境搭建', range: [7, 10] },
      { id: 'core',     name: '核心开发', range: [11, 17] },
      { id: 'test',     name: '测试修复', range: [18, 21] },
      { id: 'launch',   name: '上线准备', range: [22, 30] },
      { id: 'ops',      name: '运营迭代', range: [31, 43] },
      { id: 'support',  name: '并行支撑', range: [44, 57] }
    ];

    const KEY_NODES = new Set([1, 11, 22, 30, 43, 57]);

    function getStage(nodeId) {
      for (const stage of STAGES) {
        if (nodeId >= stage.range[0] && nodeId <= stage.range[1]) return stage;
      }
      return STAGES[0];
    }

    /* ========== STAGE CENTERS (asymmetric Ma layout) ========== */
    const STAGE_CENTERS = {
      product: { x: 260,  y: 280 },
      env:     { x: 580,  y: 220 },
      core:    { x: 900,  y: 290 },
      test:    { x: 1180, y: 220 },
      launch:  { x: 1430, y: 380 },
      ops:     { x: 1130, y: 600 },
      support: { x: 420,  y: 700 }
    };

    const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3001'
      : window.location.origin;

    let nodesData = [];
    let graphNodes = [];
    let graphLinks = [];
    let svg, g, rootG, zoomBehavior;
    let nodeElements, linkElements, labelElements;
    let focusedStage = null;
    let simulation = null;

    /* ========== DATA ========== */
    async function loadNodes() {
      try {
        const response = await fetch(`${API_BASE}/api/nodes`);
        const data = await response.json();
        if (data.success && data.data && data.data.length > 0) {
          nodesData = data.data;
        } else {
          nodesData = getFallbackNodes();
        }
      } catch (e) {
        nodesData = getFallbackNodes();
      }
      buildGraphStructure();
    }

    function getFallbackNodes() {
      const names = [
        'OPC适配测试', '个人能力与资源盘点', '问题定义与用户调研', '产品原型设计',
        'MVP功能清单', '技术选型', '开发环境安装', 'Hello World启动',
        'Git版本控制', '后端CRUD连接', '用户认证系统', '核心功能1开发',
        '核心功能2开发', '数据展示交互', '核心功能3开发', '支付代码集成',
        '国内支付接入', '开发者自测', '亲友灰度测试', 'Bug集中修复',
        '性能基础优化', '上线内容填充', '公司注册', '域名ICP备案',
        '网站部署SSL', '审核材料准备', '上线前检查', '提交审核等待',
        '审核问题处理', '正式发布', '数据监控', '冷启动获客',
        '内容营销SEO', '用户反馈收集', '社群私域运营', 'AI客户服务',
        '客户异议应对', '定价策略', '广告投放', '用户转介绍',
        '每周迭代复盘', '收入多元化', '产品规模化', '银行开户商户号',
        '税务报到筹划', '现金流财务', '企业邮箱搭建', '商标申请',
        '软著登记', '广告合规', '数据备份恢复', '服务器安全防护',
        '海外支付方案', '微信小程序', '外包策略执行', '精力能量管理', '政府政策补贴'
      ];
      return names.map((title, i) => ({
        id: i + 1, title,
        slug: 'node-' + (i + 1),
        summary: '节点' + (i + 1),
        difficulty: '入门'
      }));
    }

    function buildGraphStructure() {
      graphNodes = nodesData.map(n => {
        const stage = getStage(n.id);
        return {
          id: n.id,
          title: n.title || `节点${n.id}`,
          slug: n.slug || 'node-' + n.id,
          summary: n.summary || '',
          difficulty: n.difficulty || '',
          stageId: stage.id,
          stageName: stage.name,
          isKey: KEY_NODES.has(n.id)
        };
      });

      graphLinks = [];

      // PHASE 2 SCHEME 5: ScrambleText for stat numbers
      scrambleCount('stat-nodes', graphNodes.length);
      scrambleCount('stat-links', 0); // will be updated by fetchNodeLinks
    }

    // 异步从 /api/node-links 拉取基于内容提取的关联
    async function fetchNodeLinks() {
      try {
        const resp = await fetch(`${API_BASE}/api/node-links`);
        const json = await resp.json();
        if (!json.success || !json.data) return;
        const data = json.data;
        const validIds = new Set(graphNodes.map(n => n.id));
        graphLinks = data.links
          .filter(l => validIds.has(l.source) && validIds.has(l.target))
          .map(l => ({ source: l.source, target: l.target, type: l.type }));
        scrambleCount('stat-links', graphLinks.length);
        // Bind link elements NOW that graphLinks has data
        renderLinkElements();
        // Restart force simulation so the new links drive topology
        applyForceLayout();
        // Re-run entrance animation to reveal the edges
        animateLinksEntrance();
      } catch (e) {
        console.warn('fetchNodeLinks failed:', e);
      }
    }

    function renderLinkElements() {
      const linksG = g.select('g.links');
      if (linksG.empty()) return;
      linkElements = linksG.selectAll('path')
        .data(graphLinks, d => d.source + '-' + d.target);
      linkElements.exit().remove();
      linkElements = linkElements.enter()
        .append('path')
        .attr('class', d => 'link ' + (d.type || 'sequential'))
        .merge(linkElements);
    }

    /* ========== PHASE 2 SCHEME 5: Number ScrambleText ========== */
    function scrambleCount(elId, finalValue) {
      const el = document.getElementById(elId);
      if (!el) return;
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced || typeof gsap === 'undefined') {
        el.textContent = finalValue;
        return;
      }
      const obj = { val: 0 };
      gsap.to(obj, {
        val: finalValue,
        duration: 1.4,
        ease: 'power2.out',
        onUpdate: () => {
          el.textContent = Math.round(obj.val);
        }
      });
    }

    /* ========== LAYOUT ENGINE (force / tree) ========== */
    // Resolve endpoint id from a link (D3 force replaces id strings with node refs)
    function linkEndId(endpoint) {
      return (endpoint && typeof endpoint === 'object') ? endpoint.id : endpoint;
    }

    function forceStage() {
      let nodes;
      function force(alpha) {
        // 极弱的阶段引力 — 只提供方向感，让内容引用边主导拓扑
        for (const node of nodes) {
          const center = STAGE_CENTERS[node.stageId];
          if (!center) continue;
          node.vx += (center.x - node.x) * alpha * 0.06;
          node.vy += (center.y - node.y) * alpha * 0.06;
        }
      }
      force.initialize = function(n) { nodes = n; };
      return force;
    }

    function applyForceLayout() {
      // Reset fixed positions
      graphNodes.forEach(n => { n.fx = null; n.fy = null; });

      if (simulation) simulation.stop();
      const width = window.innerWidth;
      const height = window.innerHeight;

      simulation = d3.forceSimulation(graphNodes)
        .force("link", d3.forceLink(graphLinks)
          .id(d => d.id)
          // 距离：让引用边跨越更远，关键边最远
          .distance(d => d.type === 'key' ? 300 : (d.type === 'reference' ? 200 : 55))
          // 强度：让内容引用成为图谱主角
          .strength(d => d.type === 'key' ? 0.45 : (d.type === 'reference' ? 0.55 : 0.85)))
        .force("charge", d3.forceManyBody().strength(-180))
        .force("collide", d3.forceCollide().radius(24))
        .force("stage", forceStage())
        .force("center", d3.forceCenter(width / 2, height / 2))
        .alpha(1)
        .alphaDecay(0.022)
        .on("tick", ticked);

      ticked();
    }

    function applyLayout() {
      // 仅 FORCE 布局 — 节点关联由内容驱动
      applyForceLayout();
      // Update stage header positions (anchored)
      updateStageHeaders();
      // Refit after a tick
      setTimeout(fitToScreen, 1500);
    }

    /* ========== GRAPH BUILD ========== */
    function buildGraph() {
      svg = d3.select('#graph');
      const width = window.innerWidth;
      const height = window.innerHeight;
      svg.attr('viewBox', [0, 0, width, height])
         .attr('preserveAspectRatio', 'xMidYMid meet');

      rootG = svg.append('g').attr('class', 'root');
      g = rootG.append('g').attr('class', 'zoom-target');

      // HUGE BACKGROUND NUMBER (Ma anchor, fixed in zoom-target)
      g.append('text')
        .attr('class', 'bg-number')
        .attr('x', width * 0.5)
        .attr('y', height * 0.72)
        .text('57');

      // STAGE HEADERS (positioned at stage centers)
      buildStageHeaders();

      // LINKS container — paths will be created after fetchNodeLinks() resolves
      // (avoids binding to an empty array, which produced 0 visible edges)
      const linksG = g.append('g').attr('class', 'links');
      linkElements = linksG.selectAll('path').data(graphLinks);

      // NODES (groups, positioned via transform)
      const nodeG = g.append('g').attr('class', 'nodes');
      nodeElements = nodeG.selectAll('g')
        .data(graphNodes)
        .enter()
        .append('g')
        .attr('class', d => 'node-group' + (d.isKey ? ' key' : ''))
        .attr('data-id', d => d.id)
        .attr('data-stage', d => d.stageId)
        .on('mouseover', showTooltip)
        .on('mouseout', hideTooltip)
        .on('click', showNodeModal)
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));

      nodeElements.append('circle')
        .attr('class', d => 'node-circle' + (d.isKey ? ' key' : ''))
        .attr('r', d => d.isKey ? 9 : 6);

      nodeElements.append('text')
        .attr('class', 'node-id')
        .attr('dy', '0.32em')
        .text(d => String(d.id).padStart(2, '0'));

      labelElements = nodeElements.append('text')
        .attr('class', 'node-label')
        .attr('dy', '2.3em')
        .text(d => d.title.length > 7 ? d.title.substring(0, 7) + '··' : d.title);

      // Zoom behavior
      zoomBehavior = d3.zoom()
        .scaleExtent([0.3, 3])
        .on('zoom', (event) => g.attr('transform', event.transform));
      svg.call(zoomBehavior);

      // Apply initial layout (FORCE only)
      applyLayout();
    }

    function buildStageHeaders() {
      // Remove existing
      g.selectAll('.stage-headers').remove();
      const headerG = g.append('g').attr('class', 'stage-headers');
      STAGES.forEach((stage, sIdx) => {
        const c = STAGE_CENTERS[stage.id];
        const count = stage.range[1] - stage.range[0] + 1;
        headerG.append('text')
          .attr('class', 'stage-label-num')
          .attr('x', c.x).attr('y', c.y - 90)
          .attr('text-anchor', 'middle')
          .text('STAGE ' + String(sIdx + 1).padStart(2, '0'));
        headerG.append('text')
          .attr('class', 'stage-label-name')
          .attr('x', c.x).attr('y', c.y - 70)
          .attr('text-anchor', 'middle')
          .text(stage.name);
        headerG.append('text')
          .attr('class', 'stage-label-count')
          .attr('x', c.x).attr('y', c.y - 52)
          .attr('text-anchor', 'middle')
          .text(count + ' NODES');
      });
    }

    function updateStageHeaders() {
      // Just re-position if needed (kept static for stability)
      // Could be updated to follow stage centroids in force layout
    }

    /* ========== TICKED (rendering) ========== */
    function ticked() {
      if (!linkElements) return;
      linkElements.attr('d', d => {
        // Resolve endpoints (D3 force uses object refs, tree uses ID strings)
        const srcNode = (typeof d.source === 'object') ? d.source : graphNodes.find(n => n.id === d.source);
        const tgtNode = (typeof d.target === 'object') ? d.target : graphNodes.find(n => n.id === d.target);
        if (!srcNode || !tgtNode || srcNode.x == null || tgtNode.x == null) return '';
        const sx = srcNode.x, sy = srcNode.y, tx = tgtNode.x, ty = tgtNode.y;
        if (d.type === 'key' || d.type === 'reference') {
          // Curve for key/reference (Bezier)
          const dx = tx - sx;
          const dy = ty - sy;
          const dr = Math.sqrt(dx * dx + dy * dy) * (d.type === 'key' ? 0.7 : 0.55);
          return `M${sx},${sy} Q${(sx + tx) / 2 + dx * 0.15},${(sy + ty) / 2 - dr * 0.3} ${tx},${ty}`;
        }
        return `M${sx},${sy} L${tx},${ty}`;
      });
      if (nodeElements) {
        nodeElements.attr('transform', d => `translate(${d.x || 0}, ${d.y || 0})`);
      }
    }

    /* ========== FIT TO SCREEN (using bbox) ========== */
    function fitToScreen() {
      if (graphNodes.length === 0 || !zoomBehavior) return;
      const xs = graphNodes.map(n => n.x);
      const ys = graphNodes.map(n => n.y);
      const padding = 80;
      const minX = Math.min(...xs) - padding;
      const maxX = Math.max(...xs) + padding;
      const minY = Math.min(...ys) - padding;
      const maxY = Math.max(...ys) + padding;
      const bboxW = Math.max(maxX - minX, 200);
      const bboxH = Math.max(maxY - minY, 200);
      const width = window.innerWidth;
      const height = window.innerHeight;
      const scale = Math.min(width / bboxW, height / bboxH) * 0.92;
      const tx = (width - bboxW * scale) / 2 - minX * scale;
      const ty = (height - bboxH * scale) / 2 - minY * scale;
      svg.transition().duration(800).call(
        zoomBehavior.transform,
        d3.zoomIdentity.translate(tx, ty).scale(scale)
      );
    }

    /* ========== DRAG ========== */
    function dragstarted(event, d) {
      if (!event.active && simulation) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
      d.x = event.x;
      d.y = event.y;
      // Immediate visual update
      d3.select(this).attr('transform', `translate(${d.x}, ${d.y})`);
      // Update connected links (handle both force [object] and tree [id] references)
      d3.selectAll('.link').each(function(l) {
        const srcId = linkEndId(l.source);
        const tgtId = linkEndId(l.target);
        if (srcId === d.id || tgtId === d.id) {
          const sx = srcId === d.id ? d.x : (typeof l.source === 'object' ? l.source.x : (graphNodes.find(n => n.id === srcId) || {}).x);
          const sy = srcId === d.id ? d.y : (typeof l.source === 'object' ? l.source.y : (graphNodes.find(n => n.id === srcId) || {}).y);
          const tx = tgtId === d.id ? d.x : (typeof l.target === 'object' ? l.target.x : (graphNodes.find(n => n.id === tgtId) || {}).x);
          const ty = tgtId === d.id ? d.y : (typeof l.target === 'object' ? l.target.y : (graphNodes.find(n => n.id === tgtId) || {}).y);
          if (sx == null || sy == null || tx == null || ty == null) return;
          let path;
          if (l.type === 'key' || l.type === 'reference') {
            const dx = tx - sx;
            const dy = ty - sy;
            const dr = Math.sqrt(dx * dx + dy * dy) * (l.type === 'key' ? 0.7 : 0.55);
            path = `M${sx},${sy} Q${(sx + tx) / 2 + dx * 0.15},${(sy + ty) / 2 - dr * 0.3} ${tx},${ty}`;
          } else {
            path = `M${sx},${sy} L${tx},${ty}`;
          }
          d3.select(this).attr('d', path);
        }
      });
    }

    function dragended(event, d) {
      if (!event.active && simulation) simulation.alphaTarget(0);
      // Release fixed position so node returns to natural position
      d.fx = null;
      d.fy = null;
    }

    /* ========== STAGE RAIL ========== */
    function buildStageRail() {
      const rail = document.getElementById('stage-rail');
      const title = rail.querySelector('.stage-rail-title');
      rail.innerHTML = '';
      rail.appendChild(title);

      STAGES.forEach((stage, sIdx) => {
        const count = stage.range[1] - stage.range[0] + 1;
        const btn = document.createElement('button');
        btn.className = 'stage-chip';
        btn.dataset.stage = stage.id;
        btn.innerHTML = `
          <span class="stage-chip-num">${String(sIdx + 1).padStart(2, '0')}</span>
          <span class="stage-chip-name">${stage.name}</span>
          <span class="stage-chip-count">${count}</span>
        `;
        btn.addEventListener('click', () => focusStage(stage.id));
        rail.appendChild(btn);
      });

      const reset = document.createElement('button');
      reset.className = 'stage-reset';
      reset.textContent = '重置视图';
      reset.addEventListener('click', () => { focusedStage = null; updateStageRail(); clearFocus(); fitToScreen(); });
      rail.appendChild(reset);
    }

    function focusStage(stageId) {
      focusedStage = stageId;
      updateStageRail();
      applyFocus();
      // PHASE 2 SCHEME 3: Cinematic camera fly-to
      flyToStage(stageId);
    }

    /* ========== PHASE 2 SCHEME 3: Camera fly-to ========== */
    function flyToStage(stageId) {
      const stageNodes = graphNodes.filter(n => n.stageId === stageId);
      if (stageNodes.length === 0) return;

      // Compute stage centroid from current node positions (works for force/tree)
      const xs = stageNodes.map(n => n.x);
      const ys = stageNodes.map(n => n.y);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const targetX = (minX + maxX) / 2;
      const targetY = (minY + maxY) / 2;

      // Bounding box of this stage
      const padding = 100;
      const bboxW = Math.max(maxX - minX + padding * 2, 360);
      const bboxH = Math.max(maxY - minY + padding * 2, 360);

      const width = window.innerWidth;
      const height = window.innerHeight;
      // Scale to fit the stage cluster while leaving comfortable margin
      const scale = Math.min(width / bboxW, height / bboxH) * 0.88;
      const safeScale = Math.max(0.6, Math.min(scale, 1.8));
      const tx = width / 2 - targetX * safeScale;
      const ty = height / 2 - targetY * safeScale;

      const newTransform = d3.zoomIdentity.translate(tx, ty).scale(safeScale);

      if (typeof gsap === 'undefined' || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        svg.call(zoomBehavior.transform, newTransform);
      } else {
        svg.transition().duration(1200).ease(d3.easeCubicInOut)
          .call(zoomBehavior.transform, newTransform);
      }
    }

    function clearFocus() {
      nodeElements.classed('dimmed', false).classed('focused', false);
      linkElements.classed('dimmed', false);
    }

    function applyFocus() {
      if (!focusedStage) return clearFocus();
      // dim all non-stage nodes/links
      nodeElements
        .classed('dimmed', d => d.stageId !== focusedStage)
        .classed('focused', d => d.stageId === focusedStage);
      linkElements.classed('dimmed', d => {
        const sid1 = getStage(linkEndId(d.source)).id;
        const sid2 = getStage(linkEndId(d.target)).id;
        return !(sid1 === focusedStage && sid2 === focusedStage);
      });
    }

    function updateStageRail() {
      document.querySelectorAll('.stage-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.stage === focusedStage);
      });
    }

    /* ========== INTERACTIONS ========== */
    function showTooltip(event, d) {
      const tooltip = document.getElementById('tooltip');
      document.getElementById('tooltip-id').textContent = '节点 ' + String(d.id).padStart(2, '0');
      document.getElementById('tooltip-title').textContent = d.title;
      document.getElementById('tooltip-meta').innerHTML =
        `<span>${d.stageName}</span><span>·</span><span>${d.difficulty || '通用'}</span>`;
      document.getElementById('tooltip-summary').textContent = d.summary || '暂无描述。';

      // position near cursor but keep on screen
      const tx = Math.min(event.pageX + 20, window.innerWidth - 300);
      const ty = Math.min(event.pageY - 10, window.innerHeight - 200);
      tooltip.style.left = tx + 'px';
      tooltip.style.top = ty + 'px';
      tooltip.classList.add('visible');

      linkElements.classed('highlighted', l =>
        linkEndId(l.source) === d.id || linkEndId(l.target) === d.id
      );
    }

    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('visible');
      linkElements.classed('highlighted', false);
    }

    function showNodeModal(event, d) {
      event.stopPropagation();
      const modal = document.getElementById('modal');
      document.getElementById('modal-id').textContent = '节点 ' + String(d.id).padStart(2, '0');
      document.getElementById('modal-title').textContent = d.title;
      document.getElementById('modal-meta').innerHTML =
        `<span>${d.stageName}</span><span>·</span><span>${d.difficulty || '通用'}</span>`;
      document.getElementById('modal-summary').textContent = d.summary || '暂无描述。';

      const baseUrl = API_BASE.includes('localhost') ? 'http://localhost:3002' : '';
      document.getElementById('modal-cta').href = `${baseUrl}/nodes/${d.slug}/index.html`;
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function setupEventListeners() {
      const searchInput = document.getElementById('search');
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (!query) {
          nodeElements.classed('dimmed', false);
          linkElements.classed('dimmed', false);
          return;
        }
        nodeElements.classed('dimmed', d =>
          !(d.title.toLowerCase().includes(query) || String(d.id).includes(query))
        );
        linkElements.classed('dimmed', d => {
          const src = graphNodes.find(n => n.id === linkEndId(d.source));
          const tgt = graphNodes.find(n => n.id === linkEndId(d.target));
          const match = (n) => n && (n.title.toLowerCase().includes(query) || String(n.id).includes(query));
          return !(match(src) || match(tgt));
        });
      });

      document.getElementById('zoom-in').addEventListener('click', () => {
        svg.transition().duration(600).call(zoomBehavior.scaleBy, 1.3);
      });
      document.getElementById('zoom-out').addEventListener('click', () => {
        svg.transition().duration(600).call(zoomBehavior.scaleBy, 1 / 1.3);
      });
      document.getElementById('zoom-fit').addEventListener('click', () => {
        fitToScreen();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });

      document.getElementById('modal').addEventListener('click', (e) => {
        if (e.target.classList.contains('modal-overlay')) closeModal();
      });

      window.addEventListener('resize', () => fitToScreen());
    }

    /* ========== ENTRANCE (GSAP) ========== */
    function animateEntrance() {
      if (typeof gsap === 'undefined') {
        return animateEntranceD3();
      }

      const nodeArr = nodeElements.nodes();
      const linkArr = linkElements.nodes();
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (reduced) {
        gsap.set(nodeArr, { opacity: 1, y: 0 });
        gsap.set(linkArr, { opacity: (i, el) => {
          const d = d3.select(el).datum();
          return d.type === 'key' ? 0.7 : (d.type === 'reference' ? 0.62 : 0.38);
        }});
        return;
      }

      // Initial state: all invisible
      gsap.set(nodeArr, { opacity: 0, y: 12 });
      gsap.set(linkArr, { opacity: 0 });

      const tl = gsap.timeline();

      // Stage-by-stage reveal — let the knowledge graph emerge organically
      STAGES.forEach((stage, sIdx) => {
        const stageNodeEls = nodeArr.filter(el => {
          const d = d3.select(el).datum();
          return d && d.stageId === stage.id;
        });
        const stageLinkEls = linkArr.filter(el => {
          const l = d3.select(el).datum();
          if (!l) return false;
          const sid1 = getStage(linkEndId(l.source)).id;
          const sid2 = getStage(linkEndId(l.target)).id;
          return sid1 === stage.id && sid2 === stage.id;
        });

        const at = sIdx * 0.18;
        tl.to(stageNodeEls, {
          opacity: 1,
          y: 0,
          duration: 0.7,
          stagger: 0.025,
          ease: 'sine.out'
        }, at);

        if (stageLinkEls.length) {
          tl.to(stageLinkEls, {
            opacity: 0.6,
            duration: 0.55,
            stagger: 0.012,
            ease: 'sine.inOut'
          }, at + 0.2);
        }
      });

      // Key + reference links fade in last (these carry the cross-stage "knowledge")
      const extraLinkEls = linkArr.filter(el => {
        const l = d3.select(el).datum();
        return l && (l.type === 'key' || l.type === 'reference');
      });
      if (extraLinkEls.length) {
        tl.to(extraLinkEls, {
          opacity: (i, el) => {
            const d = d3.select(el).datum();
            return d.type === 'key' ? 0.7 : 0.62;
          },
          duration: 0.8,
          stagger: 0.025,
          ease: 'sine.out'
        }, STAGES.length * 0.18 + 0.1);
      }
    }

    // D3 fallback (used when GSAP not yet loaded)
    function animateEntranceD3() {
      nodeElements.style('opacity', 0);
      linkElements.style('opacity', 0);

      STAGES.forEach((stage, sIdx) => {
        const stageNodes = nodeElements.filter(d => d.stageId === stage.id);
        const stageLinks = linkElements.filter(l => {
          const sid1 = getStage(linkEndId(l.source)).id;
          const sid2 = getStage(linkEndId(l.target)).id;
          return sid1 === stage.id || sid2 === stage.id;
        });

        stageNodes.transition()
          .duration(700)
          .delay(sIdx * 200)
          .style('opacity', 1);

        stageLinks.transition()
          .duration(600)
          .delay(sIdx * 200 + 200)
          .style('opacity', d => d.type === 'key' ? 0.7 : (d.type === 'reference' ? 0.62 : 0.38));
      });
    }

    /* ========== INIT ========== */
    async function init() {
      buildStageRail();
      await loadNodes();
      buildGraph();
      setupEventListeners();
      // 拉取基于内容提取的节点关联（内部会创建 link 元素 + 启动 simulation）
      await fetchNodeLinks();
      // 全图入场（节点阶段式揭示 + 边淡入）
      animateEntrance();
    }

    // fetchNodeLinks 完成后让 link 元素从不可见淡入到目标透明度
    function animateLinksEntrance() {
      if (!linkElements || linkElements.empty()) return;
      const linkArr = linkElements.nodes();
      const targetOpacity = (d) => d.type === 'key' ? 0.7 : (d.type === 'reference' ? 0.62 : 0.38);

      if (typeof gsap === 'undefined') {
        linkElements.transition()
          .duration(900)
          .delay((d, i) => i * 8)
          .style('opacity', targetOpacity);
        return;
      }

      gsap.set(linkArr, { opacity: 0 });
      gsap.to(linkArr, {
        opacity: (i, el) => targetOpacity(d3.select(el).datum()),
        duration: 0.9,
        stagger: { each: 0.008, from: 'random' },
        ease: 'sine.out'
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => init());
    } else {
      // Wait one tick for deferred GSAP scripts to attach to window
      setTimeout(init, 0);
    }
  </script>
</body>
</html>
