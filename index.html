<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OPC适配自测 - 10道题，AI分析你是否适合做一人公司。">
  <meta name="theme-color" content="#111110">
  <title>OPC适配自测</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111110'/><circle cx='16' cy='16' r='12' stroke='%23C0392B' stroke-width='1.5' fill='none'/><circle cx='16' cy='16' r='5' fill='%23C0392B'/></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

  <style>
    /* ========================================
       Ma (間) Design System — 墨色暗色模式
       响应式移动优先
       ======================================== */

    :root {
      --bg: #111110;
      --surface: #1A1A18;
      --text-primary: #F0EDE6;
      --text-secondary: #7A7670;
      --text-tertiary: #4A4644;
      --accent: #C0392B;
      --accent-dark: #a33025;
      --line: #2A2A28;
      --success: #22c55e;
      --danger: #ef4444;
    }

    /* === Reset & Base === */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Noto Sans SC', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      line-height: 1.8;
      letter-spacing: 0.03em;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch;
    }

    /* === Typography — Mobile First === */
    .text-display {
      font-size: clamp(2.5rem, 12vw, 8rem);
      font-weight: 200;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .text-headline {
      font-size: clamp(1.125rem, 5vw, 1.75rem);
      font-weight: 300;
      letter-spacing: -0.015em;
      line-height: 1.5;
    }

    .text-body {
      font-size: 0.875rem;
      line-height: 1.85;
      letter-spacing: 0.02em;
    }

    .text-label {
      font-size: 0.625rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* === Ma Grid — Mobile First === */
    .ma-layout {
      display: grid;
      grid-template-columns: 1fr;
      padding: 0 1.25rem;
      gap: 0;
    }

    .ma-center {
      grid-column: 1;
      max-width: 100%;
    }

    /* === Spacing — Mobile First === */
    .section-gap {
      padding-top: 3rem;
      padding-bottom: 3rem;
    }

    @media (min-width: 640px) {
      .ma-layout {
        padding: 0 clamp(1.5rem, 5vw, 4rem);
      }
      .section-gap {
        padding-top: 5rem;
        padding-bottom: 5rem;
      }
      .text-body {
        font-size: 0.9375rem;
        line-height: 1.9;
      }
    }

    /* === Progress Bar === */
    .progress-bar {
      height: 1px;
      background: var(--line);
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: var(--progress, 0%);
      background: var(--accent);
      transition: width 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
      padding: 0 0.25rem;
    }

    /* === Question Number === */
    .question-number {
      font-size: 0.5625rem;
      letter-spacing: 0.22em;
      color: var(--text-tertiary);
      text-transform: uppercase;
    }

    /* === Option Button — Mobile First === */
    .opt {
      display: block;
      width: 100%;
      text-align: left;
      padding: 1rem 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .opt::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 0;
      height: 1px;
      background: var(--accent);
      transform: translateY(-50%);
      transition: width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .opt:hover {
      padding-left: 1.25rem;
    }

    .opt:hover::before {
      width: 0.5rem;
    }

    .opt:active {
      background: rgba(192, 57, 43, 0.05);
    }

    .opt-key {
      display: inline-block;
      width: 1.25rem;
      font-size: 0.6875rem;
      color: var(--text-tertiary);
      margin-right: 1rem;
    }

    .opt.selected {
      padding-left: 1.25rem;
    }

    .opt.selected::before {
      width: 0.5rem;
    }

    .opt.selected .opt-key {
      color: var(--accent);
    }

    @media (min-width: 640px) {
      .opt {
        padding: 1.25rem 0;
      }
      .opt:hover {
        padding-left: 1.5rem;
      }
      .opt:hover::before {
        width: 0.75rem;
      }
      .opt.selected {
        padding-left: 1.5rem;
      }
      .opt.selected::before {
        width: 0.75rem;
      }
      .opt-key {
        width: 1.5rem;
        font-size: 0.75rem;
        margin-right: 1.25rem;
      }
    }

    /* === Loading === */
    .spinner {
      width: 20px;
      height: 20px;
      border: 1px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: rotate 1s linear infinite;
    }

    @media (min-width: 640px) {
      .spinner {
        width: 24px;
        height: 24px;
      }
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    /* === Score Display === */
    .score {
      font-size: clamp(4rem, 22vw, 10rem);
      font-weight: 100;
      letter-spacing: -0.06em;
      line-height: 1;
      color: var(--accent);
    }

    /* === Result Screen === */
    .result-section {
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--line);
    }

    .result-section:first-child {
      padding-top: 0;
    }

    @media (min-width: 640px) {
      .result-section {
        padding: 4rem 0;
      }
    }

    /* Strengths & Weaknesses Grid */
    .result-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 640px) {
      .result-grid {
        grid-template-columns: 1fr 1fr;
        gap: 3rem;
      }
    }

    /* === Actions — 文字链接风格 === */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      padding: 2rem 0;
    }

    .action {
      display: inline-block;
      padding: 0.5rem 0;
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: all 0.4s ease;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      min-height: 44px;
      line-height: 1.5;
    }

    .action:hover {
      color: var(--text-primary);
      border-bottom-color: var(--text-primary);
    }

    @media (min-width: 640px) {
      .action {
        font-size: 0.8125rem;
        letter-spacing: 0.1em;
      }
    }

    /* === Share Card === */
    #share-card {
      background: var(--surface);
      padding: 2rem 1.5rem;
      border: 1px solid var(--line);
      margin: 0 -0.5rem;
    }

    @media (min-width: 640px) {
      #share-card {
        padding: 3rem 2rem;
        margin: 0;
      }
    }

    /* === PDF Button === */
    .btn-pdf {
      display: block;
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 0.6875rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease;
      min-height: 48px;
    }

    .btn-pdf:hover {
      background: var(--accent-dark);
    }

    @media (min-width: 640px) {
      .btn-pdf {
        font-size: 0.75rem;
        letter-spacing: 0.15em;
      }
    }

    /* === Hidden === */
    .hidden {
      display: none;
    }

    /* === Error State === */
    .input-error {
      border-color: var(--danger) !important;
    }

    .error-message {
      color: var(--danger);
      font-size: 0.75rem;
      margin-top: 0.5rem;
      text-align: center;
    }

    /* === Button Disabled === */
    .btn-disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* === Animations === */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-up {
      animation: fadeUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      opacity: 0;
    }

    @keyframes scoreIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .score-in {
      animation: scoreIn 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* === Focus States === */
    :focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 3px;
    }

    /* === Selection === */
    ::selection {
      background: var(--accent);
      color: #fff;
    }

    /* === Skip Link (Accessibility) === */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 0;
      background: var(--accent);
      color: #fff;
      padding: 0.75rem 1.5rem;
      z-index: 9999;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: top 0.3s ease;
    }

    .skip-link:focus {
      top: 0;
      outline: none;
    }

    /* === Scrollbar === */
    ::-webkit-scrollbar {
      width: 2px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--text-tertiary);
    }

    /* === Reduced Motion === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* === Safe Area (iPhone notch) === */
    @supports (padding: max(0px)) {
      .ma-layout {
        padding-left: max(1.25rem, env(safe-area-inset-left));
        padding-right: max(1.25rem, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>
  <!-- Skip to main content for accessibility -->
  <a href="#main-content" class="skip-link">跳转到主要内容</a>
  <!-- 节点百科区块 -->
<section id="nodes-section" style="padding: 4rem 0; background: var(--surface);">
  <div class="ma-layout">
    <div class="ma-center">
      <div style="margin-bottom: 2rem;">
        <div class="text-label" style="margin-bottom: 0.5rem; color: var(--accent);">OPC节点百科</div>
        <h2 class="text-headline" style="margin-bottom: 0.5rem;">21个创业节点</h2>
        <p class="text-body" style="color: var(--text-secondary);">
          从0到1，你需要解决21个节点。<br>
          点击任意节点，获取AI整理的详细攻略。
        </p>
      </div>

      <!-- 难度筛选 -->
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
        <button class="action" onclick="filterNodes('all')" id="filter-all">全部</button>
        <button class="action" onclick="filterNodes('入门')" id="filter-入门">入门</button>
        <button class="action" onclick="filterNodes('进阶')" id="filter-进阶">进阶</button>
        <button class="action" onclick="filterNodes('高级')" id="filter-高级">高级</button>
      </div>

      <!-- 节点网格 -->
      <div id="nodes-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--line);">
        <!-- 动态生成 -->
      </div>
    </div>
  </div>
</section>

<div id="app" tabindex="-1"></div>
  <script src="app.js"></script>
</body>
</html>
