<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPC适配自测 | 豆包帮你分析</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
    .option-btn { transition: all 0.2s; }
    .option-btn:hover { transform: scale(1.02); }
    .option-btn.selected { border-color: #f97316; background-color: #fff7ed; }
    .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #f97316; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes scoreReveal { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
    .animate-score { animation: scoreReveal 1s ease-out forwards; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .shimmer { background: linear-gradient(90deg, #f97316 25%, #fbbf24 50%, #f97316 75%); background-size: 200% 100%; animation: shimmer 2s linear infinite; -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <div id="app" class="max-w-2xl mx-auto px-4 py-8"></div>
  <script src="app.js"></script>
</body>
</html>
