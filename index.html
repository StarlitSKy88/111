<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OPC适配自测 - 10道题，AI分析你是否适合做一人公司。">
  <meta name="theme-color" content="#111110">
  <title>OPC适配自测</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111110'/><circle cx='16' cy='16' r='12' stroke='%23C0392B' stroke-width='1.5' fill='none'/><circle cx='16' cy='16' r='5' fill='%23C0392B'/></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

  <style>
    /* ========================================
       Ma (間) Design System — 墨色暗色模式
       ======================================== */

    :root {
      --bg: #111110;
      --surface: #1A1A18;
      --text-primary: #F0EDE6;
      --text-secondary: #7A7670;
      --text-tertiary: #4A4644;
      --accent: #C0392B;
      --line: #2A2A28;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: 'Noto Sans SC', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      line-height: 2;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
    }

    /* === Typography === */
    .text-display {
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 200;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .text-headline {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.4;
    }

    .text-body {
      font-size: 0.9375rem;
      line-height: 1.9;
      letter-spacing: 0.03em;
    }

    .text-label {
      font-size: 0.6875rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* === Ma Grid === */
    .ma-layout {
      display: grid;
      grid-template-columns: 1fr min(56ch, 100%) 1fr;
      padding: 0 clamp(1.25rem, 4vw, 4rem);
    }

    .ma-center {
      grid-column: 2;
    }

    /* === Spacing (8px base) === */
    .section-gap {
      padding-top: 7rem;
      padding-bottom: 7rem;
    }

    /* === Progress Bar === */
    .progress-bar {
      height: 1px;
      background: var(--line);
      position: relative;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: var(--progress, 0%);
      background: var(--accent);
      transition: width 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* === Question Text === */
    .question-number {
      font-size: 0.625rem;
      letter-spacing: 0.2em;
      color: var(--text-tertiary);
      text-transform: uppercase;
    }

    /* === Option Button — 极简无装饰 === */
    .opt {
      display: block;
      width: 100%;
      text-align: left;
      padding: 1.25rem 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
    }

    .opt::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 0;
      height: 1px;
      background: var(--accent);
      transform: translateY(-50%);
      transition: width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .opt:hover {
      padding-left: 1.5rem;
    }

    .opt:hover::before {
      width: 0.75rem;
    }

    .opt-key {
      display: inline-block;
      width: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-tertiary);
      margin-right: 1.25rem;
    }

    .opt.selected {
      padding-left: 1.5rem;
    }

    .opt.selected::before {
      width: 0.75rem;
    }

    .opt.selected .opt-key {
      color: var(--accent);
    }

    /* === Loading === */
    .spinner {
      width: 24px;
      height: 24px;
      border: 1px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: rotate 1s linear infinite;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    /* === Score Display === */
    .score {
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 100;
      letter-spacing: -0.06em;
      line-height: 1;
      color: var(--accent);
    }

    /* === Result Card === */
    .result-section {
      padding: 4rem 0;
      border-bottom: 1px solid var(--line);
    }

    .result-section:first-child {
      padding-top: 0;
    }

    /* === Actions — 文字链接风格 === */
    .action {
      display: inline-block;
      padding: 0.75rem 0;
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: all 0.4s ease;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-size: 0.8125rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .action:hover {
      color: var(--text-primary);
      border-bottom-color: var(--text-primary);
    }

    /* === Share Card === */
    #share-card {
      background: var(--surface);
      padding: 3rem 2rem;
      border: 1px solid var(--line);
    }

    /* === PDF Button === */
    .btn-pdf {
      display: block;
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-pdf:hover {
      background: #a33025;
    }

    /* === Animations — 书法笔触感 === */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-up {
      animation: fadeUp 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      opacity: 0;
    }

    @keyframes scoreIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .score-in {
      animation: scoreIn 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* === Focus States === */
    :focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 4px;
    }

    /* === Selection === */
    ::selection {
      background: var(--accent);
      color: #fff;
    }

    /* === Scrollbar === */
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--text-tertiary);
    }

    /* === Reduced Motion === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
