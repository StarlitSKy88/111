  <style>
    :root {
      --bg: #111110;
      --surface: #1A1A18;
      --text-primary: #F0EDE6;
      --text-secondary: #7A7670;
      --text-tertiary: #A8A49E;
      --accent: #C0392B;
      --line: #2A2A28;
      --space-xs: 8px;
      --space-sm: 16px;
      --space-md: 24px;
      --space-lg: 32px;
      --space-xl: 48px;
      --space-2xl: 64px;
      --space-3xl: 96px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 300;
      line-height: 1.8;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem clamp(24px, 8vw, 120px);
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }
    .back-link {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      text-decoration: none;
    }
    .back-link:hover { color: var(--text-primary); }
    .node-id {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.75rem;
      color: var(--text-tertiary);
      letter-spacing: 0.1em;
    }
    .redirect-box {
      max-width: 600px;
      text-align: center;
      padding: var(--space-2xl);
    }
    .redirect-box h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: var(--space-lg);
    }
    .redirect-box p {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: var(--space-xl);
      line-height: 1.8;
    }
    .redirect-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2rem;
      background: var(--accent);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.875rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: opacity 0.3s;
    }
    .redirect-btn:hover { opacity: 0.8; }
    .note {
      margin-top: var(--space-xl);
      font-size: 13px;
      color: var(--text-tertiary);
    }
    .footer-nav {
      display: flex;
      justify-content: space-between;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem clamp(24px, 8vw, 120px);
      border-top: 1px solid var(--line);
      background: var(--bg);
    }
    .nav-link {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-link:hover { color: var(--text-primary); }
    .nav-arrow { font-size: 0.6rem; }
