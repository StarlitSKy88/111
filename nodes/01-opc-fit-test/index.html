<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="description" content="入口节点，测试你是否适合做OPC，AI推荐最适合你的创业路径">
  <meta name="theme-color" content="#111110">
  <title>OPC适配测试 - OPC节点百科</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111110'/><circle cx='16' cy='16' r='12' stroke='%23C0392B' stroke-width='1.5' fill='none'/><circle cx='16' cy='16' r='5' fill='%23C0392B'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111110;
      --surface: #1A1A18;
      --text-primary: #F0EDE6;
      --text-secondary: #7A7670;
      --text-tertiary: #4A4744;
      --accent: #C0392B;
      --line: #2A2A28;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    /* Container — asymmetric Ma layout */
    #app {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 clamp(1.25rem, 5vw, 2.5rem);
    }

    /* Typography — bold and dramatic */
    .text-display {
      font-size: clamp(2.25rem, 10vw, 4.5rem);
      font-weight: 300;
      letter-spacing: -0.04em;
      line-height: 1.08;
      color: var(--text-primary);
    }

    .text-headline {
      font-size: clamp(1.25rem, 4vw, 1.625rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: var(--text-primary);
    }

    .text-body {
      font-size: clamp(0.9375rem, 2.5vw, 1.0625rem);
      line-height: 1.85;
      color: var(--text-secondary);
    }

    .text-label {
      font-size: 0.6875rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
    }

    .text-small {
      font-size: 0.8125rem;
      color: var(--text-tertiary);
    }

    /* Landing Screen */
    .landing {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: clamp(3rem, 12vh, 6rem);
      padding-bottom: clamp(3rem, 10vh, 5rem);
      animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .landing-header {
      margin-bottom: clamp(2.5rem, 8vh, 4rem);
    }

    .landing-title {
      margin-top: 1.5rem;
      margin-bottom: 1.75rem;
    }

    .landing-desc {
      max-width: 38ch;
      margin-bottom: clamp(2rem, 6vh, 3rem);
    }

    /* Feature list — minimal dots */
    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: clamp(2.5rem, 7vh, 3.5rem);
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--text-secondary);
      font-size: 0.9375rem;
    }

    .feature-dot {
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* CTA Button */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      padding: 1rem 1.75rem;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }

    .btn-primary:hover::before {
      transform: translateX(100%);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(192, 57, 43, 0.3);
    }

    .btn-primary .arrow {
      font-size: 0.75rem;
      transition: transform 0.3s;
    }

    .btn-primary:hover .arrow {
      transform: translateX(3px);
    }

    /* Social proof */
    .social-proof {
      margin-top: auto;
      padding-top: clamp(2.5rem, 8vh, 4rem);
      border-top: 1px solid var(--line);
    }

    .social-proof p {
      color: var(--text-tertiary);
      font-size: 0.8125rem;
    }

    .social-proof strong {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Question Screen */
    .question {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: clamp(2rem, 8vh, 4rem);
      padding-bottom: clamp(2rem, 6vh, 3rem);
      animation: fadeIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .question-header {
      margin-bottom: clamp(2rem, 6vh, 3rem);
    }

    .progress-wrap {
      margin-bottom: 1rem;
    }

    .progress-bar {
      height: 2px;
      background: var(--line);
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: var(--progress, 0%);
      background: var(--accent);
      transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 0.625rem;
    }

    .progress-num {
      font-size: 0.625rem;
      letter-spacing: 0.15em;
      color: var(--text-tertiary);
      text-transform: uppercase;
    }

    .progress-pct {
      font-size: 0.625rem;
      letter-spacing: 0.1em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .question-text {
      margin-bottom: clamp(1.5rem, 5vh, 2.5rem);
    }

    /* Options */
    .options {
      display: flex;
      flex-direction: column;
    }

    .opt {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 1.125rem 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      text-align: left;
      position: relative;
    }

    .opt::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 0;
      height: 1px;
      background: var(--accent);
      transform: translateY(-50%);
      transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .opt:hover {
      padding-left: 1.25rem;
    }

    .opt:hover::after {
      width: 0.625rem;
    }

    .opt-key {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border: 1px solid var(--line);
      border-radius: 50%;
      margin-right: 1rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .opt:hover .opt-key {
      border-color: var(--accent);
      color: var(--accent);
    }

    .opt.selected .opt-key {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .opt-text {
      font-size: clamp(0.9375rem, 2.5vw, 1rem);
      line-height: 1.5;
    }

    .opt.btn-disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Results Screen */
    .results {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: clamp(3rem, 10vh, 5rem);
      padding-bottom: clamp(3rem, 8vh, 4rem);
      animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .score-wrap {
      text-align: center;
      margin-bottom: clamp(2rem, 6vh, 3rem);
    }

    .score {
      font-size: clamp(5rem, 25vw, 10rem);
      font-weight: 200;
      line-height: 1;
      color: var(--accent);
      letter-spacing: -0.05em;
      animation: scoreReveal 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @keyframes scoreReveal {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .score-label {
      font-size: 0.625rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-top: 1rem;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: clamp(1.5rem, 5vw, 2rem);
      text-align: center;
      margin-bottom: clamp(1.5rem, 5vh, 2rem);
    }

    .result-verdict {
      font-size: clamp(1.25rem, 4vw, 1.5rem);
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    .result-suggestion {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
      align-items: center;
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.9375rem 1.5rem;
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--line);
      cursor: pointer;
      font-size: 0.875rem;
      letter-spacing: 0.03em;
      transition: all 0.3s;
      text-decoration: none;
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Loading */
    .loading {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-bar {
      width: 100%;
      height: 1px;
      background: var(--line);
      position: relative;
      overflow: hidden;
      max-width: 160px;
    }

    .loading-bar::after {
      content: '';
      position: absolute;
      left: -50%;
      top: 0;
      width: 50%;
      height: 100%;
      background: var(--accent);
      animation: loadingSlide 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }

    @keyframes loadingSlide {
      from { left: -50%; }
      to { left: 100%; }
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      color: var(--text-tertiary);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: color 0.3s;
      margin-bottom: 1.5rem;
    }

    .back-link:hover {
      color: var(--text-primary);
    }

    .back-link .icon {
      font-size: 0.875rem;
    }

    /* Analyzing state */
    .analyzing {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 0;
    }

    .analyzing-pulse {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      margin-bottom: 1.5rem;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .opt { padding: 1rem 0; }
      .opt-key { width: 1.75rem; height: 1.75rem; font-size: 0.6875rem; }
      .btn-primary, .btn-outline { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <div class="loading-bar"></div>
    </div>
  </div>

  <script>
    const QUESTIONS_URL = './questions.json';

    const state = {
      currentQuestion: 0,
      answers: {},
      results: null,
      questions: []
    };

    async function loadQuestions() {
      const res = await fetch(QUESTIONS_URL);
      return await res.json();
    }

    function renderLanding() {
      return `
        <div class="container landing">
          <div class="landing-header">
            <a href="/" class="back-link"><span class="icon">←</span> 返回首页</a>
            <div class="text-label">OPC适配自测</div>
          </div>

          <h1 class="text-display landing-title">你适合做<br>一人公司吗？</h1>

          <p class="text-body landing-desc">
            10道题，5分钟，测试你是否适合做OPC（一人公司）。<br>
            基于2026年最新创业模型评估。
          </p>

          <div class="feature-list">
            <div class="feature-item">
              <span class="feature-dot"></span>
              <span>AI驱动的个性化评估</span>
            </div>
            <div class="feature-item">
              <span class="feature-dot"></span>
              <span>精准匹配你的创业阶段</span>
            </div>
            <div class="feature-item">
              <span class="feature-dot"></span>
              <span>获取专属成长路径</span>
            </div>
          </div>

          <button id="startBtn" class="btn-primary">
            开始测试
            <span class="arrow">→</span>
          </button>

          <div class="social-proof">
            <p>已有 <strong>12,847</strong> 人完成测试</p>
          </div>
        </div>
      `;
    }

    function renderQuestion(q, index, total) {
      const progress = (index / total) * 100;
      const optionsHtml = q.options.map(opt =>
        `<button class="opt" data-id="${q.id}" data-key="${opt.key}">
          <span class="opt-key">${opt.key}</span>
          <span class="opt-text">${opt.text}</span>
        </button>`
      ).join('');

      return `
        <div class="container question">
          <div class="question-header">
            <a href="/" class="back-link"><span class="icon">←</span> 退出测试</a>
            <div class="progress-wrap">
              <div class="progress-bar" style="--progress: ${progress}%"></div>
              <div class="progress-meta">
                <span class="progress-num">${String(index).padStart(2, '0')} / ${String(total).padStart(2, '0')}</span>
                <span class="progress-pct">${Math.round(progress)}%</span>
              </div>
            </div>
          </div>

          <h2 class="text-headline question-text">${q.text}</h2>

          <div class="options">
            ${optionsHtml}
          </div>
        </div>
      `;
    }

    function selectOption(questionId, key, btn) {
      state.answers[questionId] = key;

      document.querySelectorAll('.opt').forEach(b => b.classList.add('btn-disabled'));
      btn.classList.add('selected');

      setTimeout(() => {
        if (state.currentQuestion < state.questions.length - 1) {
          state.currentQuestion++;
          render();
        } else {
          submitResults();
        }
      }, 350);
    }

    async function submitResults() {
      document.getElementById('app').innerHTML = `
        <div class="container analyzing">
          <div class="analyzing-pulse"></div>
          <div class="text-label" style="margin-bottom: 0.75rem;">分析中</div>
          <p class="text-body">正在生成你的专属报告...</p>
        </div>
      `;

      await new Promise(r => setTimeout(r, 1800));

      const dimensionScores = calculateDimensionScores();
      const fitScore = dimensionScores.total;
      state.results = {
        id: 'opc_' + Date.now(),
        fit_score: fitScore,
        answers: state.answers,
        dimensions: dimensionScores
      };

      localStorage.setItem('opc_result_id', state.results.id);
      localStorage.setItem('opc_fit_score', fitScore);
      localStorage.setItem('opc_dimensions', JSON.stringify(dimensionScores));

      render();
    }

    // Calculate 6-dimension scores mapped from 10 questions
    function calculateDimensionScores() {
      const getScore = (qId, scoreKey) => {
        const q = state.questions.find(q => q.id === qId);
        if (!q) return 3;
        const opt = q.options.find(o => o.key === state.answers[qId]);
        return opt && opt.scores ? (opt.scores[scoreKey] ?? 3) : 3;
      };

      // D1 核心 (Core) = Q1(opc_fit) + Q9(motivation) — 商业闭环驱动力
      const d1Core = Math.round(((getScore(1, 'opc_fit') + getScore(9, 'motivation')) / 2) * 20);

      // D2 结构 (Structure) = Q4(skill) → T型能力结构 (技术/销售/内容/无专长)
      const skillMap = { content: 4, sales: 5, tech: 3, none: 2 };
      const skillVal = skillMap[getScore(4, 'skill')] || 3;
      const d2Structure = Math.round(skillVal * 20);

      // D3 连接 (Connection) = Q6(network) — 反转：人脉越少越需要连接能力
      const networkVal = getScore(6, 'network');
      const d3Connection = Math.round((5 - networkVal) * 20);

      // D4 领导 (Leadership) = Q2(time) + Q5(patience) — AI领导力基础
      const d4Leadership = Math.round(((getScore(2, 'time') + getScore(5, 'patience')) / 2) * 20);

      // D5 避坑 (Avoid Pitfalls) = Q7(experience) — 失败经验是最好的商学院
      const expVal = getScore(7, 'experience');
      const d5Pitfalls = Math.round((expVal + 1) * 20);

      // D6 决策 (Decision) = Q3(capital) + Q10(urgency) — 风险意识与决策框架
      const capitalRisk = getScore(3, 'capital');
      const urgencyVal = getScore(10, 'urgency');
      const d6Decision = Math.round(((capitalRisk + (5 - urgencyVal)) / 2) * 20);

      // Total weighted average (D1/D6权重1.2倍，体现核心与决策的重要性)
      const total = Math.round((d1Core * 1.2 + d2Structure + d3Connection + d4Leadership + d5Pitfalls + d6Decision * 1.2) / 6.4);

      return {
        D1: Math.min(100, d1Core),
        D2: Math.min(100, d2Structure),
        D3: Math.min(100, d3Connection),
        D4: Math.min(100, d4Leadership),
        D5: Math.min(100, d5Pitfalls),
        D6: Math.min(100, d6Decision),
        total: Math.min(100, total)
      };
    }

    // Legacy function for backward compatibility
    function calculateScore() {
      return state.results ? state.results.fit_score : 50;
    }

    function renderResults() {
      const score = state.results.fit_score;
      let verdict, suggestion;

      if (score >= 80) {
        verdict = '非常适合';
        suggestion = '你具备做一人公司的核心素质。立即开始你的创业旅程！';
      } else if (score >= 60) {
        verdict = '适合';
        suggestion = '你有潜力成为一人公司创始人。建议从轻量级副业开始尝试。';
      } else if (score >= 40) {
        verdict = '待提升';
        suggestion = '建议先积累一些技能和资源。可以从节点2开始系统性准备。';
      } else {
        verdict = '暂不适合';
        suggestion = 'OPC需要一定准备。建议先提升核心竞争力，再考虑创业。';
      }

      return `
        <div class="container results">
          <a href="/" class="back-link"><span class="icon">←</span> 返回首页</a>

          <div class="score-wrap">
            <div class="score">${score}</div>
            <div class="score-label">适配分数</div>
          </div>

          <div class="result-card">
            <div class="text-label" style="margin-bottom: 0.75rem;">评估结果</div>
            <h2 class="result-verdict">${verdict}</h2>
            <p class="result-suggestion">${suggestion}</p>
          </div>

          <div class="result-actions">
            <a href="/nodes/02-personal-resources/index.html" class="btn-primary">
              开始节点2：个人资源盘点
              <span class="arrow">→</span>
            </a>
            <a href="/" class="btn-outline">返回首页</a>
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');

      if (state.results) {
        app.innerHTML = renderResults();
      } else if (state.currentQuestion > 0 && state.questions.length > 0) {
        app.innerHTML = renderQuestion(
          state.questions[state.currentQuestion],
          state.currentQuestion + 1,
          state.questions.length
        );
        bindOptions();
      } else {
        app.innerHTML = renderLanding();
        bindStartBtn();
      }
    }

    function bindOptions() {
      document.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', function() {
          selectOption(
            parseInt(this.dataset.id),
            this.dataset.key,
            this
          );
        });
      });
    }

    function bindStartBtn() {
      const btn = document.getElementById('startBtn');
      if (btn) {
        btn.addEventListener('click', function() {
          state.currentQuestion = 0;
          state.answers = {};
          state.results = null;

          if (state.questions.length > 0) {
            document.getElementById('app').innerHTML = renderQuestion(
              state.questions[0],
              1,
              state.questions.length
            );
            bindOptions();
          }
        });
      }
    }

    async function init() {
      try {
        const data = await loadQuestions();
        state.questions = data.questions || [];
        render();
      } catch (e) {
        console.error('Load error:', e);
        document.getElementById('app').innerHTML = `
          <div class="container analyzing">
            <p class="text-body" style="color: var(--text-secondary); margin-bottom: 1rem;">加载失败，请刷新重试</p>
